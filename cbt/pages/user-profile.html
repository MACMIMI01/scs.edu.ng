<!-- user-profile.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Page</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../scripts/css/font-awesome.min.css">
    <style>
        /* Add some basic styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
        }
        table {
            border-collapse: collapse;
            width: 100%;
            background-color: #FFFFFF;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th {
            background-color: #020169;
            color: #FFFFFF;
        }
        .user-details {
            display: none;
            background-color: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        .profile-picture {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
        }
        
        #users-table tr:nth-child(even) {
            background-color: #020169;
            color: #FFFFFF;
        }
        
        #users-table tr:nth-child(odd) {
        background-color: #1877f2;
        color: #FFFFFF;
        }
        #users-table tr:hover {
        background-color: #FFFFFF;
        color: #020169;
        }
        
        #back-button {
        background-color: #1877f2;
        color: #FFFFFF;
        padding: 10px 20px; 
        border-radius: 5px; 
        cursor: pointer;
        text-align: center;
        position: fixed;
        top: 10px;
        right: 10px;        
        border-radius: 0%;
        object-fit: cover;
        border: 2px solid #020169;
        cursor: pointer;
        z-index: 999;
      
    </style>
</head>
<body>
    <div class="container">
        <h2 style="color: #020169;">Registered Users</h2>
        <table id="users-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Role</th>
                </tr>
            </thead>
            <tbody id="users-tbody"></tbody>
        </table>
        <div id="user-details" class="user-details">
            <h2 style="color: #020169;">User Details</h2>
            <div>
            <button id="back-button">Back to Table</button>   
            </div>
            <img id="profile-picture" class="profile-picture" src="" alt="Profile Picture">
            <p id="name"></p>
            <p id="username"></p>
            <p id="date-of-birth"></p>
            <p id="email"></p>
            <p id="role"></p>
            <p id="class"></p>
            <p id="password">*********</p>
            <input type="checkbox" id="show-password-checkbox"><label for="show-password-checkbox">Show Password</label>
            <div>
                <button id="hint-button" style="background-color: #1877f2; color: #FFFFFF; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer;">Show Hint</button>                            
            <p id="hint" style="display: none;"></p>
            </div>            
        </div>
    </div>

    <script>
        // Fetch users data from users.json file
        fetch('../data/users.json')
            .then(response => response.json())
            .then(users => {
                const usersTbody = document.getElementById('users-tbody');
                users.forEach(user => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.role}</td>
                    `;
                    row.addEventListener('click', () => {
                        document.getElementById('users-table').style.display = 'none';
                        document.getElementById('user-details').style.display = 'block';
                        showUserDetails(user);
                    });
                    usersTbody.appendChild(row);
                });
            })
            .catch(error => console.error('Error fetching users:', error));

        function showUserDetails(user) {
            document.getElementById('profile-picture').src = user.profilePicture;
            document.getElementById('name').textContent = `Name: ${user.name}`;
            document.getElementById('username').textContent = `Username: ${user.username}`;
            document.getElementById('date-of-birth').textContent = `Date of Birth: ${user['date of birth']}`;
            document.getElementById('email').textContent = `Email: ${user.email}`;
            document.getElementById('role').textContent = `Role: ${user.role}`;
            document.getElementById('class').textContent = `Class: ${user.class}`;

            document.getElementById('show-password-checkbox').addEventListener('change', (e) => {
                if (e.target.checked) {
                    const passcode = prompt('(Use Hint To Reset The passcode):');
                    if (passcode === getCurrentDate()) {
                        document.getElementById('password').textContent = `Password: ${user.password}`;
                    } else {
                        alert('Invalid passcode');
                        document.getElementById('show-password-checkbox').checked = false;
                    }
                } else {
                    document.getElementById('password').textContent = '*********';
                }
            });

            document.getElementById('hint-button').addEventListener('click', () => {
                const hints = [
                    'What has keys but can\'t open locks?',
                    'What starts with an E, ends with an E, but only contains one letter?',
                    'What is always coming but never arrives?'
                ];
                const randomHint = hints[Math.floor(Math.random() * hints.length)];
                const hintElement = document.getElementById('hint');
                if (hintElement.style.display === 'none') {
                    hintElement.style.display = 'block';
                    hintElement.textContent = randomHint;
                    document.getElementById('hint-button').textContent = 'Hide Hint';
                } else {
                    hintElement.style.display = 'none';
                    document.getElementById('hint-button').textContent = 'Show Hint';
                }
            });

            document.getElementById('back-button').addEventListener('click', () => {
                document.getElementById('users-table').style.display = 'block';
                document.getElementById('user-details').style.display = 'none';
            });
        }

        function getCurrentDate() {
            const date = new Date();
            const day = date.getDate().toString().padStart(2, '0');
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const year = date.getFullYear();
            return `${day}${month}${year}`;
        }
    </script>
</body>
</html>
