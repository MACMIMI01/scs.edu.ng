<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In & Sign Up</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- CSS styles here -->
    <style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap');

*{
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Montserrat', sans-serif;
}

body{
    background-color: #Fec007;
    background: linear-gradient(to right, #FEC007, #FEC009);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    height: 100vh;
    margin: 10px;
}

.container{
    background-color: #fff;
    border-radius: 30px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35);
    position: relative;
    overflow: hidden;
    width: 768px;
    max-width: 100%;
    min-height: 580px; 
}

.container p{
    font-size: 14px;
    line-height: 20px;
    letter-spacing: 0.3px;
    margin: 20px 0;
}

.container span{
    font-size: 12px;
    margin: 10px 0;
}

.container a{
    color: #333;
    font-size: 13px;
    text-decoration: none;
    margin: 15px 0 10px;
}

.container button{
    background-color: #512da8;
    color: #fff;
    font-size: 12px;
    padding: 10px 45px;
    border: 1px solid transparent;
    border-radius: 8px;
    font-weight: 600;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    margin-top: 10px;
    cursor: pointer;
}

.container button.hidden{
    background-color: transparent;
    border-color: #fff;
}

.container form{
    background-color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 0 40px;
    height: 100%;
}

.container input {
    background-color: #eee;
    border: none;
    margin: 8px 0;
    padding: 10px 15px;
    font-size: 13px;
    border-radius: 8px;
    width: 100%;
    outline: none;
}

.container select {
    background-color: #eee;
    border: none;
    margin: 8px 0;
    padding: 10px 15px;
    font-size: 13px;
    border-radius: 8px;
    width: 100%;
    outline: none;
    color: #333;
}

.form-container{
    position: absolute;
    top: 0;
    height: 100%;
    transition: all 0.6s ease-in-out;
}

.sign-in{
    left: 0;
    width: 50%;
    z-index: 2;
}

.container.active .sign-in{
    transform: translateX(100%);
}

.sign-up{
    left: 50%;
    width: 50%;
    opacity: 0;
    z-index: 1;
    overflow-y: auto;
}

.container.active .sign-up{
    transform: translateX(-100%);
    opacity: 1;
    z-index: 5;
    animation: move 0.6s;    
}

@keyframes move{
    0%, 49.99%{
        opacity: 0;
        z-index: 1;
    }
    50%, 100%{
        opacity: 1;
        z-index: 5;
    }
}

.social-icons{
    margin: 20px 0;
}

.social-icons a{
    border: 1px solid #ccc;
    border-radius: 20%;
    display: inline-flex;
    justify-content: center;
    align-items: center;
    margin: 0 3px;
    width: 40px;
    height: 40px;
}

.toggle-container{
    position: absolute;
    top: 0;
    left: 50%;
    width: 50%;
    height: 100%;
    overflow: hidden;
    transition: all 0.6s ease-in-out;
    border-radius: 150px 0 0 100px;
    z-index: 1000;
}

.container.active .toggle-container{
    transform: translateX(-100%);
    border-radius: 0 150px 100px 0;
}

.toggle{
    background-color: #020169;
    height: 100%;
    background: linear-gradient(to right, #020169, #020169);
    color: #fff;
    position: relative;
    left: -100%;
    height: 100%;
    width: 200%;
    transform: translateX(0);
    transition: all 0.6s ease-in-out;
}

.container.active .toggle{
    transform: translateX(50%);
}

.toggle-panel{
    position: absolute;
    width: 50%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    padding: 0 30px;
    text-align: center;
    top: 0;
    transform: translateX(0);
    transition: all 0.6s ease-in-out;
}

.toggle-left{
    transform: translateX(-200%);
}

.container.active .toggle-left{
    transform: translateX(0);
}

.toggle-right{
    right: 0;
    transform: translateX(0);
}

.container.active .toggle-right{
    transform: translateX(0);
}

.welcome-section {
    padding: 30px;
    background-color: rgba(255, 255, 255, 0.9);
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    max-width: 500px;
    width: 90%;
    text-align: center;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    z-index: 10000;
    display: none;
}

header {
    width: 100%;
    background-color: rgba(0, 0, 0, 0.7);
    padding: 10px 20px;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 1000;
    box-sizing: border-box;
}

header nav ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: flex-end;
    align-items: center;
}

header nav ul li {
    margin-left: 20px;
}

header #logout-button {
    background-color: #dc3545;
    color: #fff;
    padding: 8px 15px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    font-size: 0.9em;
}

header #logout-button:hover {
    background-color: #c82333;
}
    </style>
</head>
<body>
    <header id="header" style="display: none;">
        <nav>
            <ul>
                <li><button id="logout-button">Logout</button></li>
            </ul>
        </nav>
    </header>

    <div class="container" id="container">
        <!-- Sign Up Form -->
        <div class="form-container sign-up">
            <form>
                <h1>Create Account</h1>
                <span>Enter your details below</span>
                <input type="text" placeholder="First Name">
                <input type="text" placeholder="Middle Name (Optional)">
                <input type="text" placeholder="Last Name">
                <input type="text" placeholder="Username">
                <input type="email" placeholder="Email">
                <input type="text" placeholder="Date of Birth" onfocus="(this.type='date')">
                <input type="text" placeholder="Class">
                <select>
                    <option value="" disabled selected>Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
                <select>
                    <option value="" disabled selected>Role</option>
                    <option value="student">Student</option>
                    <option value="teacher">Teacher</option>
                    <option value="admin">Admin</option>
                </select>
                <input type="password" placeholder="Password">
                <button>Sign Up</button>
            </form>
        </div>

        <!-- Sign In Form -->
        <div class="form-container sign-in">
            <form id="login-form">
                <h1>Sign In</h1>
                <div class="social-icons">
                    <a href="#" class="icon"><i class="fa-brands fa-google-plus-g"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-facebook-f"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-github"></i></a>
                    <a href="#" class="icon"><i class="fa-brands fa-linkedin-in"></i></a>
                </div>
                <span>or use your email password</span>
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
                <div class="show-password-container">
                    <input type="checkbox" id="show-password">
                    <label for="show-password" style="display: inline; font-weight: normal;">Show Password</label>
                </div>
                <input type="submit" value="Login">
                <a href="#">Forget Your Password?</a>
            </form>
            <div class="welcome-section" id="welcome-section" style="display: none;">
                <h1>Welcome, <span id="welcome-username"></span>!</h1>
                <p>You have successfully logged in.</p>
                <button onclick="goToDashboard()">Go to Dashboard</button>
            </div>
        </div>

        <!-- Toggle Overlay -->
        <div class="toggle-container">
            <div class="toggle">
                <div class="toggle-panel toggle-left">
                    <h1>Welcome Back!</h1>
                    <p>Enter your personal details to use all of site features</p>
                    <button class="hidden" id="login">Sign In</button>
                </div>
                <div class="toggle-panel toggle-right">
                    <h1>Hello, Friend!</h1>
                    <p>Register with your personal details to use all of site features</p>
                    <button class="hidden" id="register">Sign Up</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // JavaScript code here
       // Toggle between sign-in and sign-up forms
// Toggle between sign-in and sign-up forms
const container = document.getElementById('container');
const registerBtn = document.getElementById('register');
const loginBtn = document.getElementById('login');

registerBtn.addEventListener('click', () => {
    container.classList.add("active");
    document.getElementById('welcome-section').style.display = 'none';
});

loginBtn.addEventListener('click', () => {
    container.classList.remove("active");
    document.getElementById('welcome-section').style.display = 'none';
});

// Background image rotation
const backgroundImages = [
    '../assets/images/background/bg01.jpg',
    '../assets/images/background/bg02.jpg',
    '../assets/images/background/bg03.jpg',
    '../assets/images/background/bg04.jpg',
    '../assets/images/background/bg05.jpg',
    '../assets/images/background/bg06.jpg',
    '../assets/images/background/bg07.jpg',
    '../assets/images/background/bg08.jpg',
    '../assets/images/background/bg09.jpg',
    '../assets/images/background/bg10.jpg',
    '../assets/images/background/bg11.jpg',
    '../assets/images/background/bg12.jpg',
    '../assets/images/background/bg13.jpg',
    '../assets/images/background/bg14.jpg',
    '../assets/images/background/bg15.jpg',
    '../assets/images/background/bg16.jpg'
];

let currentIndex = Math.floor(Math.random() * backgroundImages.length);
document.body.style.backgroundImage = `url(${backgroundImages[currentIndex]})`;
setInterval(() => {
    currentIndex = (currentIndex + 1) % backgroundImages.length;
    document.body.style.backgroundImage = `url(${backgroundImages[currentIndex]})`;
}, 5000);

// Show/hide password
document.getElementById('show-password').addEventListener('change', function() {
    const passwordField = document.getElementById('password');
    if (this.checked) {
        passwordField.type = 'text';
    } else {
        passwordField.type = 'password';
    }
});

// Login functionality
document.getElementById('login-form').addEventListener('submit', async (event) => {
    event.preventDefault();
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');

    // Validate input fields
    if (!usernameInput.value.trim() || !passwordInput.value.trim()) {
        alert('Please fill in both username and password.');
        return;
    }

    try {
        const response = await fetch('../data/users.json');
        
        if (!response.ok) {
            if (response.status === 404) {
                alert('User data file not found. Please contact ICT personnel for support.');
                console.error('Error: user not found contact ICT personnel for Assistance');
            } else {
                alert(`Error loading user data: HTTP status ${response.status}`);
                console.error('HTTP error loading users.json:', response.status);
            }
            return;
        }

        const users = await response.json();
        const user = users.find(u => u.username === usernameInput.value.trim() && u.password === passwordInput.value.trim());

        if (user) {
            // Store user data in local storage
            localStorage.setItem('loggedInUserId', user.id);
            localStorage.setItem('loggedInUserRole', user.role);
            localStorage.setItem('loggedInUsername', user.username);

            console.log('Login successful! User ID stored:', user.id);

            // Display welcome message
            // Display welcome message
document.getElementById('welcome-username').textContent = user.name || user.username;
document.getElementById('login-form').style.display = 'none';
document.getElementById('welcome-section').style.display = 'block';
document.getElementById('header').style.display = 'block';

} else {
    alert('Invalid username or password.');
    console.warn('Login failed: Invalid credentials provided.');
}

// Redirection after welcome
function goToDashboard() {
    window.location.href = 'dashboard.html';
}

// Logout functionality
document.getElementById('logout-button').addEventListener('click', () => {
    localStorage.removeItem('loggedInUserId');
    localStorage.removeItem('loggedInUserRole');
    localStorage.removeItem('loggedInUsername');
    alert('You have been logged out.');
    window.location.href = 'login.html';
});

// Check login status on page load
document.addEventListener('DOMContentLoaded', () => {
    const loggedInUserId = localStorage.getItem('loggedInUserId');
    const loggedInUsername = localStorage.getItem('loggedInUsername');

    if (loggedInUserId && loggedInUsername) {
        document.getElementById('login-form').style.display = 'none';
        document.getElementById('welcome-username').textContent = loggedInUsername;
        document.getElementById('welcome-section').style.display = 'block';
        document.getElementById('header').style.display = 'block';
    } else {
        document.getElementById('login-form').style.display = 'block';
        document.getElementById('welcome-section').style.display = 'none';
        document.getElementById('header').style.display = 'none';
    }
});

    </script>
</body>
</html>
