<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Classes | SCS Portal</title>
    <link rel="icon" type="image/png" href="../assets/images/favicon.ico">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        :root { --primary: #020169; --accent: #FEC009; --shadow: 0 4px 20px rgba(0,0,0,0.08); }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f0f2f5; margin: 0; }
        .header { background: var(--primary); color: white; padding: 40px 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 2.5rem; color: var(--accent); }
        .class-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; max-width: 1400px; margin: 0 auto; padding: 40px 20px; }
        .class-card { background-color: white; border-radius: 15px; box-shadow: var(--shadow); overflow: hidden; text-decoration: none; color: #333; display: flex; flex-direction: column; transition: all 0.3s ease; }
        .class-card:hover { transform: translateY(-10px); box-shadow: 0 8px 30px rgba(0,0,0,0.12); }
        .class-card-image { width: 100%; height: 200px; object-fit: cover; }
        .class-card-info { padding: 25px; flex-grow: 1; }
        .class-card-info h2 { margin: 0 0 5px 0; font-size: 1.6rem; color: var(--primary); }
        .class-card-info p { margin: 0; color: #666; font-size: 1rem; }
    </style>
</head>
<body>
    <header class="header">
        <h1>St. Christopher School Classes</h1>
    </header>
    <div id="class-grid" class="class-grid">
        <!-- JS will populate this -->
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('class-grid');
            if (!localStorage.getItem('loggedInUserId')) {
                window.location.href = 'login.html';
                return;
            }
            try {
                const response = await fetch('../data/classes.json');
                const classes = await response.json();
                
                classes.forEach(cls => {
                    const cardLink = document.createElement('a');
                    // This creates the special link to our template, passing the classId
                    cardLink.href = `class-template.html?class=${cls.classId}`;
                    cardLink.className = 'class-card';
                    cardLink.innerHTML = `
                        <img class="class-card-image" src="${cls.classPhoto}" alt="${cls.className}" onerror="this.src='../assets/images/default-class.jpeg'">
                        <div class="class-card-info">
                            <h2>${cls.className}</h2>
                            <p>${cls.academicYear}</p>
                        </div>
                    `;
                    grid.appendChild(cardLink);
                });
            } catch (error) {
                grid.innerHTML = '<p>Error loading classes.</p>';
                console.error(error);
            }
        });
    </script>
</body>
</html>
