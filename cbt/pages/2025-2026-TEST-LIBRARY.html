    .sidebar {

      padding: 10px;
      box-sizing: border-box;
      color: #fec009;
      overflow: hidden;
      border-radius: 5px 0 0 5px;
      transition: width 0.75s ease;
      position: fixed;
      left: 0;
      top: 0;

    }

    .sidebar:hover {

    .menu-item {
      display: flex;
      align-items: center;

      cursor: pointer;

      padding: 5px 0;
    }

    .menu-item i {
      font-size: 20px;
      margin-right: 15px;
      min-width: 25px;

    .menu-item span {
      white-space: nowrap;
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .sidebar:hover .menu-item span {
      opacity: 1;
    }

    .menu-item:hover {
      background-color: rgba(255, 255, 255, 0.2);
      padding-left: 5px;
      border-radius: 5px;
    }
    
    
    /* Add these styles to your existing CSS */
    .controls {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    
    .filters {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    
    .filters select {
      padding: 8px 12px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    
    #exam-list {
      list-style: none;
      padding: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    
    #exam-list li {
      margin-bottom: 5px;
    }
    
    #exam-list li a {
      display: block;
      background-color: #fec009;
      padding: 12px 15px;
      border-radius: 8px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
      text-decoration: none;
      color: #020169;
      font-weight: bold;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    
    #exam-list li a:hover {
      transform: translateY(-3px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.15);
    }
    
    .subject-header {
      font-weight: bold;
      margin-top: 20px;
      margin-bottom: 10px;
      color: #020169;
      font-size: 1.1em;
      border-bottom: 2px solid #fec009;
      padding-bottom: 5px;
    }
    
    @media (max-width: 768px) {
      .filters {
        flex-direction: column;
      }
      
      .filters select {
        width: 100%;
      }
    }
    
    .search-bar {
  display: flex;
  align-items: center;
  margin-bottom: 20px;
}

#search-input {

#search-button:hover {

}

    main {

    .profile-display-icon {

    }
    #test-list li a:hover {

        box-shadow: 0 4px 8px rgba(0,0,0,0.15);

  <main>
    <h1>Exam Library</h1>
    
    <!-- Enhanced search and filter controls -->
    <div class="controls">
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search exams...">
        <button id="search-button"><i class="fas fa-search"></i></button>
      </div>
      
      <div class="filters">
        <select id="subject-filter">
          <option value="">All Subjects</option>
          <!-- Options will be populated by JavaScript -->
        </select>
        
        <select id="class-filter">
          <option value="">All Classes</option>
          <option value="JS1">Basic 7</option>
          <option value="JS2">Basic 8</option>
          <option value="JS3">Basic 9</option>
        </select>
        
        <select id="term-filter">
          <option value="">All Terms</option>
          <option value="1ST">1st Term</option>
          <option value="2ND">2nd Term</option>
          <option value="3RD">3rd Term</option>
        </select>
      </div>
    </div>
    
    <!-- Exam list container -->
    <div id="exam-list-container">
      <ul id="exam-list"></ul>
    </div>
  </main>
  <img id="user-image-display" src="../assets/images/logo.png" alt="User Profile" class="profile-display-icon">
  <footer>&copy; 2024 TestHall</footer>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Authentication check (keep your existing code)
      
      // Organize all exams into categories
      const examCategories = {
        agriculturalScience: agriculturalScienceExams,
        basicScience: basicScienceExams,
        basicTechnology: basicTechnologyExams,
        businessStudies: businessStudiesExams,
        christianReligiousStudies: christianReligiousStudiesExams,
        civicEducation: civicEducationExams,
        computerStudies: computerStudiesExams,
        culturalAndCreativeArt: culturalAndCreativeArtExams,
        dictation: dictationExams,
        juniorDiction: juniorDictionExams,
        englishStudies: englishStudiesExams,
        french: frenchExams,
        historicalStudies: historicalStudiesExams,
        homeEconomics: homeEconomicsExams,
        mathematics: mathematicsExams,
        music: musicExams,
        physicalAndHealthEducation: physicalAndHealthEducationExams,
        securityEducation: securityEducationExams,
        socialStudies: socialStudiesExams
      };

      // Get DOM elements
      const examListElement = document.getElementById('exam-list');
      const searchInput = document.getElementById('search-input');
      const searchButton = document.getElementById('search-button');
      const subjectFilter = document.getElementById('subject-filter');
      const classFilter = document.getElementById('class-filter');
      const termFilter = document.getElementById('term-filter');

      // Populate subject filter
      function populateSubjectFilter() {
        const subjects = Object.keys(examCategories).map(subject => {
          // Convert camelCase to readable format
          return subject.replace(/([A-Z])/g, ' $1').replace(/^./, str => str.toUpperCase());
        });
        
        subjects.forEach(subject => {
          const option = document.createElement('option');
          option.value = subject;
          option.textContent = subject;
          subjectFilter.appendChild(option);
        });
      }
      
      // Flatten all exams into one array
      function getAllExams() {
        return Object.values(examCategories).flat();
      }

      // Generate exam list based on filters
      function generateExamList() {
        const searchTerm = searchInput.value.toLowerCase();
        const selectedSubject = subjectFilter.value;
        const selectedClass = classFilter.value;
        const selectedTerm = termFilter.value;
        
        // Get filtered exams
        let filteredExams = getAllExams();
        
        // Apply filters
        if (selectedSubject) {
          const subjectKey = selectedSubject.replace(/\s+/g, '').replace(/^\w/, c => c.toLowerCase());
          filteredExams = examCategories[subjectKey];
        }
        
        if (selectedClass) {
          filteredExams = filteredExams.filter(exam => 
            exam.fileName.includes(selectedClass)
          );
        }
        
        if (selectedTerm) {
          filteredExams = filteredExams.filter(exam => 
            exam.fileName.includes(selectedTerm)
          );
        }
        
        if (searchTerm) {
          filteredExams = filteredExams.filter(exam => 
            exam.displayName.toLowerCase().includes(searchTerm)
          );
        }
        
        // Clear current list
        examListElement.innerHTML = '';
        
        // Display exams or "no results" message
        if (filteredExams.length === 0) {
          const noResults = document.createElement('li');
          noResults.textContent = 'No exams found matching your criteria';
          examListElement.appendChild(noResults);
          return;
        }
        
        // Group exams by subject if no subject filter is applied
        if (!selectedSubject) {
          const groupedExams = {};
          
          filteredExams.forEach(exam => {
            // Extract subject from fileName (e.g., "ACS" from "2025-2026-JS1-ACS-1ST")
            const subjectCode = exam.fileName.split('-')[3];
            const subjectName = getSubjectName(subjectCode);
            
            if (!groupedExams[subjectName]) {
              groupedExams[subjectName] = [];
            }
            groupedExams[subjectName].push(exam);
          });
          
          // Create sections for each subject
          Object.entries(groupedExams).forEach(([subject, exams]) => {
            const subjectHeader = document.createElement('li');
            subjectHeader.className = 'subject-header';
            subjectHeader.textContent = subject;
            examListElement.appendChild(subjectHeader);
            
            exams.forEach(exam => {
              const listItem = document.createElement('li');
              const anchor = document.createElement('a');
              anchor.href = `test-taking.html?test=${encodeURIComponent(exam.fileName)}`;
              anchor.textContent = exam.displayName;
              listItem.appendChild(anchor);
              examListElement.appendChild(listItem);
            });
          });
        } else {
          // Display flat list when a subject is selected
          filteredExams.forEach(exam => {
            const listItem = document.createElement('li');
            const anchor = document.createElement('a');
            anchor.href = `test-taking.html?test=${encodeURIComponent(exam.fileName)}`;
            anchor.textContent = exam.displayName;
            listItem.appendChild(anchor);
            examListElement.appendChild(listItem);
          });
        }
      }
      
      // Helper function to get subject name from code
      function getSubjectName(code) {
        const subjectMap = {
          'ACS': 'Agricultural Science',
          'BSCI': 'Basic Science',
          'BTEC': 'Basic Technology',
          'BSTU': 'Business Studies',
          'CRS': 'Christian Religious Studies',
          'CEDU': 'Civic Education',
          'COMP': 'Computer Studies',
          'CCA': 'Cultural and Creative Art',
          'DITA': 'Dictation',
          'DION': 'Junior Diction',
          'ENG': 'English Studies',
          'FRE': 'French',
          'HIS': 'Historical Studies',
          'HOM': 'Home Economics',
          'MAT': 'Mathematics',
          'MUS': 'Music',
          'PHE': 'Physical and Health Education',
          'SEC': 'Security Education',
          'SOS': 'Social Studies'
        };
        return subjectMap[code] || code;
      }

      // Initialize the page
      function init() {
        populateSubjectFilter();
        generateExamList();
        
        // Add event listeners
        searchInput.addEventListener('input', generateExamList);
        searchButton.addEventListener('click', generateExamList);
        subjectFilter.addEventListener('change', generateExamList);
        classFilter.addEventListener('change', generateExamList);
        termFilter.addEventListener('change', generateExamList);
      }
      
      init();
    });
  </script>
