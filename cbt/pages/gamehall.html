        :root {
            --primary: #020169;
            --primary-light: #2d2b8d;
            --accent: #FEC009;
            --accent-dark: #e6b008;
            --bg-dark: #0d1b2a;
            --card-bg: #1b263b;
            --text-light: #e0e1dd;
            --border-color: #778da9;
            --danger: #dc3545;
            --success: #28a745;
            --border-radius: 12px;
            --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--primary) 0%, var(--bg-dark) 100%);
            color: var(--text-light);
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Header Styles */
        .header {
            text-align: center;
            margin-bottom: 40px;
            padding: 20px;
            background: rgba(27, 38, 59, 0.8);
            border-radius: var(--border-radius);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
        }

        h1 {
            font-family: 'Press Start 2P', cursive;
            color: var(--accent);
            font-size: 2.5rem;
            margin-bottom: 15px;
            text-shadow: 3px 3px 0px rgba(0, 0, 0, 0.5);
        }

        .subtitle {
            color: var(--text-light);
            font-size: 1.2rem;
            margin-bottom: 25px;
            opacity: 0.9;
        }

        /* Navigation */
        .nav-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: var(--border-radius);
            font-weight: 600;
            transition: var(--transition);
        }

        .nav-btn:hover {
            background: var(--primary-light);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        /* Search and Filter */
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .search-box {
            position: relative;
            max-width: 400px;
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 14px 20px 14px 45px;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            font-size: 1rem;
        }

        .search-input::placeholder {
            color: var(--border-color);
        }

        .search-icon {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--border-color);
        }

        .filter-select {
            padding: 14px 20px;
            border: 2px solid var(--border-color);
            border-radius: var(--border-radius);
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-light);
            font-size: 1rem;
            min-width: 180px;
        }

        /* Game Grid */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 40px;
        }

        .game-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            overflow: hidden;
            transition: var(--transition);
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.4);
            border-color: var(--accent);
        }

        .game-header {
            padding: 20px 20px 15px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .game-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            color: var(--accent);
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .game-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 8px;
            color: var(--text-light);
            font-family: 'Press Start 2P', cursive;
            line-height: 1.4;
        }

        .game-body {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .game-description {
            color: var(--text-light);
            opacity: 0.8;
            margin-bottom: 20px;
            line-height: 1.5;
            flex-grow: 1;
        }

        .game-scores {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.2);
            padding: 12px 15px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
        }

        .score-item {
            text-align: center;
        }

        .score-label {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-bottom: 5px;
        }

        .score-value {
            font-size: 1.2rem;
            font-weight: 700;
            color: var(--accent);
        }

        .game-actions {
            display: flex;
            gap: 10px;
        }

        .play-btn {
            flex-grow: 1;
            background: var(--accent);
            color: var(--primary);
            padding: 12px;
            border-radius: var(--border-radius);
            text-decoration: none;
            text-align: center;
            font-weight: 700;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .play-btn:hover {
            background: var(--accent-dark);
            transform: translateY(-2px);
        }

        .reset-btn {
            background: var(--danger);
            color: white;
            border: none;
            padding: 12px;
            border-radius: var(--border-radius);
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .reset-btn:hover {
            background: #c82333;
        }

        /* Footer */
        .footer {
            text-align: center;
            padding: 25px;
            margin-top: 40px;
            border-top: 1px solid var(--border-color);
            color: var(--text-light);
            opacity: 0.7;
        }

        /* Loading Overlay */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(13, 27, 42, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s ease;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 5px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        .loading-text {
            font-size: 1.2rem;
            color: var(--text-light);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* No Results Message */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: var(--card-bg);
            border-radius: var(--border-radius);
            border: 1px solid var(--border-color);
        }

        .no-results i {
            font-size: 4rem;
            color: var(--border-color);
            margin-bottom: 20px;
            display: block;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            h1 {
                font-size: 1.8rem;
            }
            
            .subtitle {
                font-size: 1rem;
            }
            
            .game-grid {
                grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
                gap: 20px;
            }
            
            .controls {
                flex-direction: column;
                align-items: stretch;
            }
            
            .search-box, .filter-select {
                max-width: none;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 15px;
            }
            
            h1 {
                font-size: 1.5rem;
            }
            
            .game-grid {
                grid-template-columns: 1fr;
            }
            
            .game-title {
                font-size: 1.2rem;
            }
            
            .game-icon {
                font-size: 2.5rem;
                height: 60px;
            }
            
            .nav-btn {
                padding: 10px 15px;
                font-size: 0.9rem;
            }
        }

        /* Animation for cards */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .game-card {
            animation: fadeIn 0.6s ease-out;
        }

        /* Category badges */
        .category-badge {
            display: inline-block;
            padding: 4px 10px;
            background: var(--primary);
            color: white;
            border-radius: 20px;
            font-size: 0.75rem;
            margin-top: 10px;
        }
    </style>
</head>

            /**
             * Displays games based on current search and filter criteria
             */
            function displayGames() {
                const searchTerm = searchInput.value.toLowerCase();
                const category = categoryFilter.value;
                
                // Filter games based on search and category
                const filteredGames = games.filter(game => {
                    const matchesSearch = game.title.toLowerCase().includes(searchTerm) || 
                                        game.description.toLowerCase().includes(searchTerm);
                    const matchesCategory = category === 'all' || game.category === category;
                    return matchesSearch && matchesCategory;
                });
                
                // Clear the game grid
                gameGrid.innerHTML = '';
                
                // Display filtered games or no results message
                if (filteredGames.length === 0) {
                    gameGrid.innerHTML = `
                        <div class="no-results">
                            <i class="fas fa-search"></i>
                            <h3>No games found</h3>
                            <p>Try adjusting your search or filter criteria</p>
                        </div>
                    `;
                    return;
                }
                
                // Create and append game cards
                filteredGames.forEach(game => {
                    const highScore = localStorage.getItem(game.scoreKey) || '0';
                    const lastScore = localStorage.getItem(game.lastScoreKey) || 'N/A';
                    
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.dataset.category = game.category;
                    
                    card.innerHTML = `
                        <div class="game-header">
                            <div class="game-icon">
                                <i class="fas ${game.icon}"></i>
                            </div>
                            <h3 class="game-title">${game.title}</h3>
                            <span class="category-badge">${game.category}</span>
                        </div>
                        
                        <div class="game-body">
                            <p class="game-description">${game.description}</p>
                            
                            <div class="game-scores">
                                <div class="score-item">
                                    <div class="score-label">High Score</div>
                                    <div class="score-value">${highScore}</div>
                                </div>
                                <div class="score-item">
                                    <div class="score-label">Last Score</div>
                                    <div class="score-value">${lastScore}</div>
                                </div>
                            </div>
                            
                            <div class="game-actions">
                                <a href="${game.url}" class="play-btn">
                                    <i class="fas fa-play"></i> Play Now
                                </a>
                                <button class="reset-btn" onclick="resetScores('${game.scoreKey}', '${game.lastScoreKey}')">
                                    <i class="fas fa-redo"></i>
                                </button>
                            </div>
                        </div>
                    `;
                    
                    gameGrid.appendChild(card);
                });
            }
            
            /**
             * Resets scores for a specific game
             * @param {string} scoreKey - The localStorage key for high score
             * @param {string} lastScoreKey - The localStorage key for last score
             */
            window.resetScores = function(scoreKey, lastScoreKey) {
                if (confirm('Are you sure you want to reset your scores for this game?')) {
                    localStorage.removeItem(scoreKey);
                    localStorage.removeItem(lastScoreKey);
                    displayGames(); // Refresh the display
                    
                    // Show confirmation message
                    const confirmation = document.createElement('div');
                    confirmation.style.position = 'fixed';
                    confirmation.style.bottom = '20px';
                    confirmation.style.right = '20px';
                    confirmation.style.padding = '10px 20px';
                    confirmation.style.background = 'var(--success)';
                    confirmation.style.color = 'white';
                    confirmation.style.borderRadius = 'var(--border-radius)';
                    confirmation.style.zIndex = '1000';
                    confirmation.innerHTML = '<i class="fas fa-check"></i> Scores reset successfully!';
                    document.body.appendChild(confirmation);
                    
                    // Remove confirmation after 3 seconds
                    setTimeout(() => {
                        document.body.removeChild(confirmation);
                    }, 3000);
                }
            };
            
            /**
             * Initializes the game hall
             */
            function initGameHall() {
                // Display games initially
                displayGames();
                
                // Set up event listeners
                searchInput.addEventListener('input', displayGames);
                categoryFilter.addEventListener('change', displayGames);
                
                // Hide loading overlay
                setTimeout(() => {
                    loadingOverlay.style.opacity = '0';
                    setTimeout(() => {
                        loadingOverlay.style.display = 'none';
                    }, 500);
                }, 800);
            }
            
            // Initialize the game hall
            initGameHall();
        });
    </script>
