<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Brick Stacker</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d1b2a;
            --grid-color: #1b263b;
            --font-color: #e0e1dd;
            --border-color: #778da9;
        }
        body {
            background-color: var(--bg-color);
            color: var(--font-color);
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }
        #game-layout {
            display: flex;
            align-items: flex-start;
            gap: 20px;
        }
        #game-container {
            border: 3px solid var(--border-color);
            box-shadow: 0 0 20px rgba(119, 141, 169, 0.5);
            position: relative;
        }
        canvas {
            display: block;
            background-color: var(--grid-color);
        }
        #game-sidebar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 150px;
            text-align: center;
        }
        .sidebar-box {
            background-color: var(--grid-color);
            border: 2px solid var(--border-color);
            padding: 15px;
        }
        .sidebar-box h2 {
            font-size: 1em;
            margin-top: 0;
            margin-bottom: 10px;
            color: var(--font-color);
        }
        #score, #lines, #level { font-size: 0.9em; }
        #next-piece-canvas { background-color: transparent; }

        /* Overlays & Buttons */
        .overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.75);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; z-index: 100;
        }
        .overlay h2 { font-size: 1.5em; }
        .overlay p { font-size: 0.8em; margin-top: 20px; line-height: 1.5; }
        .hidden { display: none; }
        .btn {
            background-color: #415a77; color: var(--font-color);
            border: 2px solid var(--border-color);
            padding: 15px 25px;
            font-family: 'Press Start 2P', cursive; font-size: 1em;
            cursor: pointer; margin: 10px;
        }
        #pause-btn {
            position: absolute; top: 10px; right: 10px;
            background: none; border: none; color: var(--font-color);
            font-size: 1.5em; cursor: pointer; z-index: 50;
        }

        /* Mobile Controls */
        #mobile-controls {
            display: none;
            width: 100%;
            margin-top: 20px;
        }
        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .move-btn {
            width: 70px; height: 70px; font-size: 2em;
            background-color: var(--grid-color); color: var(--font-color);
            border: 2px solid var(--border-color); border-radius: 15px;
        }
        #rotate-btn {
            width: 90px; height: 90px;
            border-radius: 50%;
        }

        @media (max-width: 768px) {
            body { flex-direction: column; }
            #game-layout { flex-direction: column; align-items: center; }
            #game-sidebar { flex-direction: row; width: 100%; justify-content: space-around; }
            .sidebar-box { flex-grow: 1; }
            #mobile-controls { display: block; }
        }
    </style>
</head>
<body>
    <div id="game-layout">
        <div id="game-container">
            <canvas id="gameCanvas"></canvas>
            <button id="pause-btn" class="hidden"><i class="fas fa-pause"></i></button>
            <div id="start-overlay" class="overlay">
                <h2>BRICK STACKER</h2>
                <p>Click to Start</p>
            </div>
            <div id="pause-overlay" class="overlay hidden">
                <div id="pause-box">
                    <h2>PAUSED</h2>
                    <button id="resume-btn" class="btn">Resume</button>
                    <button id="menu-btn" class="btn">Menu</button>
                </div>
                <div id="menu-box" class="hidden">
                     <h2>MENU</h2>
                    <a href="../gamehall.html" class="btn">Game Hall</a>
                    <a href="../dashboard.html" class="btn">Dashboard</a>
                    <button id="back-to-pause-btn" class="btn">Back</button>
                </div>
            </div>
        </div>
        <div id="game-sidebar">
            <div class="sidebar-box">
                <h2>SCORE</h2>
                <div id="score">0</div>
            </div>
            <div class="sidebar-box">
                <h2>NEXT</h2>
                <canvas id="next-piece-canvas"></canvas>
            </div>
            <div class="sidebar-box">
                <h2>LINES</h2>
                <div id="lines">0</div>
            </div>
        </div>
    </div>
    <div id="mobile-controls">
         <div class="controls-row">
            <button id="left-btn" class="move-btn">◀</button>
            <button id="rotate-btn" class="move-btn">↻</button>
            <button id="right-btn" class="move-btn">▶</button>
        </div>
        <div class="controls-row" style="justify-content: center;">
            <button id="down-btn" class="move-btn">▼</button>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- DOM Elements ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const nextCanvas = document.getElementById('next-piece-canvas');
    const nextCtx = nextCanvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const linesEl = document.getElementById('lines');
    const startOverlay = document.getElementById('start-overlay');
    const pauseBtn = document.getElementById('pause-btn');
    const pauseOverlay = document.getElementById('pause-overlay');
    const resumeBtn = document.getElementById('resume-btn');
    const menuBtn = document.getElementById('menu-btn');
    const backToPauseBtn = document.getElementById('back-to-pause-btn');
    const pauseBox = document.getElementById('pause-box');
    const menuBox = document.getElementById('menu-box');
    const leftBtn = document.getElementById('left-btn'), rightBtn = document.getElementById('right-btn'), downBtn = document.getElementById('down-btn'), rotateBtn = document.getElementById('rotate-btn');

    // --- Game Constants ---
    const COLS = 10, ROWS = 20, BLOCK_SIZE = 30;
    const COLORS = ['#000000', '#FF0D72', '#0DC2FF', '#0DFF72', '#F538FF', '#FF8E0D', '#FFE138', '#3877FF'];
    const PIECES = [
        [[1,1,1,1]], // I
        [[1,1],[1,1]], // O
        [[0,1,0],[1,1,1]], // T
        [[0,1,1],[1,1,0]], // S
        [[1,1,0],[0,1,1]], // Z
        [[1,0,0],[1,1,1]], // L
        [[0,0,1],[1,1,1]] // J
    ];

    // Canvas sizing
    canvas.width = COLS * BLOCK_SIZE;
    canvas.height = ROWS * BLOCK_SIZE;
    nextCanvas.width = 4 * BLOCK_SIZE;
    nextCanvas.height = 4 * BLOCK_SIZE;

    // --- Game State ---
    let grid, currentPiece, nextPiece, score, lines, level, dropCounter, dropInterval;
    let gameActive = false, gamePaused = false;

    // --- Game Functions ---
    function init() {
        grid = Array.from({ length: ROWS }, () => Array(COLS).fill(0));
        score = 0; lines = 0; level = 0;
        dropCounter = 0; dropInterval = 1000;
        
        spawnPiece(); // Spawn first piece
        spawnPiece(); // Spawn next piece
        
        gameActive = true; gamePaused = false;
        startOverlay.classList.add('hidden');
        pauseOverlay.classList.add('hidden');
        pauseBtn.classList.remove('hidden');
        
        updateHUD();
        gameLoop();
    }

    function spawnPiece() {
        const pieceIndex = Math.floor(Math.random() * PIECES.length);
        currentPiece = nextPiece;
        nextPiece = {
            matrix: PIECES[pieceIndex],
            colorIndex: pieceIndex + 1,
            x: Math.floor(COLS / 2) - Math.floor(PIECES[pieceIndex][0].length / 2),
            y: 0
        };
        // If there's no current piece (game start), set it to the 'next' piece
        if (!currentPiece) spawnPiece();

        // Game over condition
        if (!isValidMove(currentPiece.matrix, currentPiece.x, currentPiece.y)) {
            gameOver();
        }
    }

    let lastTime = 0;
    function gameLoop(time = 0) {
        if (!gameActive) return;
        if (gamePaused) { requestAnimationFrame(gameLoop); return; }

        const deltaTime = time - lastTime;
        lastTime = time;
        dropCounter += deltaTime;

        if (dropCounter > dropInterval) {
            pieceDrop();
        }

        draw();
        requestAnimationFrame(gameLoop);
    }

    function pieceDrop() {
        if (!isValidMove(currentPiece.matrix, currentPiece.x, currentPiece.y + 1)) {
            lockPiece();
            clearLines();
            spawnPiece();
        } else {
            currentPiece.y++;
        }
        dropCounter = 0;
    }

    function move(dx) {
        if (isValidMove(currentPiece.matrix, currentPiece.x + dx, currentPiece.y)) {
            currentPiece.x += dx;
        }
    }

    function rotate() {
        const matrix = currentPiece.matrix;
        const N = matrix.length;
        const newMatrix = Array.from({ length: N }, () => Array(N).fill(0));

        // Transpose and reverse rows for rotation
        for (let r = 0; r < N; r++) {
            for (let c = 0; c < N; c++) {
                if (matrix[r][c]) {
                    newMatrix[c][N - 1 - r] = matrix[r][c];
                }
            }
        }
        
        // If the new rotation is valid, apply it
        if (isValidMove(newMatrix, currentPiece.x, currentPiece.y)) {
            currentPiece.matrix = newMatrix;
        }
    }

    function isValidMove(matrix, x, y) {
        for (let r = 0; r < matrix.length; r++) {
            for (let c = 0; c < matrix[r].length; c++) {
                if (matrix[r][c] && (
                    grid[r + y]?.[c + x] === undefined || // Out of bounds
                    grid[r + y]?.[c + x] !== 0 // Collision with locked piece
                )) {
                    return false;
                }
            }
        }
        return true;
    }

    function lockPiece() {
        currentPiece.matrix.forEach((row, r) => {
            row.forEach((value, c) => {
                if (value) {
                    grid[currentPiece.y + r][currentPiece.x + c] = currentPiece.colorIndex;
                }
            });
        });
    }

    function clearLines() {
        let linesCleared = 0;
        outer: for (let r = ROWS - 1; r >= 0; r--) {
            for (let c = 0; c < COLS; c++) {
                if (grid[r][c] === 0) {
                    continue outer;
                }
            }
            // If we get here, the line is full
            const row = grid.splice(r, 1)[0].fill(0);
            grid.unshift(row);
            linesCleared++;
            r++; // Check the same row index again after shifting
        }
        
        // Scoring
        if (linesCleared > 0) {
            score += [0, 40, 100, 300, 1200][linesCleared] * (level + 1);
            lines += linesCleared;
            // Increase level/speed every 10 lines
            if (Math.floor(lines / 10) > level) {
                level = Math.floor(lines / 10);
                dropInterval = Math.max(100, 1000 - level * 50);
            }
            updateHUD();
        }
    }

    function updateHUD() {
        scoreEl.textContent = score;
        linesEl.textContent = lines;
    }

    // --- Drawing ---
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        // Draw locked pieces
        grid.forEach((row, r) => {
            row.forEach((value, c) => {
                if (value) {
                    ctx.fillStyle = COLORS[value];
                    ctx.fillRect(c * BLOCK_SIZE, r * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                }
            });
        });
        // Draw current piece
        if (currentPiece) {
            ctx.fillStyle = COLORS[currentPiece.colorIndex];
            currentPiece.matrix.forEach((row, r) => {
                row.forEach((value, c) => {
                    if (value) {
                        ctx.fillRect((currentPiece.x + c) * BLOCK_SIZE, (currentPiece.y + r) * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                    }
                });
            });
        }
        drawNextPiece();
    }
    
    function drawNextPiece() {
        nextCtx.clearRect(0, 0, nextCanvas.width, nextCanvas.height);
        if (nextPiece) {
            nextCtx.fillStyle = COLORS[nextPiece.colorIndex];
            const matrix = nextPiece.matrix;
            const xOffset = (4 - matrix[0].length) / 2;
            const yOffset = (4 - matrix.length) / 2;
            matrix.forEach((row, r) => {
                row.forEach((value, c) => {
                    if(value) {
                         nextCtx.fillRect((c + xOffset) * BLOCK_SIZE, (r + yOffset) * BLOCK_SIZE, BLOCK_SIZE, BLOCK_SIZE);
                    }
                });
            });
        }
    }

    // --- Game State Control ---
    function gameOver() {
        gameActive = false;
        pauseBtn.classList.add('hidden');
        startOverlay.classList.remove('hidden');
        startOverlay.querySelector('h2').textContent = "GAME OVER";
        startOverlay.querySelector('p').innerHTML = `Final Score: ${score}<br>Click to Play Again`;
    }

    function togglePause() {
        if (!gameActive) return;
        gamePaused = !gamePaused;
        pauseOverlay.classList.toggle('hidden', !gamePaused);
        if (gamePaused) {
            pauseBox.classList.remove('hidden');
            menuBox.classList.add('hidden');
        }
    }

    // --- Event Listeners ---
    document.addEventListener('keydown', e => {
        if (!gameActive || gamePaused) return;
        if (e.key === 'ArrowLeft') move(-1);
        else if (e.key === 'ArrowRight') move(1);
        else if (e.key === 'ArrowDown') pieceDrop();
        else if (e.key === 'ArrowUp' || e.key === ' ') rotate();
    });

    startOverlay.addEventListener('click', init);
    pauseBtn.addEventListener('click', togglePause);
    resumeBtn.addEventListener('click', togglePause);
    menuBtn.addEventListener('click', () => { pauseBox.classList.add('hidden'); menuBox.classList.remove('hidden'); });
    backToPauseBtn.addEventListener('click', () => { menuBox.classList.add('hidden'); pauseBox.classList.remove('hidden'); });
    
    // Mobile Controls
    leftBtn.addEventListener('click', () => move(-1));
    rightBtn.addEventListener('click', () => move(1));
    downBtn.addEventListener('click', pieceDrop);
    rotateBtn.addEventListener('click', rotate);
});
</script>
</body>
</html>
