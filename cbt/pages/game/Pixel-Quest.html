<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Quest</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root { --bg-color: #2a3d45; --font-color: #f0f0f0; }
        body {
            background-color: #111;
            color: var(--font-color);
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #game-container {
            border: 3px solid var(--font-color);
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background-color: #000;
        }
        canvas {
            display: block;
            width: 100%; height: 100%;
            image-rendering: pixelated;
        }
        #game-hud {
            position: absolute;
            top: 10px; left: 10px; right: 10px;
            font-size: 14px;
            text-shadow: 2px 2px #000;
        }
        #dialogue-box {
            position: absolute;
            bottom: 10px; left: 10px; right: 10px;
            background-color: rgba(0,0,0,0.8);
            border: 2px solid var(--font-color);
            padding: 15px;
            font-size: 16px;
            line-height: 1.5;
        }
        .prompt {
            position: absolute;
            bottom: 5px; right: 15px;
            font-size: 12px;
            animation: blink 1.5s infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        .overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.7);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; z-index: 100;
        }
        .overlay h2 { font-size: 2em; }
        .overlay p { font-size: 0.8em; margin-top: 20px; }
        .hidden { display: none; }
        
        #mobile-controls {
            display: none; width: 100%; max-width: 800px;
            margin-top: 15px; padding: 0 20px;
            justify-content: space-between; align-items: center;
        }
        .d-pad { display: grid; grid-template-areas: ". up ." "left . right" ". down ."; gap: 10px; }
        .control-btn {
            width: 50px; height: 50px; font-size: 1.5em;
            background-color: rgba(255,255,255,0.3); color: white;
            border: 2px solid white; border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
        }
        .action-btn { width: 70px; height: 70px; border-radius: 50%; font-size: 1em;}
        #up-btn { grid-area: up; } #down-btn { grid-area: down; }
        #left-btn { grid-area: left; } #right-btn { grid-area: right; }

        @media (hover: none) and (pointer: coarse) { #mobile-controls { display: flex; } }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="game-hud">
            <div id="quest-log">Quest: Find the old man.</div>
        </div>
        <div id="dialogue-box" class="hidden">
            <span id="dialogue-text"></span>
            <span class="prompt">▼</span>
        </div>
        <div id="win-overlay" class="overlay hidden">
            <h2>Quest Complete!</h2>
            <p>You unlocked the treasure!<br>Thanks for playing!</p>
        </div>
    </div>
    <div id="mobile-controls">
        <div class="d-pad">
            <button id="up-btn" class="control-btn">▲</button>
            <button id="left-btn" class="control-btn">◀</button>
            <button id="right-btn" class="control-btn">▶</button>
            <button id="down-btn" class="control-btn">▼</button>
        </div>
        <button id="action-btn" class="control-btn action-btn">Talk</button>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- DOM Elements ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const questLogEl = document.getElementById('quest-log');
    const dialogueBox = document.getElementById('dialogue-box');
    const dialogueTextEl = document.getElementById('dialogue-text');
    const winOverlay = document.getElementById('win-overlay');
    const mobileControls = document.getElementById('mobile-controls');

    // --- Game Constants & Sizing ---
    const TILE_SIZE = 40;
    canvas.width = 800; canvas.height = 450;

    // --- Game Data ---
    const mapLayout = [
        "TTTTTTTTTTTTTTTTTTTTTTTTTTTTTT",
        "TGGGGGGGGGGGGGGGGGGGGGGGGGGGGGT",
        "TGGGGGGGGGGGGGGGGGGGGGGGGGGGGGT",
        "TGGGGGGGGFFFFFGGGGGGGGGGGGGGT",
        "TGGGGGGGGFFFFFGGGGGGGGGGGGGGT",
        "TGGGGGGGGFFFFFGGGGGGGGGGGGGGT",
        "TGGGGGGGGGGGGGGGGGGGGGGGGGGGGGT",
        "TGGGGGGGGGGGGGGGGGGGGGGGGGGGGGT",
        "TGGGGGGGGGGGGGGGGGGGGGGGGGGGGGT",
        "TTTTTTTTTTTTTTTTTTTTTTTTTTTTTT",
    ];
    const tileAtlas = {
        'G': { color: '#3a8e3b' }, // Grass
        'T': { color: '#2f602f', solid: true }, // Trees
        'F': { color: '#a08b6b', solid: true }, // Fence
    };
    
    // Interactive objects are stored separately from the map tiles
    let gameObjects = [
        { id: 'player', type: 'player', x: 2, y: 5, color: '#e67e22' },
        { id: 'npc1', type: 'npc', x: 8, y: 2, color: '#3498db',
            dialogue: [
                "Oh, hello there traveler!",
                "I seem to have lost my key somewhere to the east...",
                "Could you help me find it? It opens that chest over there."
            ],
            questId: 'findKey'
        },
        { id: 'key', type: 'item', x: 25, y: 6, color: '#f1c40f', name: 'Old Key', questId: 'findKey', hidden: true },
        { id: 'chest', type: 'chest', x: 10, y: 7, color: '#8e44ad', locked: true, requires: 'Old Key', opensQuest: 'findKey' }
    ];

    // --- Game State ---
    let gameState = 'PLAYING'; // PLAYING, DIALOGUE, WIN
    const keys = {};
    const playerState = {
        inventory: [],
        activeQuest: null
    };
    const camera = { x: 0, y: 0 };
    const player = gameObjects.find(obj => obj.id === 'player');
    
    // --- Dialogue State ---
    let currentDialogue = [];
    let dialogueIndex = 0;

    // --- Game Loop ---
    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    function update() {
        if (gameState !== 'PLAYING') return;
        
        // Player movement
        let dx = 0, dy = 0;
        if (keys.ArrowLeft) dx = -1;
        if (keys.ArrowRight) dx = 1;
        if (keys.ArrowUp) dy = -1;
        if (keys.ArrowDown) dy = 1;
        
        if (dx !== 0 || dy !== 0) {
            move(player, dx, dy);
        }
    }

    function move(object, dx, dy) {
        const nextX = object.x + dx;
        const nextY = object.y + dy;

        const tileChar = mapLayout[nextY]?.[nextX];
        if (!tileAtlas[tileChar]?.solid) {
            const collisionObject = gameObjects.find(obj => obj !== object && obj.x === nextX && obj.y === nextY);
            if (!collisionObject) {
                object.x = nextX;
                object.y = nextY;
            }
        }
    }

    // --- Interaction Logic ---
    function handleInteraction() {
        if (gameState === 'DIALOGUE') {
            advanceDialogue();
            return;
        }
        if (gameState !== 'PLAYING') return;

        // Find what's in front of the player (simple check)
        // A better implementation would check player's facing direction
        for (let dy = -1; dy <= 1; dy++) {
            for (let dx = -1; dx <= 1; dx++) {
                if (dx === 0 && dy === 0) continue;
                const targetX = player.x + dx;
                const targetY = player.y + dy;
                
                const targetObject = gameObjects.find(obj => obj.x === targetX && obj.y === targetY);
                if (targetObject) {
                    interactWith(targetObject);
                    return; // Interact with the first thing found
                }
            }
        }
    }

    function interactWith(object) {
        if (object.type === 'npc') {
            startDialogue(object.dialogue);
            if(object.questId && !playerState.activeQuest) {
                playerState.activeQuest = object.questId;
                questLogEl.textContent = `Quest: ${object.dialogue[1]}`;
                // Make the quest item visible
                const questItem = gameObjects.find(item => item.id === 'key');
                if(questItem) questItem.hidden = false;
            }
        }
        if (object.type === 'item' && !object.hidden) {
            playerState.inventory.push(object.name);
            // Remove item from world
            gameObjects = gameObjects.filter(obj => obj !== object);
            questLogEl.textContent = `Quest: I found the ${object.name}!`;
        }
        if (object.type === 'chest' && object.locked) {
            if (playerState.inventory.includes(object.requires) && playerState.activeQuest === object.opensQuest) {
                object.locked = false;
                object.color = '#f39c12'; // Change color to "open"
                questLogEl.textContent = "Quest Complete!";
                gameState = 'WIN';
                winOverlay.classList.remove('hidden');
            } else {
                startDialogue(["It's locked. I might need a key..."]);
            }
        }
    }

    // --- Dialogue System ---
    function startDialogue(lines) {
        gameState = 'DIALOGUE';
        currentDialogue = lines;
        dialogueIndex = 0;
        dialogueTextEl.textContent = currentDialogue[dialogueIndex];
        dialogueBox.classList.remove('hidden');
    }

    function advanceDialogue() {
        dialogueIndex++;
        if (dialogueIndex >= currentDialogue.length) {
            hideDialogue();
        } else {
            dialogueTextEl.textContent = currentDialogue[dialogueIndex];
        }
    }

    function hideDialogue() {
        gameState = 'PLAYING';
        dialogueBox.classList.add('hidden');
    }

    // --- Drawing ---
    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Center camera on player
        camera.x = player.x * TILE_SIZE - canvas.width / 2 + TILE_SIZE / 2;
        camera.y = player.y * TILE_SIZE - canvas.height / 2 + TILE_SIZE / 2;
        
        // Clamp camera to map boundaries
        const mapPixelWidth = mapLayout[0].length * TILE_SIZE;
        const mapPixelHeight = mapLayout.length * TILE_SIZE;
        if (camera.x < 0) camera.x = 0;
        if (camera.y < 0) camera.y = 0;
        if (camera.x > mapPixelWidth - canvas.width) camera.x = mapPixelWidth - canvas.width;
        if (camera.y > mapPixelHeight - canvas.height) camera.y = mapPixelHeight - canvas.height;

        ctx.save();
        ctx.translate(-camera.x, -camera.y);

        // Draw map tiles
        for (let r = 0; r < mapLayout.length; r++) {
            for (let c = 0; c < mapLayout[r].length; c++) {
                const tileChar = mapLayout[r][c];
                const tile = tileAtlas[tileChar];
                if (tile) {
                    ctx.fillStyle = tile.color;
                    ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                }
            }
        }
        // Draw game objects
        gameObjects.forEach(obj => {
            if (!obj.hidden) {
                ctx.fillStyle = obj.color;
                ctx.fillRect(obj.x * TILE_SIZE, obj.y * TILE_SIZE, TILE_SIZE, TILE_SIZE);
            }
        });
        
        ctx.restore();
    }

    // --- Event Listeners ---
    window.addEventListener('keydown', e => {
        if (e.key === 'e' || e.key === 'Enter' || e.key === ' ') {
            handleInteraction();
        } else {
            keys[e.key] = true;
        }
    });
    window.addEventListener('keyup', e => { keys[e.key] = false; });
    
    // Mobile controls
    const buttons = mobileControls.querySelectorAll('button');
    buttons.forEach(btn => {
        btn.addEventListener('touchstart', e => {
            e.preventDefault();
            const id = e.currentTarget.id;
            if (id === 'up-btn') keys.ArrowUp = true;
            if (id === 'down-btn') keys.ArrowDown = true;
            if (id === 'left-btn') keys.ArrowLeft = true;
            if (id === 'right-btn') keys.ArrowRight = true;
            if (id === 'action-btn') handleInteraction();
        }, { passive: false });

        btn.addEventListener('touchend', e => {
            e.preventDefault();
            keys.ArrowUp = false; keys.ArrowDown = false;
            keys.ArrowLeft = false; keys.ArrowRight = false;
        }, { passive: false });
    });

    gameLoop();
});
</script>
</body>
</html>
