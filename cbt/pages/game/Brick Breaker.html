<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🧱 Brick Breaker</title>
  <style>
    body {
      background: #000;
      color: cyan;
      font-family: monospace;
      text-align: center;
    }

    canvas {
      display: flex;
      position: absolute;
      top: 0px;
      left: 0px;
      right: 0px;
      margin: 0px auto;
      border: 3px solid cyan;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #FEC009 0%, #020169 100%);
    }

    .controls {
      margin-top: 10px;
    }

    .tbtn {
      width: 60px;
      height: 50px;
      background: #222;
      border: 2px solid cyan;
      color: cyan;
      font-size: 1.2em;
      border-radius: 10px;
      margin: 5px;
    }
  body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #f0f0f0;
      margin: 0;
      font-family: Courier New, 'monospace';
    }
    
    .brand {
      position: absolute;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      color: #999;
      font-size: 14px;
      letter-spacing: 1px;
    }

    .console {
      position: relative;
      width: 360px;
      height: 723px;
      background: linear-gradient(135deg, #FEC009 0%, #020169 100%);
      border-radius: 40px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      overflow: hidden;
    }

    .console::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(255, 255, 255, 0.1) 1.5px, transparent 1.5px),
        radial-gradient(circle at 80% 70%, rgba(255, 255, 255, 0.1) 1.5px, transparent 1.5px);
      background-size: 30px 30px;
    }
    
    .power-button {
     position: absolute;
     top: 10px;
     right: 10px;
     width: 50px;
     height: 50px;
     background-color: #333;
     border-radius: 50%;
     cursor: pointer;
    }

   .power-button:active {
     background-color: #444;
    }

   .menu {
     position: absolute;
     top: 70px;
     right: 10px;
     background-color: #333;
     padding: 10px;
     border-radius: 10px;
     display: none;
    }

   .menu ul {
     list-style: none;
     padding: 0;
     margin: 0;
    }

   .menu li {
     padding: 10px;
    }  border-bottom: 1px solid #444;
     cursor: pointer;
    }

   .menu li:hover {
     background-color: #444;
    }

   .console-off {
     filter: brightness(0);
     transition: filter 0.5s;
    }

   .console-on {
     filter: brightness(1);
     transition: filter 0.5s;
    }

    .screen {
      position: absolute;
      top: 60px;
      left: 30px;
      right: 30px;
      height: 420px;
      background: linear-gradient(135deg, #020169 0%, #fec009 100%);
      border: 5px solid #000;
      border-radius: 10px;
      overflow-y: auto;
      color: #fec009;
      padding: 10px;
      text-align: center;
    }

    .screen h1 {
      font-size: 1.2em;
      margin: 10px 0;
    }
    
    .controls {
      position: absolute;
      top: 520px;
      left: 0;
      right: 0;
      height: 200px;
      display: flex;
      justify-content: space-between;
      padding: 0 30px;
    }
    
    .d-pad {
      position: relative;
      width: 100px;
      height: 100px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .d-pad-up, .d-pad-down, .d-pad-left, .d-pad-right {
      position: absolute;
      background-color: #1877f2;
    }

    .d-pad-up {
      top: 0;
      left: 33px;
      width: 25px;
      height: 25px;
      border-top-left-radius: 5px;
      border-top-right-radius: 5px;
    }

    .d-pad-down {
      bottom: 0;
      left: 33px;
      width: 25px;
      height: 25px;
      border-bottom-left-radius: 5px;
      border-bottom-right-radius: 5px;
    }

    .d-pad-left {
      top: 33px;
      left: 0;
      bottom: 30px;
      right: 75px;
      width: 35px;
      height: 40px;
      border-top-left-radius: 5px;
      border-bottom-left-radius: 5px;
    }

    .d-pad-right {
      top: 30px;
      bottom: 30px;
      left: 75px;
      right: 0;
      width: 35px;
      height: 40px;
      border-top-right-radius: 5px;
      border-bottom-right-radius: 5px;
    }

    .d-pad-center {  
    position: absolute;
      top: 0px;
      right: 50px;
      width: 25px;
      height: 25px;
      border-top-right-radius: 25px;
      border-bottom-right-radius: 25px;
      border-top-left-radius: 25px;
      border-bottom-left-radius: 25px;
    }

    .d-pad-up:active, .d-pad-down:active, .d-pad-left:active, .d-pad-right:active, .d-pad-center:active {
      background-color: #fec009;
    }


    .action-buttons {
      width: 120px;
      height: 100px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .action-btn-a {
      width: 50px;
      height: 50px;
      background: #fec009;
      border-radius: 50%;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
    }

    .action-btn-b {
      width: 50px;
      height: 50px;
      background: #fec009;
      border-radius: 50%;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
    }    
        
    .action-btn-c {
      width: 50px;
      height: 50px;
      background: #fec009;
      border-radius: 50%;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
    }
        
    .action-btn-d {
      width: 50px;
      height: 50px;
      background: #fec009;
      border-radius: 50%;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
    }
    
     .action-btn-a:active {
      background-color: #11ff00;
    }
    .action-btn-b:active {
      background-color: #8f00ff;
    }
    .action-btn-c:active {
      background-color: #ff001f;
    }
    .action-btn-d:active {
      background-color: #1877F2;
    }

    .shoulder-btn {
      position: absolute;
      top: 20px;
      width: 120px;
      height: 30px;
      background: #ffeaff;
      border-radius: 8px;
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
    }

    .shoulder-left {
      left: 50px;
    }

    .shoulder-right {
      right: 50px;
    }
    
    .shoulder-right:active, .shoulder-right:active {
      background-color: #020169;
    }
    

  </style>
</head>
<body>
  <div class="console">
    <!-- Shoulder Buttons -->
    <button class="shoulder-btn shoulder-left" onclick="location.href='../gamehall.html'">Go to Dashboard</button>
    <button class="shoulder-btn shoulder-right">pause game</button>

    <!-- Screen Area -->
    <div class="screen">
    
    <canvas id="gameCanvas" width="285" height="435"></canvas>
                     
    </div>                                       

    <!-- Controls -->
    <div class="controls">
  <div class="d-pad">
    <button class="d-pad-left" onclick="moveLeft()">←</button>
    <button class="d-pad-right" onclick="moveRight()">→</button>
      </div>
  <div class="action-buttons">
    <button class="action-btn-a" onclick="startGame()">Start</button>
    <button class="action-btn-b">🎮</button>
    <button class="action-btn-c"></button>
    <button class="action-btn-d"></button>
  </div>
</div>

    <!-- Brand -->
    <div class="brand">🧱 Brick Breaker ANS11 SNES Classic</div>
  </div>
</body>
  <script>
    const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

// Game variables
let paddle = { x: 100, y: 350, width: 80, height: 10 };
let ball = { x: 140, y: 320, radius: 7, dx: 3, dy: -3 };
let bricks = [];
let rows = 3;
let cols = 4;
let brickWidth = 50;
let brickHeight = 20;
let score = 0;
let lives = 3;
let level = 1;
let playing = false;

// Initialize bricks
function initBricks() {
  bricks = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      bricks.push({
        x: c * (brickWidth + 5) + 10,
        y: r * (brickHeight + 5) + 10,
        status: 1
      });
    }
  }
}

// Draw paddle
function drawPaddle() {
  ctx.fillStyle = "cyan";
  ctx.fillRect(paddle.x, paddle.y, paddle.width, paddle.height);
}

// Draw ball
function drawBall() {
  ctx.beginPath();
  ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
  ctx.fillStyle = "yellow";
  ctx.fill();
  ctx.closePath();
}

// Draw bricks
function drawBricks() {
  bricks.forEach(b => {
    if (b.status === 1) {
      ctx.fillStyle = "red";
      ctx.fillRect(b.x, b.y, brickWidth, brickHeight);
    }
  });
}

// Draw HUD
function drawHUD() {
  ctx.fillStyle = "#fff";
  ctx.font = "16px monospace";
  ctx.fillText(`Score: ${score}`, 10, 20);
  ctx.fillText(`Lives: ${lives}`, 200, 20);
  ctx.fillText(`Level: ${level}`, 120, 20);
}

// Move paddle left
function moveLeft() {
  if (paddle.x > 0) paddle.x -= 20;
}

// Move paddle right
function moveRight() {
  if (paddle.x < canvas.width - paddle.width) paddle.x += 20;
}

// Start game
function startGame() {
  if (!playing) {
    initBricks();
    playing = true;
    ball.x = 140;
    ball.y = 320;
    ball.dx = 3;
    ball.dy = -3;
    gameLoop();
  }
}

// Collision detection
function collisionDetection() {
  bricks.forEach(b => {
    if (
      b.status === 1 &&
      ball.x > b.x &&
      ball.x < b.x + brickWidth &&
      ball.y > b.y &&
      ball.y < b.y + brickHeight
    ) {
      ball.dy *= -1;
      b.status = 0;
      score += 10;

      if (bricks.every(brick => brick.status === 0)) {
        level++;
        rows++;
        lives = Math.min(5, lives + 1);
        playing = false;
        alert(`🎉 Level ${level}! Press Start to continue.`);
      }
    }
  });
}

// Game loop
function gameLoop() {
  if (!playing) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawPaddle();
  drawBall();
  drawBricks();
  drawHUD();
  collisionDetection();

  // Ball movement
  ball.x += ball.dx;
  ball.y += ball.dy;

  // Wall bounce
  if (ball.x + ball.radius > canvas.width || ball.x - ball.radius < 0) {
    ball.dx *= -1;
  }

  if (ball.y - ball.radius < 0) {
    ball.dy *= -1;
  }

  // Paddle bounce
  if (
    ball.y + ball.radius > paddle.y &&
    ball.x > paddle.x &&
    ball.x < paddle.x + paddle.width
  ) {
    ball.dy *= -1;
  }

  // Missed paddle
  if (ball.y + ball.radius > canvas.height) {
    lives--;
    if (lives === 0) {
      playing = false;
      alert("💀 Game Over! Refresh to restart.");
      return;
    } else {
      ball.x = 140;
      ball.y = 320;
      ball.dx = 3;
      ball.dy = -3;
    }
  }

  requestAnimationFrame(gameLoop);
}
</script>
</body>
</html>
