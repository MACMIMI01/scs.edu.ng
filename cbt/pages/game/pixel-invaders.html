<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Invaders</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000;
            --font-color: #FFF;
            --player-color: #2ecc71;
            --enemy-color: #e74c3c;
            --bullet-color: #f1c40f;
            --bunker-color: #3498db;
        }
        body {
            background-color: var(--bg-color);
            color: var(--font-color);
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            overflow: hidden;
        }
        #game-wrapper {
            width: 100%;
            max-width: 600px;
            aspect-ratio: 1 / 1;
            position: relative;
        }
        #game-container {
            border: 3px solid var(--font-color);
            box-shadow: 0 0 20px var(--player-color);
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
        }
        canvas {
            background-color: var(--bg-color);
            display: block;
            width: 100%; height: 100%;
            image-rendering: pixelated;
        }
        #game-hud {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
        }
        #pause-btn {
            background: none; border: none;
            color: var(--font-color); font-size: 24px;
            cursor: pointer; position: absolute;
            top: 5px; right: 10px; z-index: 10;
        }
        
        /* Overlays */
        .overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.75);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; font-size: 24px;
            cursor: pointer; z-index: 100;
        }
        .overlay p { font-size: 14px; margin-top: 20px; line-height: 1.5; }
        .hidden { display: none; }
        .btn {
            background-color: var(--player-color); color: #000;
            border: none; padding: 15px 25px;
            font-family: 'Press Start 2P', cursive; font-size: 16px;
            cursor: pointer; margin: 10px;
        }
        .btn-secondary { background-color: #7f8c8d; }
        
        /* Mobile Controls */
        #mobile-controls {
            display: none; /* Hidden on desktop */
            width: 100%;
            max-width: 600px;
            margin-top: 15px;
            justify-content: space-between;
            align-items: center;
        }
        .move-btn {
            width: 70px; height: 70px; font-size: 36px;
            background-color: #34495e; color: var(--font-color);
            border: 2px solid var(--font-color); border-radius: 15px;
        }
        #shoot-btn {
            width: 100px; height: 100px; font-size: 24px;
            background-color: var(--enemy-color);
            border-radius: 50%;
        }

        @media (max-width: 768px) {
            body { justify-content: flex-start; padding-top: 20px;}
            #mobile-controls { display: flex; }
            #game-hud { font-size: 12px; }
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <div id="game-container">
            <div id="game-hud">
                <div id="score">SCORE: 0</div>
                <div id="lives">LIVES: 3</div>
            </div>
            <button id="pause-btn" class="hidden"><i class="fas fa-pause"></i></button>
            <canvas id="gameCanvas"></canvas>
            <div id="start-overlay" class="overlay">
                <div id="message">PIXEL INVADERS</div>
                <p>Use [A] & [D] or Arrow Keys to Move<br>Press [SPACE] to Shoot<br><br>Click to Start</p>
            </div>
            <div id="pause-overlay" class="overlay hidden">
                <div id="pause-box">
                    <h2>PAUSED</h2>
                    <button id="resume-btn" class="btn">Resume</button>
                    <button id="menu-btn" class="btn btn-secondary">Menu</button>
                </div>
                <div id="menu-box" class="hidden">
                     <h2>MENU</h2>
                    <a href="../gamehall.html" class="btn">Game Hall</a>
                    <a href="../dashboard.html" class="btn">Dashboard</a>
                    <button id="back-to-pause-btn" class="btn btn-secondary">Back</button>
                </div>
            </div>
        </div>
    </div>
    <div id="mobile-controls">
        <button id="left-btn" class="move-btn">◀</button>
        <button id="shoot-btn" class="move-btn">FIRE</button>
        <button id="right-btn" class="move-btn">▶</button>
    </div>

    <script>
    document.addEventListener('DOMContentLoaded', () => {
        // --- DOM Elements ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const startOverlay = document.getElementById('start-overlay');
        const messageEl = document.getElementById('message');
        const pauseBtn = document.getElementById('pause-btn');
        const pauseOverlay = document.getElementById('pause-overlay');
        const resumeBtn = document.getElementById('resume-btn');
        const menuBtn = document.getElementById('menu-btn');
        const backToPauseBtn = document.getElementById('back-to-pause-btn');
        const pauseBox = document.getElementById('pause-box');
        const menuBox = document.getElementById('menu-box');
        const leftBtn = document.getElementById('left-btn');
        const rightBtn = document.getElementById('right-btn');
        const shootBtn = document.getElementById('shoot-btn');

        // --- Game Setup ---
        canvas.width = 600;
        canvas.height = 600;
        let score, lives, gameActive, gamePaused;
        const keys = {};

        // --- Classes for Game Objects ---
        class Player {
            constructor() {
                this.width = 50;
                this.height = 20;
                this.x = (canvas.width / 2) - (this.width / 2);
                this.y = canvas.height - this.height - 20;
                this.speed = 5;
                this.color = getCssVar('--player-color');
                this.bullets = [];
                this.canShoot = true;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                this.bullets.forEach(b => b.draw());
            }
            update() {
                if (keys['a'] || keys['ArrowLeft']) this.x -= this.speed;
                if (keys['d'] || keys['ArrowRight']) this.x += this.speed;

                if (this.x < 0) this.x = 0;
                if (this.x + this.width > canvas.width) this.x = canvas.width - this.width;
                
                if (keys[' '] || keys['Shoot']) this.shoot();
                
                this.bullets.forEach((b, i) => {
                    b.update();
                    if (b.y < 0) this.bullets.splice(i, 1);
                });
            }
            shoot() {
                if(!this.canShoot) return;
                this.bullets.push(new Bullet(this.x + this.width / 2 - 2.5, this.y, 5, 10, -8));
                this.canShoot = false;
                setTimeout(() => this.canShoot = true, 400);
            }
        }

        class Bullet {
            constructor(x, y, width, height, velocity) {
                this.x = x; this.y = y;
                this.width = width; this.height = height;
                this.velocity = velocity;
                this.color = getCssVar('--bullet-color');
            }
            draw() { ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, this.width, this.height); }
            update() { this.y += this.velocity; }
        }
        
        class Enemy {
            constructor(x, y, width, height, color) {
                this.x = x; this.y = y;
                this.width = width; this.height = height;
                this.color = color;
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x + swarm.x, this.y + swarm.y, this.width, this.height);
            }
        }

        class EnemySwarm {
            constructor() {
                this.x = 0; this.y = 50;
                this.columns = 10;
                this.rows = 5;
                this.enemyWidth = 30;
                this.enemyHeight = 20;
                this.gap = 15;
                this.speed = 0.5;
                this.direction = 1;
                this.enemies = [];
                this.bullets = [];
                this.shootInterval = null;
                
                for (let r = 0; r < this.rows; r++) {
                    for (let c = 0; c < this.columns; c++) {
                        this.enemies.push(new Enemy(c * (this.enemyWidth + this.gap), r * (this.enemyHeight + this.gap), this.enemyWidth, this.enemyHeight, getCssVar('--enemy-color')));
                    }
                }
                this.width = this.columns * (this.enemyWidth + this.gap) - this.gap;
                this.shootInterval = setInterval(() => this.shoot(), 1000);
            }
            draw() {
                this.enemies.forEach(e => e.draw());
                this.bullets.forEach(b => b.draw());
            }
            update() {
                this.x += this.speed * this.direction;
                if (this.x + this.width > canvas.width || this.x < 0) {
                    this.direction *= -1;
                    this.y += 30;
                }
                this.enemies.forEach(e => {
                    if (bunkers.length > 0 && e.y + this.y + e.height > bunkers[0].y) {
                        gameOver("Invaders reached the bunkers!");
                    }
                });
                this.bullets.forEach((b, i) => {
                    b.update();
                    if (b.y > canvas.height) this.bullets.splice(i, 1);
                });
            }
            shoot() {
                if (gameActive && !gamePaused && this.enemies.length > 0) {
                    const randomEnemy = this.enemies[Math.floor(Math.random() * this.enemies.length)];
                    this.bullets.push(new Bullet(randomEnemy.x + swarm.x + randomEnemy.width / 2, randomEnemy.y + swarm.y, 5, 10, 5));
                }
            }
        }

        class Bunker {
            constructor(x, y) {
                this.x = x; this.y = y;
                this.size = 5;
                this.grid = [];
                for (let r = 0; r < 10; r++) {
                    const row = [];
                    for (let c = 0; c < 12; c++) {
                        if (r > 2 && c > 1 && c < 10) {
                            if (r > 6 && c > 3 && c < 8) row.push(0);
                            else row.push(1);
                        } else { row.push(0); }
                    }
                    this.grid.push(row);
                }
            }
            draw() {
                ctx.fillStyle = getCssVar('--bunker-color');
                for (let r = 0; r < this.grid.length; r++) {
                    for (let c = 0; c < this.grid[r].length; c++) {
                        if (this.grid[r][c] === 1) {
                            ctx.fillRect(this.x + c * this.size, this.y + r * this.size, this.size, this.size);
                        }
                    }
                }
            }
        }

        let player, swarm, bunkers;

        function init() {
            score = 0; lives = 3;
            gameActive = true; gamePaused = false;
            updateHUD();
            player = new Player();
            swarm = new EnemySwarm();
            bunkers = [];
            for(let i = 0; i < 4; i++) {
                bunkers.push(new Bunker(canvas.width / 4 * i + (canvas.width / 4 - 60) / 2, 450));
            }
            startOverlay.classList.add('hidden');
            pauseOverlay.classList.add('hidden');
            pauseBtn.classList.remove('hidden');
        }

        function update() {
            if (!gameActive || gamePaused) return;
            player.update();
            swarm.update();
            checkCollisions();
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (!gameActive) return;
            player.draw();
            swarm.draw();
            bunkers.forEach(b => b.draw());
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        function checkCollisions() {
            player.bullets.forEach((bullet, bIndex) => {
                swarm.enemies.forEach((enemy, eIndex) => {
                    if (isColliding(bullet, {x: enemy.x + swarm.x, y: enemy.y + swarm.y, width: enemy.width, height: enemy.height})) {
                        player.bullets.splice(bIndex, 1);
                        swarm.enemies.splice(eIndex, 1);
                        score += 10;
                        updateHUD();
                    }
                });
            });

            swarm.bullets.forEach((bullet, bIndex) => {
                if (isColliding(bullet, player)) {
                    swarm.bullets.splice(bIndex, 1);
                    playerHit();
                }
            });

            const allBullets = [...player.bullets, ...swarm.bullets];
            allBullets.forEach(bullet => {
                bunkers.forEach(bunker => {
                    for (let r = 0; r < bunker.grid.length; r++) {
                        for (let c = 0; c < bunker.grid[r].length; c++) {
                            if (bunker.grid[r][c] === 1) {
                                const pixel = { x: bunker.x + c * bunker.size, y: bunker.y + r * bunker.size, width: bunker.size, height: bunker.size };
                                if (isColliding(bullet, pixel)) {
                                    bunker.grid[r][c] = 0;
                                    if (bullet.velocity < 0) {
                                        const pIndex = player.bullets.indexOf(bullet);
                                        if (pIndex > -1) player.bullets.splice(pIndex, 1);
                                    } else {
                                        const sIndex = swarm.bullets.indexOf(bullet);
                                        if (sIndex > -1) swarm.bullets.splice(sIndex, 1);
                                    }
                                    return;
                                }
                            }
                        }
                    }
                });
            });

            if (swarm.enemies.length === 0) {
                gameOver("YOU WIN!");
            }
        }
        
        function playerHit() {
            lives--;
            updateHUD();
            if (lives <= 0) {
                gameOver("GAME OVER");
            }
        }
        
        function gameOver(message) {
            gameActive = false;
            clearInterval(swarm.shootInterval);
            messageEl.textContent = message;
            startOverlay.querySelector('p').innerHTML = `Final Score: ${score}<br><br>Click to Play Again`;
            startOverlay.classList.remove('hidden');
            pauseBtn.classList.add('hidden');
        }

        function updateHUD() {
            scoreEl.textContent = `SCORE: ${score}`;
            livesEl.textContent = `LIVES: ${lives > 0 ? '❤️'.repeat(lives) : '0'}`;
        }
        
        function isColliding(a, b) {
            return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;
        }

        function getCssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

        // --- Event Listeners ---
        window.addEventListener('keydown', (e) => { if(gameActive) keys[e.key] = true; });
        window.addEventListener('keyup', (e) => { keys[e.key] = false; });
        
        function press(key) { if(gameActive) keys[key] = true; }
        function release(key) { keys[key] = false; }
        
        leftBtn.addEventListener('touchstart', (e) => { e.preventDefault(); press('ArrowLeft'); });
        leftBtn.addEventListener('touchend', () => release('ArrowLeft'));
        rightBtn.addEventListener('touchstart', (e) => { e.preventDefault(); press('ArrowRight'); });
        rightBtn.addEventListener('touchend', () => release('ArrowRight'));
        shootBtn.addEventListener('touchstart', (e) => { e.preventDefault(); press(' '); });
        shootBtn.addEventListener('touchend', () => release(' '));

        startOverlay.addEventListener('click', init);
        pauseBtn.addEventListener('click', () => {
            if (!gameActive) return;
            gamePaused = true;
            pauseOverlay.classList.remove('hidden');
            pauseBox.classList.remove('hidden');
            menuBox.classList.add('hidden');
        });
        resumeBtn.addEventListener('click', () => {
            gamePaused = false;
            pauseOverlay.classList.add('hidden');
        });
        menuBtn.addEventListener('click', () => {
            pauseBox.classList.add('hidden');
            menuBox.classList.remove('hidden');
        });
        backToPauseBtn.addEventListener('click', () => {
            menuBox.classList.add('hidden');
            pauseBox.classList.remove('hidden');
        });
        
        updateHUD();
        gameLoop();
    });
    </script>
</body>
</html>
