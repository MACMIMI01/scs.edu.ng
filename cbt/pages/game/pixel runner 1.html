<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Runner</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #1d2b53; /* Dark Blue */
            --font-color: #fff;
            --player-color: #ff004d; /* Red */
            --platform-color: #008751; /* Green */
        }
        body {
            background-color: #000;
            color: var(--font-color);
            font-family: 'Press Start 2P', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        #game-container {
            border: 3px solid var(--font-color);
            box-shadow: 0 0 20px var(--player-color);
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            background-color: var(--bg-color);
        }
        canvas {
            display: block;
            width: 100%; height: 100%;
            image-rendering: pixelated;
        }
        #game-hud {
            position: absolute;
            top: 10px; left: 10px; right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            text-shadow: 2px 2px #000;
        }
        .overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; font-size: 2em;
            cursor: pointer; z-index: 100;
        }
        .overlay p { font-size: 0.5em; margin-top: 20px; line-height: 1.5; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        <div id="game-hud">
            <div id="score">SCORE: 0</div>
            <div id="high-score">HI: 0</div>
        </div>
        <div id="start-overlay" class="overlay">
            <div>PIXEL RUNNER</div>
            <p>Tap, Click, or Press [SPACE] to Jump<br><br>Start Running!</p>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- DOM Elements & Sizing ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('high-score');
    const startOverlay = document.getElementById('start-overlay');

    canvas.width = 800;
    canvas.height = 450;
    
    // --- Physics & Game Constants ---
    const GRAVITY = 0.6;
    const JUMP_STRENGTH = -15;
    const PLAYER_X_POSITION = 100; // Player's fixed horizontal position

    // --- Game State ---
    let score, highScore, gameSpeed, gameActive;
    let platforms = [];
    
    const player = {
        x: PLAYER_X_POSITION, y: 100,
        width: 30, height: 40,
        dy: 0,
        onGround: false,
        color: 'var(--player-color)'
    };
    
    // --- High Score Logic ---
    const HIGH_SCORE_KEY = 'runner_high_score';
    function loadHighScore() {
        highScore = parseInt(localStorage.getItem(HIGH_SCORE_KEY)) || 0;
        highScoreEl.textContent = `HI: ${highScore}`;
    }
    function saveHighScore() {
        if (score > highScore) {
            highScore = score;
            localStorage.setItem(HIGH_SCORE_KEY, highScore);
            highScoreEl.textContent = `HI: ${highScore}`;
        }
    }

    // --- Game Initialization ---
    function init() {
        score = 0;
        gameSpeed = 5;
        gameActive = true;
        
        player.y = 100;
        player.dy = 0;
        
        platforms = [];
        // Create the starting platform
        platforms.push({
            x: 0, y: canvas.height - 50,
            width: canvas.width + 100, height: 50
        });
        
        updateHUD();
        startOverlay.classList.add('hidden');
        gameLoop();
    }

    // --- Procedural Platform Generation ---
    function generatePlatforms() {
        // Get the last platform to build off of it
        const lastPlatform = platforms[platforms.length - 1];
        
        // Remove platforms that are off-screen to the left
        platforms = platforms.filter(p => p.x + p.width > 0);
        
        // If the last platform is coming into view, generate a new one
        if (lastPlatform.x + lastPlatform.width < canvas.width + 200) {
            const minGap = 80, maxGap = 200;
            const minWidth = 100, maxWidth = 250;
            const newPlatformY = lastPlatform.y + (Math.random() - 0.5) * 150;
            
            platforms.push({
                x: lastPlatform.x + lastPlatform.width + minGap + Math.random() * (maxGap - minGap),
                y: Math.max(150, Math.min(canvas.height - 70, newPlatformY)),
                width: minWidth + Math.random() * (maxWidth - minWidth),
                height: 50
            });
        }
    }

    // --- Game Loop ---
    let animationFrameId;
    function gameLoop() {
        update();
        draw();
        if (gameActive) {
            animationFrameId = requestAnimationFrame(gameLoop);
        }
    }

    function update() {
        // Update score and game speed
        score++;
        gameSpeed += 0.001;
        updateHUD();

        // Apply gravity
        player.dy += GRAVITY;
        player.y += player.dy;
        player.onGround = false;
        
        // Update platform positions
        platforms.forEach(p => {
            p.x -= gameSpeed;
        });
        
        handleCollisions();
        generatePlatforms();
    }
    
    function handleCollisions() {
        // Ground and platform collision
        platforms.forEach(p => {
            if (player.y + player.height > p.y &&
                player.y < p.y + p.height &&
                player.x + player.width > p.x &&
                player.x < p.x + p.width) {
                
                // If player is falling and was above the platform
                if (player.dy > 0 && player.y + player.height - player.dy <= p.y) {
                    player.onGround = true;
                    player.dy = 0;
                    player.y = p.y - player.height;
                }
            }
        });
        
        // Check for falling off the screen
        if (player.y > canvas.height) {
            gameOver();
        }
    }

    function draw() {
        ctx.fillStyle = getCssVar('--bg-color');
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Draw platforms
        ctx.fillStyle = getCssVar('--platform-color');
        platforms.forEach(p => {
            ctx.fillRect(p.x, p.y, p.width, p.height);
        });

        // Draw player
        ctx.fillStyle = getCssVar('--player-color');
        ctx.fillRect(player.x, player.y, player.width, player.height);
    }

    function handleJump() {
        if (gameActive && player.onGround) {
            player.dy = JUMP_STRENGTH;
        }
    }

    function gameOver() {
        gameActive = false;
        cancelAnimationFrame(animationFrameId);
        saveHighScore();
        startOverlay.classList.remove('hidden');
        startOverlay.querySelector('div').textContent = "GAME OVER";
        startOverlay.querySelector('p').innerHTML = `Your Score: ${score}<br><br>Play Again?`;
    }

    function updateHUD() {
        scoreEl.textContent = `SCORE: ${score}`;
    }

    function getCssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

    // --- Event Listeners ---
    document.addEventListener('keydown', e => {
        if (e.code === 'Space') {
            handleJump();
        }
    });

    canvas.addEventListener('click', handleJump);
    startOverlay.addEventListener('click', () => {
        if (!gameActive) {
            init();
        }
    });

    // --- Initial Load ---
    loadHighScore();
});
</script>
</body>
</html>
