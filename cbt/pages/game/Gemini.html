<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maze Runner - Upgraded!</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #282c34;
      color: #ffffff;
      font-family: 'Arial', sans-serif;
    }

    #game-area {
      text-align: center;
      background-color: #3a404b;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
    }

    h1 {
      color: #61dafb;
      margin-bottom: 20px;
    }

    canvas {
      background-color: #1a1a1a;
      border: 2px solid #61dafb;
      display: block;
      margin: 0 auto 20px auto;
    }

    #game-status {
      font-size: 1.1em;
      margin-bottom: 20px;
      color: #a0a8b4;
    }

    #movement-controls {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .move-btn {
      background-color: #4CAF50; /* Green */
      border: none;
      color: white;
      padding: 15px 32px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      margin: 4px 2px;
      cursor: pointer;
      border-radius: 8px;
      transition: background-color 0.3s ease;
      width: 100px; /* Uniform width for buttons */
    }

    .move-btn:hover:not(:disabled) {
      background-color: #45a049;
    }

    .move-btn:active:not(:disabled) {
      background-color: #3e8e41;
    }

    .move-btn:disabled {
      background-color: #6b6b6b;
      cursor: not-allowed;
    }

    #movement-controls .row {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    #reset-btn {
      background-color: #f44336; /* Red */
      border: none;
      color: white;
      padding: 10px 20px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      margin-top: 20px;
      cursor: pointer;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }

    #reset-btn:hover {
      background-color: #da190b;
    }
  </style>
</head>
<body>
  <div id="game-area">
    <h1>Maze Runner!</h1>
    <canvas id="mazeCanvas" width="400" height="400"></canvas>
    <p id="game-status">Use arrow keys or buttons to move. Find the exit (green square)!</p>

    <div id="movement-controls">
      <button id="up-btn" class="move-btn">Up</button>
      <div class="row">
        <button id="left-btn" class="move-btn">Left</button>
        <button id="down-btn" class="move-btn">Down</button>
        <button id="right-btn" class="move-btn">Right</button>
      </div>
    </div>
    <button id="reset-btn">Reset Maze</button>
  </div>

  <audio id="move-sound" src="https://www.fesliyanstudios.com/play-mp3/387" preload="auto"></audio>
  <audio id="win-sound" src="https://www.fesliyanstudios.com/play-mp3/6967" preload="auto"></audio>

  <script>
    // Get elements
    const canvas = document.getElementById('mazeCanvas');
    const ctx = canvas.getContext('2d');
    const statusDisplay = document.getElementById('game-status');
    const upBtn = document.getElementById('up-btn');
    const downBtn = document.getElementById('down-btn');
    const leftBtn = document.getElementById('left-btn');
    const rightBtn = document.getElementById('right-btn');
    const resetBtn = document.getElementById('reset-btn');
    const moveSound = document.getElementById('move-sound');
    const winSound = document.getElementById('win-sound');

    // Game constants
    const gridSize = 20; // Size of each cell in pixels
    const mazeCols = canvas.width / gridSize;
    const mazeRows = canvas.height / gridSize;

    // Game variables
    let player = { x: 0, y: 0 };
    let exit = { x: mazeCols - 1, y: mazeRows - 1 };
    let maze = []; // This will store our maze grid (0 for path, 1 for wall)
    let gameWon = false;

    // --- Maze Generation (Recursive Backtracking) ---
    function generateMaze(cols, rows) {
      const grid = Array(rows).fill(0).map(() => Array(cols).fill(1)); // Start with all walls
      const path = []; // Stack for backtracking
      let current = { x: 0, y: 0 }; // Start at top-left corner

      grid[current.y][current.x] = 0; // Mark start cell as path
      path.push(current);

      while (path.length > 0) {
        let neighbors = [];

        // Check neighbors (2 cells away to ensure path creation)
        if (current.x > 1 && grid[current.y][current.x - 2] === 1) neighbors.push({ x: current.x - 2, y: current.y, wallX: current.x - 1, wallY: current.y });
        if (current.x < cols - 2 && grid[current.y][current.x + 2] === 1) neighbors.push({ x: current.x + 2, y: current.y, wallX: current.x + 1, wallY: current.y });
        if (current.y > 1 && grid[current.y - 2][current.x] === 1) neighbors.push({ y: current.y - 2, x: current.x, wallX: current.x, wallY: current.y - 1 });
        if (current.y < rows - 2 && grid[current.y + 2][current.x] === 1) neighbors.push({ y: current.y + 2, x: current.x, wallX: current.x, wallY: current.y + 1 });

        if (neighbors.length > 0) {
          const next = neighbors[Math.floor(Math.random() * neighbors.length)];
          grid[next.y][next.x] = 0; // Mark new cell as path
          grid[next.wallY][next.wallX] = 0; // Carve path through wall

          path.push(next);
          current = next;
        } else {
          current = path.pop(); // Backtrack
        }
      }
      return grid;
    }

    // --- Audio Functions ---
    function playMoveSound() {
      moveSound.currentTime = 0; // Rewind to start
      moveSound.play().catch(e => console.error("Error playing move sound:", e));
    }

    function playWinSound() {
      winSound.currentTime = 0; // Rewind to start
      winSound.play().catch(e => console.error("Error playing win sound:", e));
    }

    // --- Game Visuals ---
    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function drawMaze() {
      for (let r = 0; r < mazeRows; r++) {
        for (let c = 0; c < mazeCols; c++) {
          if (maze[r][c] === 1) { // It's a wall
            ctx.fillStyle = '#444'; // Wall color
            ctx.fillRect(c * gridSize, r * gridSize, gridSize, gridSize);
          }
        }
      }
    }

    function drawPlayer() {
      ctx.fillStyle = '#61dafb'; // Player color (light blue)
      ctx.beginPath();
      ctx.arc(player.x * gridSize + gridSize / 2, player.y * gridSize + gridSize / 2, gridSize / 3, 0, Math.PI * 2);
      ctx.fill();
    }

    function drawExit() {
      ctx.fillStyle = '#4CAF50'; // Exit color (green)
      ctx.fillRect(exit.x * gridSize, exit.y * gridSize, gridSize, gridSize);
    }

    function drawGame() {
      clearCanvas();
      drawMaze();
      drawExit();
      drawPlayer();
    }

    // --- Player Movement and Game Logic ---
    function isValidMove(newX, newY) {
      // Check if within bounds and not a wall
      return newX >= 0 && newX < mazeCols &&
             newY >= 0 && newY < mazeRows &&
             maze[newY][newX] === 0; // 0 means it's a path
    }

    function movePlayer(dx, dy) {
      if (gameWon) return; // Prevent movement after winning

      const newX = player.x + dx;
      const newY = player.y + dy;

      if (isValidMove(newX, newY)) {
        player.x = newX;
        player.y = newY;
        playMoveSound();
        drawGame(); // Redraw game after movement
        checkWin();
      } else {
        statusDisplay.textContent = "Can't move through walls!";
      }
    }

    function checkWin() {
      if (player.x === exit.x && player.y === exit.y) {
        gameWon = true;
        statusDisplay.textContent = "Congratulations! You found the exit!";
        playWinSound();
        celebrateWin();
        disableControls();
      }
    }

    function celebrateWin() {
      // Simple celebration effect: flash the exit color
      let flashCount = 0;
      const flashInterval = setInterval(() => {
        if (flashCount % 2 === 0) {
          ctx.fillStyle = '#FFFF00'; // Yellow flash
        } else {
          ctx.fillStyle = '#4CAF50'; // Original green
        }
        ctx.fillRect(exit.x * gridSize, exit.y * gridSize, gridSize, gridSize);
        flashCount++;
        if (flashCount > 6) { // Flash 3 times
          clearInterval(flashInterval);
          drawExit(); // Ensure it ends on green
        }
      }, 200);
    }

    function disableControls() {
      upBtn.disabled = true;
      downBtn.disabled = true;
      leftBtn.disabled = true;
      rightBtn.disabled = true;
      document.removeEventListener('keydown', handleKeyPress); // Remove keyboard listener
    }

    function enableControls() {
      upBtn.disabled = false;
      downBtn.disabled = false;
      leftBtn.disabled = false;
      rightBtn.disabled = false;
      document.addEventListener('keydown', handleKeyPress); // Add keyboard listener
    }

    function resetGame() {
      player = { x: 0, y: 0 }; // Reset player position
      exit = { x: mazeCols - 1, y: mazeRows - 1 }; // Reset exit position
      maze = generateMaze(mazeCols, mazeRows); // Generate a new maze
      gameWon = false;
      statusDisplay.textContent = "Use arrow keys or buttons to move. Find the exit (green square)!";
      drawGame();
      enableControls(); // Enable controls for new game
    }

    // --- Event Listeners ---
    function handleKeyPress(event) {
      if (gameWon) return; // Ignore input if game is won

      switch (event.key) {
        case 'ArrowUp':
          movePlayer(0, -1);
          break;
        case 'ArrowDown':
          movePlayer(0, 1);
          break;
        case 'ArrowLeft':
          movePlayer(-1, 0);
          break;
        case 'ArrowRight':
          movePlayer(1, 0);
          break;
      }
    }

    upBtn.addEventListener('click', () => movePlayer(0, -1));
    downBtn.addEventListener('click', () => movePlayer(0, 1));
    leftBtn.addEventListener('click', () => movePlayer(-1, 0));
    rightBtn.addEventListener('click', () => movePlayer(1, 0));
    resetBtn.addEventListener('click', resetGame);

    // Initial game setup
    document.addEventListener('DOMContentLoaded', () => {
      resetGame(); // Generate initial maze and draw game
    });
  </script>
</body>
</html>
