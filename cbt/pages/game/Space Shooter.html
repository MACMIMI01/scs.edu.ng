<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Space Shooter</title>
  <style>
    body {
      background-color: #000;
      font-family: monospace;
      color: cyan;
      text-align: center;
    }

    canvas {
      display: block;
      margin: 20px auto;
      border: 3px solid cyan;
      background-color: #000;
    }

    h2 {
      margin-top: 20px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 10px;
    }

    .direction-pad {
      display: grid;
      grid-template-columns: 50px 50px 50px;
      grid-template-rows: 50px 50px 50px;
      gap: 5px;
    }

    .control-btn {
      width: 50px;
      height: 50px;
      background-color: #111;
      border: 2px solid cyan;
      color: cyan;
      font-size: 1.2em;
      border-radius: 10px;
      user-select: none;
    }

    .action-btn {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 1em;
    }
  </style>
</head>
<body>
  <h2>🚀 Space Shooter</h2>
  <canvas id="gameCanvas" width="480" height="640"></canvas>

  <div class="controls">
    <div class="direction-pad">
      <div></div>
      <button class="control-btn" id="btn-up">↑</button>
      <div></div>
      <button class="control-btn" id="btn-left">←</button>
      <div></div>
      <button class="control-btn" id="btn-right">→</button>
      <div></div>
      <button class="control-btn" id="btn-down">↓</button>
      <div></div>
    </div>
    <button class="control-btn action-btn" id="btn-fire">FIRE</button>
  </div>

  <script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const ship = { x: 220, y: 580, width: 40, height: 20, color: "#0ff" };
  const bullets = [];
  const enemies = [];
  let score = 0;
  let lives = 3;
  let level = 1;
  let timer = 60; // seconds per level
  let brokenObstacles = 0;
  let enemySpeed = 2;
  let gameOver = false;

  document.addEventListener("keydown", handleKey);

  function handleKey(e) {
    if (e.key === "ArrowLeft" && ship.x > 0) ship.x -= 15;
    if (e.key === "ArrowRight" && ship.x < canvas.width - ship.width) ship.x += 15;
    if (e.key === "ArrowUp" && ship.y > 0) ship.y -= 15;
    if (e.key === "ArrowDown" && ship.y < canvas.height - ship.height) ship.y += 15;
    if (e.key === " ") bullets.push({ x: ship.x + 18, y: ship.y - 10 });
  }

  // Touch Buttons
  document.getElementById("btn-up").onclick = () => handleKey({ key: "ArrowUp" });
  document.getElementById("btn-down").onclick = () => handleKey({ key: "ArrowDown" });
  document.getElementById("btn-left").onclick = () => handleKey({ key: "ArrowLeft" });
  document.getElementById("btn-right").onclick = () => handleKey({ key: "ArrowRight" });
  document.getElementById("btn-fire").onclick = () => handleKey({ key: " " });

  function drawShip() {
    ctx.fillStyle = ship.color;
    ctx.fillRect(ship.x, ship.y, ship.width, ship.height);
  }

  function drawBullets() {
    ctx.fillStyle = "yellow";
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.y -= 5;
      ctx.fillRect(b.x, b.y, 4, 10);
      if (b.y < 0) bullets.splice(i, 1);
    }
  }

  function spawnEnemies() {
    if (Math.random() < 0.02) {
      enemies.push({ x: Math.random() * 450, y: -30, width: 30, height: 30 });
    }
  }

  function drawEnemies() {
    ctx.fillStyle = "red";
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.y += enemySpeed;
      ctx.fillRect(e.x, e.y, e.width, e.height);

      // If enemy reaches bottom: lose life
      if (e.y > canvas.height) {
        enemies.splice(i, 1);
        lives--;
        if (lives <= 0) gameOver = true;
      }
    }
  }

  function detectCollisions() {
    for (let i = bullets.length - 1; i >= 0; i--) {
      for (let j = enemies.length - 1; j >= 0; j--) {
        const b = bullets[i];
        const e = enemies[j];
        if (
          b.x < e.x + e.width &&
          b.x + 4 > e.x &&
          b.y < e.y + e.height &&
          b.y + 10 > e.y
        ) {
          bullets.splice(i, 1);
          enemies.splice(j, 1);
          score++;
          brokenObstacles++;

          if (brokenObstacles % 10 === 0 && lives < 10) {
            lives++; // Earn a life every 10 breaks
          }

          return;
        }
      }
    }
  }

  function drawHUD() {
    ctx.fillStyle = "white";
    ctx.font = "16px monospace";
    ctx.fillText("Score: " + score, 10, 20);
    ctx.fillText("Lives: " + lives, 10, 40);
    ctx.fillText("Level: " + level, 10, 60);
    ctx.fillText("Time: " + timer, 10, 80);
  }

  function drawGameOver() {
    ctx.fillStyle = "red";
    ctx.font = "28px monospace";
    ctx.fillText("GAME OVER", 150, 320);
  }

  function levelUp() {
    level++;
    timer = 60;
    enemySpeed += 0.5;
    brokenObstacles = 0;
  }

  function gameLoop() {
    if (gameOver) {
      drawGameOver();
      return;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawShip();
    drawBullets();
    spawnEnemies();
    drawEnemies();
    detectCollisions();
    drawHUD();

    requestAnimationFrame(gameLoop);
  }

  setInterval(() => {
    if (!gameOver && timer > 0) {
      timer--;
    } else if (!gameOver && timer === 0) {
      levelUp();
    }
  }, 1000);

  gameLoop();
</script>
</body>
</html>
