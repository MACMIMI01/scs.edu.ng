<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maze Runner Deluxe</title>
    <style>
        :root {
            --bg-dark: #2c3e50;
            --bg-light: #34495e;
            --text-light: #ecf0f1;
            --primary: #e67e22; /* Orange */
            --secondary: #f1c40f; /* Yellow */
            --player: #3498db; /* Blue */
            --exit: #2ecc71; /* Green */
            --wall: #c0392b; /* Red */
            --coin: #ffffff; /* White */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg-dark);
            color: var(--text-light);
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        #game-container {
            background-color: var(--bg-light);
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            padding: 25px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            max-width: 95vw;
        }

        h1 {
            color: var(--primary);
            margin-bottom: 15px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        /* --- Game HUD --- */
        #game-hud {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.2);
            padding: 10px;
            border-radius: 8px;
            font-size: 1.1em;
        }
        #game-hud span {
            color: var(--secondary);
            font-weight: bold;
        }

        #mazeCanvas {
            border: 5px solid var(--primary);
            background-color: var(--secondary);
            display: block;
            border-radius: 5px;
            max-width: 100%;
            height: auto; /* Maintain aspect ratio */
        }

        #game-status {
            margin-top: 15px;
            min-height: 1.2em; /* Prevent layout shift */
            font-size: 1.1em;
            font-weight: bold;
            color: var(--exit);
        }

        /* --- Controls --- */
        .controls-section {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .btn-group {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 12px 24px;
            font-size: 1.1em;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px rgba(0,0,0,0.3);
            outline: none;
            font-weight: bold;
        }
        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px rgba(0,0,0,0.3);
        }

        .move-btn { background-color: var(--player); }
        .move-btn:hover { background-color: #4aa8e0; }
        
        #start-btn, .difficulty-btn { background-color: var(--exit); }
        #start-btn:hover, .difficulty-btn:hover { background-color: #38d67a; }
        .difficulty-btn.active {
            background-color: var(--primary);
            box-shadow: 0 2px var(--bg-dark), inset 0 3px 5px rgba(0,0,0,0.3);
            transform: translateY(2px);
        }

        /* --- Modal --- */
        #modal {
            display: none; /* Hidden by default */
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: var(--bg-light);
            margin: auto;
            padding: 30px;
            border: 2px solid var(--primary);
            border-radius: 10px;
            width: 80%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            animation: fadeIn 0.5s;
        }
        @keyframes fadeIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

        .modal-content h2 {
            color: var(--secondary);
            font-size: 2em;
        }
        .modal-content p {
            font-size: 1.2em;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>Maze Runner Deluxe</h1> 
         
         <button class="shoulder-btn shoulder-right" onclick="location.href='../gamehall.html'">Game Hall</button>
         
               
        <button class="shoulder-btn shoulder-left" onclick="location.href='../profile.html'">Dashboard</button>        

        <div id="game-hud">
            <div>Timer: <span id="timer">0s</span></div>
            <div>Moves: <span id="move-count">0</span></div>
            <div>Coins: <span id="coin-count">0 / 0</span></div>
        </div>

        <canvas id="mazeCanvas"></canvas>
        <p id="game-status">Select a difficulty and start!</p>

        <div id="controls-section">
             <!-- D-Pad for mobile -->
            <div id="movement-controls" style="display: none;">
                <button id="up-btn" class="btn move-btn">Up</button>
                <div class="btn-group">
                    <button id="left-btn" class="btn move-btn">Left</button>
                    <button id="down-btn" class="btn move-btn">Down</button>
                    <button id="right-btn" class="btn move-btn">Right</button>
                </div>
            </div>

            <!-- Start / Difficulty -->
            <div id="setup-controls">
                <div id="difficulty-controls" class="btn-group">
                    <button class="btn difficulty-btn active" data-difficulty="easy">Easy</button>
                    <button class="btn difficulty-btn" data-difficulty="medium">Medium</button>
                    <button class="btn difficulty-btn" data-difficulty="hard">Hard</button>
                </div>
                <button id="start-btn" class="btn">Start Game</button>
            </div>
        </div>
    </div>

    <!-- Win Modal -->
    <div id="modal" onclick="hideModal()">
        <div class="modal-content">
            <h2 id="modal-title">You Win!</h2>
            <p id="modal-time">Time: 120s</p>
            <p id="modal-moves">Moves: 150</p>
            <p>Click anywhere to play again.</p>
        </div>
    </div>


    <script>
        // --- DOM Elements ---
        const canvas = document.getElementById('mazeCanvas');
        const ctx = canvas.getContext('2d');
        const statusDisplay = document.getElementById('game-status');
        const timerDisplay = document.getElementById('timer');
        const moveDisplay = document.getElementById('move-count');
        const coinDisplay = document.getElementById('coin-count');

        const setupControls = document.getElementById('setup-controls');
        const movementControls = document.getElementById('movement-controls');
        const startBtn = document.getElementById('start-btn');
        
        const modal = document.getElementById('modal');
        const modalTitle = document.getElementById('modal-title');
        const modalTime = document.getElementById('modal-time');
        const modalMoves = document.getElementById('modal-moves');

        // --- Audio (using base64 to be self-contained) ---
        const sfx = {
            move: new Audio("data:audio/wav;base64,UklGRloAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YVgAAAAIAAD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AP8A/wD/AA=="),
            coin: new Audio("data:audio/wav;base64,UklGRlIAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YUYAAABIAEsAVQBfAGIAZgBqAGwAbgBvAHEAcwB1AHkAfQB/AIEAgwCDAIUAhgCHAIkAiACIAIcAhgCFAIMAgQCAAH4AfAB5AHMAbwBrAGcAZQBfAFUATwBJAEIAPwA7ADgANgA0ADMANAA1ADcAOQA/AEMARwBMAFEAVwBcAGIAZgBoAGoAbABsAGsAagBpAGgAaQBqAGsAbABsAGwAawBqAGkAaQBqAGsAawBrAGoAagBqAGoAagBqAGkAaQBqAGkA"),
            win: new Audio("data:audio/wav;base64,UklGRlMBAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YUsBAABAAEEAQgBDAEQARgBIAEoATQBPAFIATwBNAEsASABFAEEAPQA7ADgANgA1ADQANQA2ADgAOwA+AEEAQwBGAEkATgBRQFQAVwBZAFwAXwBjAGYAZwBqAGwAbgBwAHIAcwB1AHgAegB8AH8AgQCFAIgAigCNAI4AkQCVAJcAmACZAJsAnQCgAKMApwCoAKoAqgCrAKwArQCtAK0ArQCsAKoApwCeAJoAlgCQAIsAhwCAAHwAdgBwAGkAYgBcAFMAUQBLAEcARABBAEQARwBLAE8AUwBXAFsAXgBhAGQAZwBqAG0AcABzAHYAgwCEAIgAigCNAI4AkQCVAJcAmACaAJsAnQCgAKMApwCpAKsAsACyALMAtAC2ALcAuAC5ALoAugC7ALsAuwC7ALsAuwC7ALoAuAC0ALEAowCbAJQAhwB+AHgAcgBtAGUAXwBWAFIA"),
            bump: new Audio("data:audio/wav;base64,UklGRlAAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YUYAAABkAGYAagBsAGwAbQBtAGwAawBqAGgAZwBlAGMAZABjAGQAZQBmAGcAZABlAGUAZQBkAGMAZABlAGYAZwBnAGcAaABpAGkAagBqAGkAaABnAGYAZgBnAGgAaQBqAGsAawBqAGkAaABnAGcAZwBnAGgAaQBqAGoAagBpAGgAZwBnAGYAZgBnAGgAaABoAGgAZwBmAGUA")
        };
        Object.values(sfx).forEach(s => s.volume = 0.5); // Adjust volume globally

        // --- Game Config & State ---
        const config = {
            difficulty: {
                easy: { size: 11, coins: 3, canvas: 330 }, // Odd sizes work best for this algorithm
                medium: { size: 21, coins: 8, canvas: 420 },
                hard: { size: 31, coins: 15, canvas: 620 }
            },
            colors: {
                path: getComputedStyle(document.documentElement).getPropertyValue('--secondary').trim(),
                wall: getComputedStyle(document.documentElement).getPropertyValue('--wall').trim(),
                player: getComputedStyle(document.documentElement).getPropertyValue('--player').trim(),
                exit: getComputedStyle(document.documentElement).getPropertyValue('--exit').trim(),
                coin: getComputedStyle(document.documentElement).getPropertyValue('--coin').trim(),
            }
        };

        let maze, player, exit, gridSize;
        let gameState = {
            running: false,
            moves: 0,
            coinsCollected: 0,
            totalCoins: 0,
            startTime: 0,
            timerInterval: null
        };

        // --- Game Initialization ---
        function initGame() {
            // 1. Get selected difficulty
            const selectedDifficulty = document.querySelector('.difficulty-btn.active').dataset.difficulty;
            const settings = config.difficulty[selectedDifficulty];
            const mazeSize = settings.size;

            // 2. Setup canvas and grid
            canvas.width = canvas.height = settings.canvas;
            gridSize = canvas.width / mazeSize;
            
            // 3. Reset game state
            gameState.running = true;
            gameState.moves = 0;
            gameState.coinsCollected = 0;
            gameState.totalCoins = settings.coins;
            
            // 4. Generate maze and game elements
            maze = generateMaze(mazeSize, mazeSize);
            // --- FIX --- Call the new function to guarantee the exit is reachable
            ensurePathToExit(maze);
            
            player = { x: 0, y: 0 };
            exit = { x: mazeSize - 1, y: mazeSize - 1 };
            scatterCoins(settings.coins);

            // 5. Update UI
            setupControls.style.display = 'none';
            movementControls.style.display = 'flex';
            statusDisplay.textContent = 'Find the exit!';
            startTimer();
            updateHUD();

            // 6. Draw game and enable controls
            drawGame();
            enableControls();
        }

        // --- Maze Generation (Recursive Backtracking) ---
        function generateMaze(cols, rows) {
            // This algorithm works best with odd dimensions. It creates a perfect maze
            // where all path cells are connected, but doesn't guarantee a specific cell (like the exit) is a path.
            let grid = Array(rows).fill(null).map(() => Array(cols).fill(1)); // 1 = wall
            let stack = [];
            let current = { x: 0, y: 0 };
            grid[current.y][current.x] = 0; // 0 = path

            do {
                let neighbors = getUnvisitedNeighbors(current, grid);
                if (neighbors.length > 0) {
                    let next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    stack.push(current);
                    // Carve path between current and next
                    grid[current.y + (next.y - current.y) / 2][current.x + (next.x - current.x) / 2] = 0;
                    grid[next.y][next.x] = 0;
                    current = next;
                } else if (stack.length > 0) {
                    current = stack.pop();
                }
            } while (stack.length > 0);

            return grid;
        }
        
        // --- FIX --- New function to guarantee a solvable maze
        function ensurePathToExit(grid) {
            const mazeHeight = grid.length;
            const mazeWidth = grid[0].length;
            
            // If the exit is a wall, we must open it up.
            if (grid[mazeHeight - 1][mazeWidth - 1] === 1) {
                grid[mazeHeight - 1][mazeWidth - 1] = 0; // Open the exit cell itself
                
                // Also, open up at least one adjacent cell to connect it to the maze.
                // This prevents the exit from being a closed-off 1x1 room.
                // We'll prioritize opening the cell to the left, then above.
                if (mazeWidth > 1 && grid[mazeHeight - 1][mazeWidth - 2] === 1) {
                     grid[mazeHeight - 1][mazeWidth - 2] = 0;
                } else if (mazeHeight > 1 && grid[mazeHeight - 2][mazeWidth - 1] === 1) {
                    grid[mazeHeight - 2][mazeWidth - 1] = 0;
                }
            }
        }

        function getUnvisitedNeighbors(cell, grid) {
            const neighbors = [];
            const { x, y } = cell;
            const mazeHeight = grid.length;
            const mazeWidth = grid[0].length;

            if (y > 1 && grid[y - 2][x] === 1) neighbors.push({ x: x, y: y - 2 });
            if (y < mazeHeight - 2 && grid[y + 2][x] === 1) neighbors.push({ x: x, y: y + 2 });
            if (x > 1 && grid[y][x - 2] === 1) neighbors.push({ x: x - 2, y: y });
            if (x < mazeWidth - 2 && grid[y][x + 2] === 1) neighbors.push({ x: x + 2, y: y });

            return neighbors;
        }

        function scatterCoins(numCoins) {
            let placedCoins = 0;
            const mazeHeight = maze.length;
            const mazeWidth = maze[0].length;

            while (placedCoins < numCoins) {
                const r = Math.floor(Math.random() * mazeHeight);
                const c = Math.floor(Math.random() * mazeWidth);
                // Place coin on a path, not at start or exit
                if (maze[r][c] === 0 && !(r === 0 && c === 0) && !(r === exit.y && c === exit.x)) {
                    maze[r][c] = 2; // 2 = coin
                    placedCoins++;
                }
            }
        }

        // --- Drawing Functions ---
        function drawGame() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawMaze();
            drawExit();
            drawPlayer();
        }

        function drawMaze() {
            for (let r = 0; r < maze.length; r++) {
                for (let c = 0; c < maze[0].length; c++) {
                    const x = c * gridSize;
                    const y = r * gridSize;
                    if (maze[r][c] === 1) {
                        ctx.fillStyle = config.colors.wall;
                        ctx.fillRect(x, y, gridSize, gridSize);
                    } else {
                        ctx.fillStyle = config.colors.path;
                        ctx.fillRect(x, y, gridSize, gridSize);
                        if (maze[r][c] === 2) { // Draw coin
                            ctx.fillStyle = config.colors.coin;
                            ctx.beginPath();
                            ctx.arc(x + gridSize / 2, y + gridSize / 2, gridSize / 4, 0, 2 * Math.PI);
                            ctx.fill();
                        }
                    }
                }
            }
        }
        
        function drawPlayer() {
            ctx.fillStyle = config.colors.player;
            ctx.fillRect(player.x * gridSize + gridSize * 0.1, player.y * gridSize + gridSize * 0.1, gridSize * 0.8, gridSize * 0.8);
        }

        function drawExit() {
            ctx.fillStyle = config.colors.exit;
            ctx.fillRect(exit.x * gridSize, exit.y * gridSize, gridSize, gridSize);
        }
        
        // --- Game Logic ---
        function movePlayer(dx, dy) {
            if (!gameState.running) return;
            const newX = player.x + dx;
            const newY = player.y + dy;

            if (isValidMove(newX, newY)) {
                player.x = newX;
                player.y = newY;
                
                gameState.moves++;
                playSound(sfx.move);
                
                // Check for coin
                if (maze[newY][newX] === 2) {
                    maze[newY][newX] = 0; // Collect coin
                    gameState.coinsCollected++;
                    playSound(sfx.coin);
                }
                
                drawGame();
                updateHUD();
                checkWinCondition();
            } else {
                 playSound(sfx.bump);
            }
        }
        
        function isValidMove(x, y) {
            const mazeHeight = maze.length;
            const mazeWidth = maze[0].length;
            return x >= 0 && x < mazeWidth && y >= 0 && y < mazeHeight && maze[y][x] !== 1;
        }
        
        function checkWinCondition() {
            const atExit = player.x === exit.x && player.y === exit.y;
            const allCoinsCollected = gameState.coinsCollected === gameState.totalCoins;

            if (atExit) {
                if (allCoinsCollected) {
                    winGame();
                } else {
                    // Give the player feedback that they need more coins
                    statusDisplay.textContent = `Collect all coins to exit! (${gameState.coinsCollected}/${gameState.totalCoins})`;
                }
            } else {
                 // Reset status message if player moves away from the exit
                 statusDisplay.textContent = 'Find the exit!';
            }
        }
        
        function winGame() {
            gameState.running = false;
            stopTimer();
            playSound(sfx.win);
            disableControls();
            
            // Show win modal
            modalTitle.textContent = "You Win!";
            modalTime.textContent = `Time: ${timerDisplay.textContent}`;
            modalMoves.textContent = `Moves: ${gameState.moves}`;
            modal.style.display = 'flex';
        }

        function playSound(sound) {
            sound.currentTime = 0;
            sound.play().catch(e => console.log("Sound play failed:", e));
        }

        // --- UI & Controls ---
        function updateHUD() {
            moveDisplay.textContent = gameState.moves;
            coinDisplay.textContent = `${gameState.coinsCollected} / ${gameState.totalCoins}`;
        }
        
        function startTimer() {
            gameState.startTime = Date.now();
            gameState.timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - gameState.startTime) / 1000);
                timerDisplay.textContent = `${elapsed}s`;
            }, 1000);
        }
        
        function stopTimer() {
            clearInterval(gameState.timerInterval);
        }

        function hideModal() {
            modal.style.display = 'none';
            resetToTitleScreen();
        }
        
        function resetToTitleScreen() {
            movementControls.style.display = 'none';
            setupControls.style.display = 'flex';
            statusDisplay.textContent = 'Select a difficulty and start!';
            timerDisplay.textContent = '0s';
            moveDisplay.textContent = '0';
            coinDisplay.textContent = '0 / 0';
            ctx.fillStyle = config.colors.path;
            ctx.fillRect(0,0,canvas.width, canvas.height);
        }

        function handleKeyPress(e) {
            if (!gameState.running) return;
            e.preventDefault(); // Prevent page scrolling
            switch (e.key) {
                case 'ArrowUp': case 'w': movePlayer(0, -1); break;
                case 'ArrowDown': case 's': movePlayer(0, 1); break;
                case 'ArrowLeft': case 'a': movePlayer(-1, 0); break;
                case 'ArrowRight': case 'd': movePlayer(1, 0); break;
            }
        }

        function enableControls() {
            document.addEventListener('keydown', handleKeyPress);
            movementControls.querySelector('#up-btn').onclick = () => movePlayer(0, -1);
            movementControls.querySelector('#down-btn').onclick = () => movePlayer(0, 1);
            movementControls.querySelector('#left-btn').onclick = () => movePlayer(-1, 0);
            movementControls.querySelector('#right-btn').onclick = () => movePlayer(1, 0);
        }

        function disableControls() {
            document.removeEventListener('keydown', handleKeyPress);
            movementControls.querySelectorAll('.btn').forEach(b => b.onclick = null);
        }

        // --- Event Listeners Setup ---
        document.addEventListener('DOMContentLoaded', () => {
            document.querySelectorAll('.difficulty-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                });
            });
            startBtn.addEventListener('click', initGame);
            modal.addEventListener('click', hideModal);
            
            // Set initial canvas size
            const initialSettings = config.difficulty.medium;
            canvas.width = canvas.height = initialSettings.canvas;
            ctx.fillStyle = config.colors.path;
            ctx.fillRect(0,0,canvas.width, canvas.height);
        });
    </script>
</body>
</html>
