 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memory Match Game</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #2c3e50;
            --bg-light: #34495e;
            --primary: #3498db;
            --secondary: #ecf0f1;
            --accent: #f1c40f;
            --success: #2ecc71;
            --card-size: 100px;
            --grid-cols: 4;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 10px;
        }

        .memory-game {
            background-color: var(--bg-light);
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.4);
            text-align: center;
            color: var(--secondary);
            position: relative;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            color: var(--accent);
            margin-top: 0;
        }

        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .game-info {
            display: flex;
            gap: 20px;
            font-size: 1.2em;
        }

        #pause-btn {
            background: none; border: none;
            color: var(--secondary); font-size: 1.8em;
            cursor: pointer; transition: transform 0.3s;
        }
        #pause-btn:hover { transform: scale(1.1) rotate(45deg); }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(var(--grid-cols), 1fr); /* Use fractional units */
            grid-gap: 10px;
            perspective: 1000px;
        }

        .card {
            width: 100%; /* Fill the grid cell */
            aspect-ratio: 1 / 1; /* Maintain square shape */
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            cursor: pointer;
        }

        .card.is-flipped { transform: rotateY(180deg); }

        .card-face {
            position: absolute;
            width: 100%; height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40%; /* Relative font size that will scale with the card */
            font-size: min(6vw, 2.5em); /* Responsive font size */
            transition: background-color 0.3s, color 0.3s;
        }

        .card-face.card-front { background: var(--primary); color: var(--secondary); }
        .card-face.card-back { background: var(--secondary); color: var(--primary); transform: rotateY(180deg); }
        .card.is-matched .card-back { background-color: var(--success); color: white; }

        /* Overlays (for Setup, Pause, Win) */
        .overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.75);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease-in-out;
            padding: 10px;
        }
        .overlay.show { opacity: 1; pointer-events: auto; }

        .overlay-box {
            background: white;
            color: var(--bg-dark);
            padding: 30px;
            border-radius: 10px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            transform: scale(0.8);
            transition: transform 0.4s ease-in-out;
        }
        .overlay.show .overlay-box { transform: scale(1); }

        .overlay-box h2 { margin-top: 0; font-size: 1.8em; }
        .overlay-box p { margin-bottom: 20px; font-size: 1.1em; }

        .btn {
            background-color: var(--primary); color: white; border: none;
            padding: 12px 20px; border-radius: 5px;
            font-size: 1em; cursor: pointer; margin: 5px;
            display: block; width: 100%;
        }
        .btn-secondary { background-color: #7f8c8d; }
        
        /* --- Responsive Design --- */
        @media (max-width: 600px) {
            .game-info { font-size: 0.9em; gap: 10px;}
            .overlay-box h2 { font-size: 1.5em; }
            .overlay-box p { font-size: 1em; }
            .btn { padding: 15px 10px; }
        }
    </style>
</head>
<body>

<div class="memory-game">
    <!-- The HTML structure remains the same -->
    <div class="game-header">
        <div class="game-info">
            <div class="moves">Moves: <span id="moves-count">0</span></div>
            <div class="timer">Time: <span id="timer-display">0s</span></div>
        </div>
        <button id="pause-btn" title="Pause Game"><i class="fas fa-cog"></i></button>
    </div>
    <div class="game-board"></div>

    <div id="setup-overlay" class="overlay show">
        <div class="overlay-box">
            <h2>Welcome to Memory Match!</h2>
            <p>Choose your difficulty:</p>
            <div class="difficulty-options"></div>
        </div>
    </div>
    <div id="pause-overlay" class="overlay">
        <div class="overlay-box">
            <h2 id="pause-title">Game Paused</h2>
            <div id="menu-options" style="display: none;">
                <p>Where would you like to go?</p>
                <a href="gamehall.html" class="btn">Game Hall</a>
                <a href="dashboard.html" class="btn">Dashboard</a>
                <button id="back-to-pause-btn" class="btn btn-secondary">Back</button>
            </div>
            <div id="pause-options">
                <button id="resume-btn" class="btn">Resume</button>
                <button id="menu-btn" class="btn btn-secondary">Menu</button>
            </div>
        </div>
    </div>
    <div id="win-overlay" class="overlay">
        <div class="overlay-box">
            <h2>You Won!</h2>
            <p>Final Time: <span id="final-time"></span></p>
            <p>Total Moves: <span id="final-moves"></span></p>
            <button id="restart-btn" class="btn">Play Again</button>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- DOM ELEMENTS ---
    const gameBoard = document.querySelector('.game-board');
    const movesCountEl = document.getElementById('moves-count');
    const timerDisplayEl = document.getElementById('timer-display');
    const pauseBtn = document.getElementById('pause-btn');
    const resumeBtn = document.getElementById('resume-btn');
    const menuBtn = document.getElementById('menu-btn');
    const backToPauseBtn = document.getElementById('back-to-pause-btn');
    const restartBtn = document.getElementById('restart-btn');
    const setupOverlay = document.getElementById('setup-overlay');
    const pauseOverlay = document.getElementById('pause-overlay');
    const winOverlay = document.getElementById('win-overlay');
    const difficultyOptions = document.querySelector('.difficulty-options');
    const pauseOptions = document.getElementById('pause-options');
    const menuOptions = document.getElementById('menu-options');
    const pauseTitle = document.getElementById('pause-title');

    // --- GAME DATA & CONFIG ---
    const cardData = [
        { "name": "diamond", "icon": "fa-diamond" }, { "name": "plane", "icon": "fa-paper-plane" },
        { "name": "anchor", "icon": "fa-anchor" }, { "name": "bolt", "icon": "fa-bolt" },
        { "name": "cube", "icon": "fa-cube" }, { "name": "leaf", "icon": "fa-leaf" },
        { "name": "bicycle", "icon": "fa-bicycle" }, { "name": "bomb", "icon": "fa-bomb" },
        { "name": "star", "icon": "fa-star" }, { "name": "heart", "icon": "fa-heart" },
        { "name": "car", "icon": "fa-car" }, { "name": "moon", "icon": "fa-moon" }
    ];

    const difficultyLevels = {
        easy:   { pairs: 4, cols: 4, name: 'Easy (4x2)' },
        medium: { pairs: 8, cols: 4, name: 'Medium (4x4)' },
        hard:   { pairs: 12, cols: 6, name: 'Hard (6x4)' }
    };

    // --- GAME STATE ---
    let flippedCards = [], matchedPairs = 0, moves = 0, timer = 0, totalPairs = 0;
    let timerInterval = null, boardLocked = false, gamePaused = false;

    // The entire JavaScript logic remains the same as the previous version.
    // No changes are needed in the JS for the responsiveness, as it's all handled by CSS.
    
    function showSetupScreen() {
        difficultyOptions.innerHTML = '';
        Object.values(difficultyLevels).forEach(level => {
            const button = document.createElement('button');
            button.classList.add('btn');
            button.textContent = level.name;
            button.onclick = () => { setupOverlay.classList.remove('show'); setupGame(level); };
            difficultyOptions.appendChild(button);
        });
    }

    function setupGame(difficulty) {
        resetState();
        totalPairs = difficulty.pairs;
        gameBoard.style.setProperty('--grid-cols', difficulty.cols);
        const neededCards = cardData.slice(0, totalPairs);
        const gameCards = [...neededCards, ...neededCards];
        shuffle(gameCards);
        createCardElements(gameCards);
        startTimer();
    }

    function resetState() {
        flippedCards = []; matchedPairs = 0; moves = 0; timer = 0;
        boardLocked = false; gamePaused = false;
        movesCountEl.textContent = '0'; timerDisplayEl.textContent = '0s';
        clearInterval(timerInterval);
        winOverlay.classList.remove('show'); pauseOverlay.classList.remove('show');
    }

    function shuffle(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function createCardElements(gameCards) {
        gameBoard.innerHTML = '';
        gameCards.forEach(cardInfo => {
            const cardElement = document.createElement('div');
            cardElement.classList.add('card');
            cardElement.dataset.name = cardInfo.name;
            cardElement.innerHTML = `
                <div class="card-face card-front"><i class="fas fa-question"></i></div>
                <div class="card-face card-back"><i class="fas ${cardInfo.icon}"></i></div>`;
            cardElement.addEventListener('click', handleCardClick);
            gameBoard.appendChild(cardElement);
        });
    }

    function handleCardClick(event) {
        const clickedCard = event.currentTarget;
        if (boardLocked || gamePaused || clickedCard.classList.contains('is-flipped')) return;
        flipCard(clickedCard);
        if (flippedCards.length === 2) {
            incrementMoves(); boardLocked = true; checkForMatch();
        }
    }

    function flipCard(card) { card.classList.add('is-flipped'); flippedCards.push(card); }
    function checkForMatch() { const [c1, c2] = flippedCards; c1.dataset.name === c2.dataset.name ? handleMatchedCards() : handleMismatchedCards(); }
    function handleMatchedCards() {
        flippedCards.forEach(card => card.classList.add('is-matched'));
        matchedPairs++;
        flippedCards = []; boardLocked = false;
        if (matchedPairs === totalPairs) winGame();
    }
    function handleMismatchedCards() { setTimeout(() => { flippedCards.forEach(c => c.classList.remove('is-flipped')); flippedCards = []; boardLocked = false; }, 1000); }

    function pauseGame() {
        gamePaused = true; clearInterval(timerInterval);
        pauseOverlay.classList.add('show');
        pauseTitle.textContent = "Game Paused";
        menuOptions.style.display = 'none';
        pauseOptions.style.display = 'block';
    }

    function resumeGame() {
        gamePaused = false; startTimer();
        pauseOverlay.classList.remove('show');
    }

    function winGame() {
        clearInterval(timerInterval);
        document.getElementById('final-time').textContent = `${timer}s`;
        document.getElementById('final-moves').textContent = moves;
        winOverlay.classList.add('show');
    }

    function incrementMoves() { moves++; movesCountEl.textContent = moves; }
    function startTimer() { timerInterval = setInterval(() => { if (!gamePaused) { timer++; timerDisplayEl.textContent = `${timer}s`; } }, 1000); }

    pauseBtn.addEventListener('click', pauseGame);
    resumeBtn.addEventListener('click', resumeGame);
    restartBtn.addEventListener('click', () => { winOverlay.classList.remove('show'); showSetupScreen(); });
    menuBtn.addEventListener('click', () => { pauseTitle.textContent = "Main Menu"; pauseOptions.style.display = 'none'; menuOptions.style.display = 'block'; });
    backToPauseBtn.addEventListener('click', () => { pauseTitle.textContent = "Game Paused"; menuOptions.style.display = 'none'; pauseOptions.style.display = 'block'; });

    showSetupScreen();
});
</script>

</body>
</html>
