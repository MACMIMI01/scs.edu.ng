<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthy Food Maze</title>
    <style>
        /* Global Styles (Inferred from global.css) */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji", "Segoe UI Symbol";
            margin: 0;
            background-color: #e0f2f1; /* Light teal background */
            color: #333;
        }
        * {
            box-sizing: border-box;
            -webkit-user-select: none; /* Disable text selection on controls */
            user-select: none;
        }
        header, footer {
            background-color: #00796b; /* Teal */
            color: white;
            padding: 1em;
            text-align: center;
        }
        .main-title { margin: 0; }
        
        /* Maze Game Specific Styles */
        .game-container {
            padding: 20px;
            max-width: 800px;
            margin: 20px auto;
            background-color: #f8fcf5;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.15);
            text-align: center;
        }
        .game-title {
            color: #2e8b57;
            margin-bottom: 10px;
            font-size: 2em;
        }
        .game-info {
            color: #556b2f;
            font-size: 1em;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .maze-grid {
            display: grid;
            border: 3px solid #3cb371;
            background-color: #e6ffe6;
            margin: 0 auto; /* Removed top/bottom margin */
            padding: 5px;
            box-shadow: inset 0 0 8px rgba(0, 100, 0, 0.2);
            touch-action: none; /* Prevents browser scrolling on swipe */
        }
        .maze-cell {
            width: 50px;
            height: 50px;
            border: 1px solid rgba(0,0,0,0.05);
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6em;
            transition: all 0.2s ease-in-out;
        }
        .maze-cell.wall {
            background-color: #8b4513;
            border-radius: 4px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.3);
        }
        .maze-cell.path { background-color: #f0f8ff; }
        .maze-cell.end { background-color: #ff6347; color: white; font-size: 1.8em; }
        .maze-cell.player {
            background-color: #4682b4; color: white;
            border-radius: 50%; transform: scale(0.9);
            box-shadow: 0 0 10px rgba(70, 130, 180, 0.7);
            animation: pop 0.2s ease-out;
        }
        @keyframes pop {
            from { transform: scale(0.8); }
            to { transform: scale(0.9); }
        }
        .maze-cell .food-item { text-shadow: 0 0 8px rgba(255, 255, 255, 0.8); }
        .maze-cell.collected-healthy, .maze-cell.collected-unhealthy { animation: fadeOut 0.5s forwards; }
        @keyframes fadeOut { to { opacity: 0; transform: scale(0.5); } }

        /* --- Controls --- */
        .controls { margin-top: 20px; }
        .game-button {
            padding: 10px 20px; font-size: 1em;
            background-color: #32cd32; color: white;
            border: none; border-radius: 8px; cursor: pointer;
            transition: background-color 0.3s ease, transform 0.1s ease;
            margin: 5px; box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .game-button:hover:not(:disabled) {
            background-color: #228b22; transform: translateY(-2px);
        }
        .game-button:disabled { background-color: #9E9E9E; cursor: not-allowed; }
        #next-level-btn { background-color: #009688; }
        #next-level-btn:hover:not(:disabled) { background-color: #00796b; }
        .game-feedback { margin-top: 15px; min-height: 1.2em; font-size: 1.2em; font-weight: bold; color: #d35400; }
        .score-display { margin-top: 10px; font-size: 1em; color: #4CAF50; font-weight: bold; }

        /* --- NEW: D-Pad for Mobile --- */
        #d-pad-controls {
            display: none; /* Hidden by default, shown on mobile */
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            gap: 5px;
        }
        .d-pad-btn {
            width: 60px; height: 60px;
            font-size: 2em; color: white;
            background-color: #5d6d7e;
            border: 2px solid #34495e;
            border-radius: 12px;
            box-shadow: 0 4px #34495e;
            display: flex; align-items: center; justify-content: center;
        }
        .d-pad-btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px #34495e;
        }
        .d-pad-middle-row { display: flex; gap: 5px; }
        #down-btn { margin: 0 65px; } /* Creates space between left/right */
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .game-container { padding: 10px; margin: 10px; }
            .maze-cell { width: 11vw; height: 11vw; max-width: 45px; max-height: 45px; font-size: 1.4em; }
            .game-title { font-size: 1.5em; }
            .game-info { font-size: 0.9em; margin-bottom: 10px; }
            #d-pad-controls { display: flex; } /* Show D-pad on smaller screens */
        }
    </style>
</head>
<body>
    <header>
        <h1 class="main-title">PHE Learning Games</h1>
        <nav class="main-nav">
            <a href="../../index.html" class="nav-link">Home</a>
            <a href="../../../../gamehall.html" class="nav-link">Game Hall</a>
            <a href="../obstacle-course/obstacle.html" class="nav-link">Obstacle Course</a>            
            <a href="../traffic-light/traffic.html" class="nav-link">Traffic Light Game</a>
            <a href="../anatomy-sim/anatomy.html" class="nav-link">Anatomy Simulation</a>
        </nav>
    </header>

    <main id="game-container" class="game-container">
        <h2 id="level-title" class="game-title">Loading...</h2>
        <p id="level-info" class="game-info"></p>
        <div id="maze-grid" class="maze-grid"></div>
        
        <div class="controls">
            <button id="restart-level-btn" class="game-button">Restart</button>
            <button id="next-level-btn" class="game-button" style="display: none;">Next Level</button>
        </div>

        <!-- NEW: D-Pad HTML -->
        <div id="d-pad-controls">
            <button id="up-btn" class="d-pad-btn">▲</button>
            <div class="d-pad-middle-row">
                <button id="left-btn" class="d-pad-btn">◀</button>
                <button id="down-btn" class="d-pad-btn">▼</button>
                <button id="right-btn" class="d-pad-btn">▶</button>
            </div>
        </div>
        
        <p id="game-feedback" class="game-feedback"></p>
        <p id="score-display" class="score-display">Score: 0 | Healthy: 0 | Unhealthy: 0</p>
    </main>

    <footer class="game-footer">
        © 2025 PHE Learning. All rights reserved.
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Elements ---
            const mazeGrid = document.getElementById('maze-grid');
            const levelTitle = document.getElementById('level-title');
            const levelInfo = document.getElementById('level-info');
            const gameFeedback = document.getElementById('game-feedback');
            const scoreDisplay = document.getElementById('score-display');
            const restartLevelBtn = document.getElementById('restart-level-btn');
            const nextLevelBtn = document.getElementById('next-level-btn');
            // NEW: D-pad buttons
            const upBtn = document.getElementById('up-btn');
            const downBtn = document.getElementById('down-btn');
            const leftBtn = document.getElementById('left-btn');
            const rightBtn = document.getElementById('right-btn');

            // --- Game Data (Embedded) ---
            const levelsData = { "levels": [ { "levelName": "Beginner Bites", "gridSize": 5, "start": [0, 0], "end": [4, 4], "layout": ["PFFFF", "WWHWW", "FWFFW", "FWFHW", "FFFFE"], "healthyFoods": ["🍎", "🥕", "🍓"], "unhealthyFoods": ["🍩", "🍔", "🍰"], "info": "Use arrow keys, D-pad, or swipe to move. Collect healthy food and reach the goal! 🏁" }, { "levelName": "Fruity Fun", "gridSize": 6, "start": [5, 1], "end": [0, 5], "layout": ["WWWWWE", "FFHFFH", "HFWWWF", "FWFFWF", "WWFWWF", "PFFHFF"], "healthyFoods": ["🍇", "🍌", "🥝"], "unhealthyFoods": ["🍕", "🍦", "🍭"], "info": "This maze is trickier! Collect the fruits on your way to the exit." }, { "levelName": "Veggie Voyage", "gridSize": 7, "start": [0, 0], "end": [6, 6], "layout": ["PFWWWWW", "FHHWWFF", "FWFFWWW", "FHWFWUF", "FWFFWFW", "FFWFFHW", "WWWWWFE"], "healthyFoods": ["🥦", "🌶️", "🥬"], "unhealthyFoods": ["🥐", "🥨", "🍪"], "info": "Find your way through the veggie patch. Collect all the veggies you can!" }, { "levelName": "Protein Powerup", "gridSize": 8, "start": [7, 0], "end": [0, 7], "layout": ["WWWWWWFP", "WHWWWWFW", "FFFFFFFW", "WHWWWHFW", "FWFFWWFW", "FWFWFWFW", "FHWFHFHW", "EFFFFWWW"], "healthyFoods": ["🥚", "🐟", "🍗"], "unhealthyFoods": ["🥓", "🌭", "🍖"], "info": "Boost your energy with proteins! A challenging level awaits." }, { "levelName": "Grain Gauntlet", "gridSize": 7, "start": [3, 0], "end": [3, 6], "layout": ["WWFPFWW", "WWFUFWW", "WHFWFFW", "PFFHFFE", "WFFWFFW", "WUWFWWW", "WWWWWWW"], "healthyFoods": ["🍞", "🍚", "🍝"], "unhealthyFoods": ["🍜", "🥡", "🥟"], "info": "Complex carbs give you sustained energy. Find your way through the grain maze!" }, { "levelName": "Dairy Dash", "gridSize": 6, "start": [0, 2], "end": [5, 3], "layout": ["WWPWWW", "HFFFWU", "WHFWFW", "WFFWFE", "WFFHFW", "WWWWWW"], "healthyFoods": ["🥛", "🧀", "🍦"], "unhealthyFoods": ["🍬", "🍫", "🍩"], "info": "Strong bones need dairy! But choose wisely." }, { "levelName": "Hydration Highway", "gridSize": 5, "start": [0, 1], "end": [4, 3], "layout": ["WPUWW", "FWFFW", "HWHFW", "FWFFW", "WFEWW"], "healthyFoods": ["💧", "🥥", "🍋"], "unhealthyFoods": ["🥤", "🍺", "🍷"], "info": "Stay hydrated! Find the water and healthy liquids." }, { "levelName": "Vitamin Victory", "gridSize": 7, "start": [0, 0], "end": [6, 6], "layout": ["PFWWWWW", "FWFFFUF", "HWWWWFW", "FFFHWFW", "FWWHWHW", "FWHFFFF", "WWWWFFE"], "healthyFoods": ["🍊", "🥝", "🍍"], "unhealthyFoods": ["🥐", "🥨", "🍪"], "info": "Vitamins are key for health. Collect them all on your way!" }, { "levelName": "Mineral Mission", "gridSize": 8, "start": [0, 7], "end": [7, 0], "layout": ["WWWWWWFE", "FWHWWFFW", "FWHWWFWW", "FWFHHHWW", "FWFWWWHW", "FWHFHHFW", "FWWWWWFW", "PFFFFFHW"], "healthyFoods": ["🌰", "🥬", "🥜"], "unhealthyFoods": ["🍩", "🍔", "🍰"], "info": "Seek out essential minerals to boost your body's functions!" }, { "levelName": "Balanced Diet Blitz", "gridSize": 9, "start": [4, 0], "end": [4, 8], "layout": ["WWWHPUWWW", "WFFFWFWHW", "WWFWHFWFW", "FWHFWUWHF", "HFFHFEFFH", "FWHFWFWHF", "WWFWHFWFW", "WUFFWFWHW", "WWWWFWWWW"], "healthyFoods": ["🍏", "🍞", "🍗", "🥛", "🥦"], "unhealthyFoods": ["🍕", "🍟", "🥤", "🍩", "🍔"], "info": "The ultimate test! Find a balanced diet and reach the end." } ] };
            
            // --- Game State & other variables ---
            let currentLevelIndex = 0;
            let playerPosition, score, healthyItemsCollected, unhealthyItemsTouched, currentMaze, currentLevel, gameActive;
            const playerEmoji = '🥱'; const endEmoji = '🧭';
            
            // Sound effects are self-contained
            const sfx = { collect: new Audio("data:audio/wav;base64,UklGRlIAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YUYAAABIAEsAVQBfAGIAZgBqAGwAbgBvAHEAcwB1AHkAfQB/AIEAgwCDAIUAhgCHAIkAiACIAIcAhgCFAIMAgQCAAH4AfAB5AHMAbwBrAGcAZQBfAFUATwBJAEIAPwA7ADgANgA0ADMANAA1ADcAOQA/AEMARwBMAFEAVwBcAGIAZgBoAGoAbABsAGsAagBpAGgAaQBqAGsAbABsAGwAawBqAGkAaQBqAGsAawBrAGoAagBqAGoAagBqAGkAaQBqAGkA"), wrong: new Audio("data:audio/wav;base64,UklGRlAAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YUYAAABkAGYAagBsAGwAbQBtAGwAawBqAGgAZwBlAGMAZABjAGQAZQBmAGcAZABlAGUAZQBkAGMAZABlAGYAZwBnAGcAaABpAGkAagBqAGkAaABnAGYAZgBnAGgAaQBqAGsAawBqAGkAaABnAGcAZwBnAGgAaQBqAGoAagBpAGgAZwBnAGYAZgBnAGgAaABoAGgAZwBmAGUA"), win: new Audio("data:audio/wav;base64,UklGRlMBAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YUsBAABAAEEAQgBDAEQARgBIAEoATQBPAFIATwBNAEsASABFAEEAPQA7ADgANgA1ADQANQA2ADgAOwA+AEEAQwBGAEkATgBRQFQAVwBZAFwAXwBjAGYAZwBqAGwAbgBwAHIAcwB1AHgAegB8AH8AgQCFAIgAigCNAI4AkQCVAJcAmACZAJsAnQCgAKMApwCoAKoAqgCrAKwArQCtAK0ArQCsAKoApwCeAJoAlgCQAIsAhwCAAHwAdgBwAGkAYgBcAFMAUQBLAEcARABBAEQARwBLAE8AUwBXAFsAXgBhAGQAZwBqAG0AcABzAHYAgwCEAIgAigCNAI4AkQCVAJcAmACaAJsAnQCgAKMApwCpAKsAsACyALMAtAC2ALcAuAC5ALoAugC7ALsAuwC7ALsAuwC7ALoAuAC0ALEAowCbAJQAhwB+AHgAcgBtAGUAXwBWAFIA") };
            Object.values(sfx).forEach(s => s.volume = 0.4);

            // The rest of the functions (loadLevel, createMazeGrid, renderMaze, etc.) remain largely the same.
            function loadLevel(levelIndex) { /* ... same as before ... */ 
                if (levelIndex >= levelsData.levels.length) {
                    gameFeedback.textContent = 'Congratulations! You completed all levels!';
                    levelTitle.textContent = 'Game Over!';
                    levelInfo.textContent = 'You are a maze master!';
                    mazeGrid.innerHTML = ''; gameActive = false;
                    nextLevelBtn.style.display = 'none'; restartLevelBtn.style.display = 'none';
                    return;
                }
                gameActive = true; currentLevel = levelsData.levels[levelIndex];
                levelTitle.textContent = `Level ${levelIndex + 1}: ${currentLevel.levelName}`;
                levelInfo.textContent = currentLevel.info;
                for (let r = 0; r < currentLevel.gridSize; r++) { const c = currentLevel.layout[r].indexOf('P'); if (c !== -1) { playerPosition = { row: r, col: c }; break; } }
                healthyItemsCollected = 0; unhealthyItemsTouched = 0; score = 0;
                updateScoreDisplay(); gameFeedback.textContent = '';
                nextLevelBtn.style.display = 'none'; restartLevelBtn.disabled = false;
                createMazeGrid(); renderMaze(); document.addEventListener('keydown', handleKeyPress);
            }
            function createMazeGrid() { /* ... same as before ... */ 
                mazeGrid.style.gridTemplateColumns = `repeat(${currentLevel.gridSize}, 1fr)`;
                currentMaze = [];
                for (let r = 0; r < currentLevel.gridSize; r++) { const rowArr = []; for (let c = 0; c < currentLevel.gridSize; c++) { const cellType = currentLevel.layout[r][c]; rowArr.push({ type: cellType, content: cellType === 'H' ? getRandomItem(currentLevel.healthyFoods) : (cellType === 'U' ? getRandomItem(currentLevel.unhealthyFoods) : ''), collected: false }); } currentMaze.push(rowArr); }
            }
            function renderMaze() { /* ... same as before ... */
                mazeGrid.innerHTML = '';
                for (let r = 0; r < currentLevel.gridSize; r++) { for (let c = 0; c < currentLevel.gridSize; c++) { const cell = document.createElement('div'); cell.classList.add('maze-cell'); const cellData = currentMaze[r][c]; if (cellData.type === 'W') cell.classList.add('wall'); else cell.classList.add('path'); if (r === playerPosition.row && c === playerPosition.col) { cell.classList.add('player'); cell.textContent = playerEmoji; } else if (cellData.type === 'E') { cell.classList.add('end'); cell.textContent = endEmoji; } else if (cellData.content && !cellData.collected) { cell.innerHTML = `<span class="food-item">${cellData.content}</span>`; } mazeGrid.appendChild(cell); } }
            }
            function movePlayer(newRow, newCol) { /* ... same as before ... */
                if (newRow < 0 || newRow >= currentLevel.gridSize || newCol < 0 || newCol >= currentLevel.gridSize) { gameFeedback.textContent = 'Cannot move outside the maze!'; return; }
                const targetCellData = currentMaze[newRow][newCol];
                if (targetCellData.type === 'W') { gameFeedback.textContent = "Ouch! That's a wall."; return; }
                playerPosition = { row: newRow, col: newCol }; gameFeedback.textContent = '';
                const cellElement = mazeGrid.children[newRow * currentLevel.gridSize + newCol];
                if ((targetCellData.type === 'H' || targetCellData.type === 'U') && !targetCellData.collected) { targetCellData.collected = true; if (targetCellData.type === 'H') { healthyItemsCollected++; score += 10; gameFeedback.textContent = `Yum! +10 points!`; sfx.collect.play(); } else { unhealthyItemsTouched++; score -= 5; gameFeedback.textContent = `Oops! -5 points!`; sfx.wrong.play(); } cellElement.classList.add(targetCellData.type === 'H' ? 'collected-healthy' : 'collected-unhealthy'); }
                updateScoreDisplay(); renderMaze();
                if (targetCellData.type === 'E') { handleLevelComplete(); }
            }
            function handleLevelComplete() { /* ... same as before ... */
                gameActive = false; document.removeEventListener('keydown', handleKeyPress);
                gameFeedback.textContent = 'Level Complete! Well done!';
                gameFeedback.style.color = '#28a745';
                nextLevelBtn.style.display = 'inline-block'; restartLevelBtn.disabled = true;
                sfx.win.play();
            }
            function updateScoreDisplay() { scoreDisplay.textContent = `Score: ${score} | Healthy: ${healthyItemsCollected} | Unhealthy: ${unhealthyItemsTouched}`; }
            function getRandomItem(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

            // --- Control Handlers (Keyboard, D-Pad, Swipe) ---
            function handleKeyPress(event) {
                if (!gameActive) return;
                event.preventDefault();
                switch (event.key) {
                    case 'ArrowUp': movePlayer(playerPosition.row - 1, playerPosition.col); break;
                    case 'ArrowDown': movePlayer(playerPosition.row + 1, playerPosition.col); break;
                    case 'ArrowLeft': movePlayer(playerPosition.row, playerPosition.col - 1); break;
                    case 'ArrowRight': movePlayer(playerPosition.row, playerPosition.col + 1); break;
                }
            }
            
            // NEW: D-Pad Listeners
            upBtn.addEventListener('click', () => movePlayer(playerPosition.row - 1, playerPosition.col));
            downBtn.addEventListener('click', () => movePlayer(playerPosition.row + 1, playerPosition.col));
            leftBtn.addEventListener('click', () => movePlayer(playerPosition.row, playerPosition.col - 1));
            rightBtn.addEventListener('click', () => movePlayer(playerPosition.row, playerPosition.col + 1));

            // NEW: Swipe Gesture Listeners
            let touchStartX = 0;
            let touchStartY = 0;
            mazeGrid.addEventListener('touchstart', (e) => {
                touchStartX = e.changedTouches[0].screenX;
                touchStartY = e.changedTouches[0].screenY;
            }, { passive: true });

            mazeGrid.addEventListener('touchend', (e) => {
                if (!gameActive) return;
                const touchEndX = e.changedTouches[0].screenX;
                const touchEndY = e.changedTouches[0].screenY;
                handleSwipe(touchEndX - touchStartX, touchEndY - touchStartY);
            });

            function handleSwipe(deltaX, deltaY) {
                const swipeThreshold = 50; // Minimum distance for a swipe
                if (Math.abs(deltaX) > Math.abs(deltaY)) { // Horizontal swipe
                    if (Math.abs(deltaX) > swipeThreshold) {
                        if (deltaX > 0) movePlayer(playerPosition.row, playerPosition.col + 1); // Right
                        else movePlayer(playerPosition.row, playerPosition.col - 1); // Left
                    }
                } else { // Vertical swipe
                    if (Math.abs(deltaY) > swipeThreshold) {
                        if (deltaY > 0) movePlayer(playerPosition.row + 1, playerPosition.col); // Down
                        else movePlayer(playerPosition.row - 1, playerPosition.col); // Up
                    }
                }
            }

            // --- Button Event Listeners ---
            restartLevelBtn.addEventListener('click', () => { gameFeedback.style.color = '#d35400'; loadLevel(currentLevelIndex); });
            nextLevelBtn.addEventListener('click', () => { currentLevelIndex++; gameFeedback.style.color = '#d35400'; loadLevel(currentLevelIndex); });
            
            // --- Start Game ---
            loadLevel(currentLevelIndex);
        });
    </script>
</body>
</html>
