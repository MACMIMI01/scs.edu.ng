<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obstacle Course Challenge</title>
    <link rel="stylesheet" href="../../global.css">
    <link rel="stylesheet" href="obstacle.css">
    <style>
        .nav {
    width: 80%;
    background: #348;
    color: #fff;
}

.nav .top {
    height: 60px;
    width: 80%;
    padding: 0 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.nav .top .menu-btn {
    outline: none;
    border: none;
    background: none;
    padding: 3px 5px;
    border: 1px solid #fff;
    border-radius: 3px;
    color: #fff;
    cursor: pointer;
}

.nav .list {
    display: none;
    transition: all .4s;
}

.nav .list li a {
    display: block;
    width: 80%;
    padding: 6px 15px;
    color: #fff;
    text-decoration: none;
    font-size: 10px;
    transition: all .4s;
}

.nav ul li a:hover {
    background: rgb(255, 255, 255, .2);
}
    </style>
</head>
<body>

    <header>
        <h1 class="main-title">PHE Learning Games</h1>
        
        <nav class="nav">
    <div class="top">
        <h2>Title</h2>
        <button class="menu-btn" onclick="openMenu(this)">Menu</button>
    </div>
    <ul class="list">
        <li><a href="../anatomy-sim/anatomy.html" class="nav-link">Anatomy Simulation</a></li>
        <li><a href="../maze/maze.html" class="nav-link">Healthy Food Maze</a></li>
        <li><a href="../traffic-light/traffic.html" class="nav-link">Traffic Light Game</a></li>
        <li><a href="../../index.html" class="nav-link">Home</a></li>
    </ul>
</nav>

<!-- Javascript code -->

<script>
    function openMenu(e) {
        var menuList = document.querySelector(".nav .list");
        if (e.innerHTML == "Menu") {
            e.innerHTML = "Close";
            menuList.style.display = "block";
        } else {
            e.innerHTML = "Menu";
            menuList.style.display = "none";
        }
    }
</script>
    </header>

    <main id="game-container" class="game-container">
        <h2 id="level-title" class="game-title"></h2>
        <p id="level-info" class="game-info"></p>

        <div class="obstacle-display">
            <div class="player-character" id="player-character">🏃</div>
            <div id="current-obstacle-challenge" class="current-obstacle-challenge">
                Perform Action!
            </div>
            <div id="obstacle-feedback" class="obstacle-feedback"></div>
        </div>

        <div class="keypad-container">
            <h3>Choose Your Action:</h3>
            <div class="keypad">
                <button class="keypad-button" data-action="jump_horizontal_left" data-key="1">1. Jump Left</button>
                <button class="keypad-button" data-action="jump_vertical" data-key="2">2. Jump Up</button>
                <button class="keypad-button" data-action="jump_horizontal_right" data-key="3">3. Jump Right</button>

                <button class="keypad-button" data-action="move_left" data-key="4">4. Move Left</button>
                <button class="keypad-button" data-action="interact_hint" data-key="5">5. Interact / Hint</button>
                <button class="keypad-button" data-action="move_right" data-key="6">6. Move Right</button>

                <button class="keypad-button" data-action="roll_left" data-key="7">7. Roll Left</button>
                <button class="keypad-button" data-action="squat_lay_down" data-key="8">8. Squat / Lay Down</button>
                <button class="keypad-button" data-action="roll_right" data-key="9">9. Roll Right</button>
            </div>
        </div>

        <div class="controls">
            <button id="restart-level-btn" class="game-button">Restart Level</button>
            <button id="next-level-btn" class="game-button" style="display: none;">Next Level</button>
        </div>
        
        <p id="game-status" class="game-status"></p>
        <p id="score-display" class="score-display">Obstacles Cleared: 0 / 0</p>
    </main>

    <footer class="game-footer">
        &copy; 2025 PHE Learning. All rights reserved.
    </footer>

    <script src="obstacle.js"></script>
</body>
</html>
