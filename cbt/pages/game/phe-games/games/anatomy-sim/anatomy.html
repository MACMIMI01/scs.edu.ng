<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Human Anatomy Simulation</title>
    <link rel="stylesheet" href="anatomy.css">
</head>
<body>
    <div id="game-container">
        <h1>Human Anatomy Explorer</h1>
        <h3>        
        <a href="../../../../gamehall.html" class="nav-link">Game Hall</a>
        </h3>

        <div class="search-section">
            <input type="text" id="bone-search-input" placeholder="Search for a bone (e.g., Femur, Skull, Rib)">
            <ul id="search-results">
                </ul>
        </div>

        <div class="anatomy-content">
            <div class="skeleton-display">
                <img src="../../assets/images/human_skeleton.png" alt="Human Skeleton" id="human-skeleton-img">
                <div id="bone-hotspots-container">
                    </div>
            </div>
            <div class="info-panel">
                <h2>Bone Information</h2>
                <p id="feedback-message">Loading bone data...</p>
                <div id="bone-details">
                    <p><strong>Name:</strong> <span id="bone-name">N/A</span></p>
                    <p><strong>Common Name:</strong> <span id="bone-common-name">N/A</span></p>
                    <p><strong>Region:</strong> <span id="bone-region">N/A</span></p>
                    <p><strong>Description:</strong> <span id="bone-description">N/A</span></p>
                </div>
            </div>
        </div>
    </div>

    <script src="anatomy.js"></script>
</body>
</html>
