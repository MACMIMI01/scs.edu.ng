<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Pete's Adventure</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        /* CSS remains identical to the previous version */
        :root {
            --bg-color: #5c94fc; /* Sky Blue */
            --font-color: #FFF;
        }
        body {
            background-color: #0d1b2a;
            color: var(--font-color);
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            overflow: hidden;
        }
        #game-wrapper {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            position: relative;
            background-color: var(--bg-color);
            border: 3px solid white;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        canvas {
            display: block;
            width: 100%; height: 100%;
            image-rendering: pixelated;
        }
        #game-hud {
            position: absolute;
            top: 10px; left: 10px; right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            text-shadow: 2px 2px #000;
        }
        .overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; font-size: 2em;
            cursor: pointer; z-index: 100;
        }
        .overlay p { font-size: 0.5em; margin-top: 20px; line-height: 1.5; }
        .hidden { display: none; }
        
        #mobile-controls {
            display: none;
            width: 100%; max-width: 800px;
            margin-top: 15px;
            justify-content: space-between; align-items: center;
            padding: 0 20px;
        }
        .move-buttons, .action-buttons {
            display: flex;
            gap: 20px;
        }
        .control-btn {
            width: 60px; height: 60px; font-size: 2em;
            background-color: rgba(255,255,255,0.3); color: white;
            border: 2px solid white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            -webkit-user-select: none; user-select: none;
        }
        .control-btn:active { background-color: rgba(255,255,255,0.5); }

        @media (hover: none) and (pointer: coarse) {
            #mobile-controls { display: flex; }
        }
    </style>
</head>
<body>
    <!-- HTML structure remains identical -->
    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="game-hud">
            <div id="score">COINS: 0</div>
            <div id="lives">LIVES: ❤️❤️❤️</div>
        </div>
        <div id="start-overlay" class="overlay">
            <div>PIXEL PETE</div>
            <p>Use [A][D] or Arrows to Move<br>[SPACE] to Jump (and Double-Jump!)<br><br>Click to Start</p>
        </div>
    </div>
    <div id="mobile-controls">
        <div class="move-buttons">
            <button id="left-btn" class="control-btn" data-action="moveLeft">◀</button>
            <button id="right-btn" class="control-btn" data-action="moveRight">▶</button>
        </div>
        <div class="action-buttons">
            <button id="jump-btn" class="control-btn" data-action="jump">▲</button>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- DOM Elements & Game Constants ---
    // (This section is unchanged)
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const startOverlay = document.getElementById('start-overlay');
    const TILE_SIZE = 40;
    canvas.width = 800;
    canvas.height = 450;
    const GRAVITY = 0.5, JUMP_STRENGTH = -12, MAX_SPEED_X = 5, MAX_SPEED_Y = 15, ACCELERATION = 0.5, FRICTION = 0.85;
    const initialLevelLayout = [ "                                ", "                                ", "                                ", "            C C C               ", "           GGGGGG               ", "                                ", "    C C                   C C   ", "   GGGGG      S S        GGGGG  ", "              GGG               ", "GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG", "GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG", ];
    let levelGrid = [];
    const tileMap = { 'G': { color: '#6a4d3a', solid: true }, 'C': { color: '#f1c40f', collectible: true }, 'S': { color: '#e74c3c', deadly: true } };
    
    // --- Game State ---
    let score, lives, gameActive;
    const camera = { x: 0, y: 0 };
    const player = { x: 100, y: 100, width: TILE_SIZE * 0.8, height: TILE_SIZE * 0.9, dx: 0, dy: 0, onGround: false, canDoubleJump: false, color: '#e67e22' };

    // --- NEW: Input Manager ---
    const input = {
        keys: new Set(),      // For keyboard keys currently held down
        touches: new Set(),   // For touch actions currently active
        
        // Check if an action is currently active from any source
        isActionActive(action) {
            return this.keys.has(action) || this.touches.has(action);
        },
        // Keyboard handlers
        handleKeyDown(e) { this.keys.add(this.keyToAction(e.key)); },
        handleKeyUp(e) { this.keys.delete(this.keyToAction(e.key)); },
        keyToAction(key) {
            if (['ArrowLeft', 'a'].includes(key.toLowerCase())) return 'moveLeft';
            if (['ArrowRight', 'd'].includes(key.toLowerCase())) return 'moveRight';
            if ([' ', 'ArrowUp', 'w'].includes(key.toLowerCase())) return 'jump';
            return null;
        },
        // Touch handlers
        handleTouch(e) {
            e.preventDefault();
            this.touches.clear(); // Clear all previous touches
            for (let i = 0; i < e.touches.length; i++) {
                const touch = e.touches[i];
                const element = document.elementFromPoint(touch.clientX, touch.clientY);
                if (element && element.dataset.action) {
                    this.touches.add(element.dataset.action);
                }
            }
        }
    };

    // --- Game Initialization ---
    function init() { /* ... unchanged ... */ 
        score = 0; lives = 3; gameActive = true;
        player.x = 100; player.y = 100; player.dx = 0; player.dy = 0;
        levelGrid = initialLevelLayout.map(row => row.split(''));
        updateHUD(); startOverlay.classList.add('hidden');
        if (!animationFrameId) gameLoop();
    }

    // --- Game Loop ---
    let animationFrameId = null;
    function gameLoop() {
        update();
        draw();
        animationFrameId = requestAnimationFrame(gameLoop);
    }

    // --- Update Function (MODIFIED) ---
    function update() {
        if (!gameActive) return;

        // --- MOVEMENT LOGIC NOW USES THE INPUT MANAGER ---
        if (input.isActionActive('moveLeft')) player.dx -= ACCELERATION;
        else if (input.isActionActive('moveRight')) player.dx += ACCELERATION;
        
        // Handle jump logic separately to prevent continuous jumping
        if (input.isActionActive('jump')) {
            handleJump();
        } else {
            // Reset jump state when button is released
            justJumped = false;
        }
        
        // Physics (unchanged)
        player.dy += GRAVITY;
        player.dx *= FRICTION;
        if (Math.abs(player.dx) < 0.1) player.dx = 0;
        if (player.dx > MAX_SPEED_X) player.dx = MAX_SPEED_X;
        if (player.dx < -MAX_SPEED_X) player.dx = -MAX_SPEED_X;
        if (player.dy > MAX_SPEED_Y) player.dy = MAX_SPEED_Y;

        handleCollisions();
        player.x += player.dx;
        player.y += player.dy;

        // Camera (unchanged)
        camera.x = player.x - canvas.width / 3;
        if (camera.x < 0) camera.x = 0;
        const levelWidth = initialLevelLayout[0].length * TILE_SIZE;
        if (camera.x > levelWidth - canvas.width) camera.x = levelWidth - canvas.width;
    }
    
    // --- Collision, Drawing, and other functions remain unchanged ---
    function handleCollisions() { /* ... unchanged ... */
        player.onGround = false;
        const h_px = player.x + player.dx, h_sy = Math.floor(player.y / TILE_SIZE), h_ey = Math.floor((player.y + player.height) / TILE_SIZE);
        if (player.dx > 0) { const h_tx = Math.floor((h_px + player.width) / TILE_SIZE); for (let y = h_sy; y <= h_ey; y++) { if (tileMap[levelGrid[y]?.[h_tx]]?.solid) { player.x = h_tx * TILE_SIZE - player.width; player.dx = 0; break; } } }
        if (player.dx < 0) { const h_tx = Math.floor(h_px / TILE_SIZE); for (let y = h_sy; y <= h_ey; y++) { if (tileMap[levelGrid[y]?.[h_tx]]?.solid) { player.x = (h_tx + 1) * TILE_SIZE; player.dx = 0; break; } } }
        const v_py = player.y + player.dy, v_sx = Math.floor(player.x / TILE_SIZE), v_ex = Math.floor((player.x + player.width) / TILE_SIZE);
        if (player.dy > 0) { const v_ty = Math.floor((v_py + player.height) / TILE_SIZE); for (let x = v_sx; x <= v_ex; x++) { if (tileMap[levelGrid[v_ty]?.[x]]?.solid) { player.y = v_ty * TILE_SIZE - player.height; player.dy = 0; player.onGround = true; player.canDoubleJump = true; break; } } }
        if (player.dy < 0) { const v_ty = Math.floor(v_py / TILE_SIZE); for (let x = v_sx; x <= v_ex; x++) { if (tileMap[levelGrid[v_ty]?.[x]]?.solid) { player.y = (v_ty + 1) * TILE_SIZE; player.dy = 0; break; } } }
        const midX = Math.floor((player.x + player.width / 2) / TILE_SIZE), midY = Math.floor((player.y + player.height / 2) / TILE_SIZE);
        const tile = tileMap[levelGrid[midY]?.[midX]];
        if (tile) { if (tile.collectible) { score += 10; updateHUD(); levelGrid[midY][midX] = ' '; } if (tile.deadly) loseLife(); }
    }
    function draw() { /* ... unchanged ... */
        ctx.fillStyle = '#5c94fc'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.save(); ctx.translate(-camera.x, -camera.y);
        for (let r = 0; r < levelGrid.length; r++) { for (let c = 0; c < levelGrid[r].length; c++) { const tile = tileMap[levelGrid[r][c]]; if (tile) { ctx.fillStyle = tile.color; ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE); } } }
        ctx.fillStyle = player.color; ctx.fillRect(player.x, player.y, player.width, player.height); ctx.restore();
    }
    
    let justJumped = false;
    function handleJump() {
        if (justJumped) return;
        if (player.onGround) {
            player.dy = JUMP_STRENGTH;
            player.onGround = false;
            justJumped = true;
        } else if (player.canDoubleJump) {
            player.dy = JUMP_STRENGTH * 0.8;
            player.canDoubleJump = false;
            justJumped = true;
        }
    }

    function loseLife() { /* ... unchanged ... */ lives--; updateHUD(); if (lives <= 0) gameOver("GAME OVER"); else { player.x = 100; player.y = 100; player.dx = 0; player.dy = 0; } }
    function gameOver(message) { /* ... unchanged ... */ gameActive = false; cancelAnimationFrame(animationFrameId); animationFrameId = null; startOverlay.classList.remove('hidden'); startOverlay.querySelector('div').textContent = message; startOverlay.querySelector('p').innerHTML = `Final Score: ${score}<br><br>Click to Play Again`; }
    function updateHUD() { /* ... unchanged ... */ scoreEl.textContent = `COINS: ${score}`; livesEl.textContent = `LIVES: ${'❤️'.repeat(lives)}`; }

    // --- Event Listeners (MODIFIED) ---
    window.addEventListener('keydown', e => input.handleKeyDown(e));
    window.addEventListener('keyup', e => input.handleKeyUp(e));
    
    // Add touch listeners to the entire controls container
    const controlsContainer = document.getElementById('mobile-controls');
    controlsContainer.addEventListener('touchstart', e => input.handleTouch(e));
    controlsContainer.addEventListener('touchmove', e => input.handleTouch(e));
    controlsContainer.addEventListener('touchend', e => input.touches.clear());
    
    startOverlay.addEventListener('click', init);
});
</script>
</body>
</html>
