<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Pete's Adventure</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #5c94fc; /* Sky Blue */
            --font-color: #FFF;
        }
        body {
            background-color: #0d1b2a;
            color: var(--font-color);
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            overflow: hidden;
        }
        #game-wrapper {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            position: relative;
            background-color: var(--bg-color);
            border: 3px solid white;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        canvas {
            display: block;
            width: 100%; height: 100%;
            image-rendering: pixelated;
        }
        #game-hud {
            position: absolute;
            top: 10px; left: 10px; right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            text-shadow: 2px 2px #000;
        }
        .overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; font-size: 2em;
            cursor: pointer; z-index: 100;
        }
        .overlay p { font-size: 0.5em; margin-top: 20px; line-height: 1.5; }
        .hidden { display: none; }
        
        #mobile-controls {
            display: none;
            width: 100%; max-width: 800px;
            margin-top: 15px;
            justify-content: space-between; align-items: center;
            padding: 0 20px;
        }
        .move-buttons, .action-buttons {
            display: flex;
            gap: 20px;
        }
        .control-btn {
            width: 60px; height: 60px; font-size: 2em;
            background-color: rgba(255,255,255,0.3); color: white;
            border: 2px solid white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            -webkit-user-select: none; user-select: none;
        }
        .control-btn:active { background-color: rgba(255,255,255,0.5); }

        @media (hover: none) and (pointer: coarse) {
            #mobile-controls { display: flex; }
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="game-hud">
            <div id="score">COINS: 0</div>
            <div id="lives">LIVES: ❤️❤️❤️</div>
        </div>
        <div id="start-overlay" class="overlay">
            <div>PIXEL PETE</div>
            <p>Use [A][D] or Arrows to Move<br>[SPACE] to Jump (and Double-Jump!)<br><br>Click to Start</p>
        </div>
    </div>
    <div id="mobile-controls">
        <div class="move-buttons">
            <button id="left-btn" class="control-btn">◀</button>
            <button id="right-btn" class="control-btn">▶</button>
        </div>
        <div class="action-buttons">
            <button id="jump-btn" class="control-btn">▲</button>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- DOM Elements ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const startOverlay = document.getElementById('start-overlay');
    const leftBtn = document.getElementById('left-btn'), rightBtn = document.getElementById('right-btn'), jumpBtn = document.getElementById('jump-btn');

    // --- Game Constants & Sizing ---
    const TILE_SIZE = 40;
    canvas.width = 800;
    canvas.height = 450;
    
    // --- Physics Constants ---
    const GRAVITY = 0.5;
    const JUMP_STRENGTH = -12;
    const MAX_SPEED_X = 5;
    const MAX_SPEED_Y = 15;
    const ACCELERATION = 0.5;
    const FRICTION = 0.85;

    // --- Level Data ---
    const initialLevelLayout = [
        "                                ",
        "                                ",
        "                                ",
        "            C C C               ",
        "           GGGGGG               ",
        "                                ",
        "    C C                   C C   ",
        "   GGGGG      S S        GGGGG  ",
        "              GGG               ",
        "GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG",
        "GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG",
    ];
    let levelGrid = []; // This will hold the mutable grid

    const tileMap = {
        'G': { color: '#6a4d3a', solid: true }, // Ground
        'C': { color: '#f1c40f', solid: false, collectible: true }, // Coin
        'S': { color: '#e74c3c', solid: false, deadly: true } // Spike
    };

    // --- Game State ---
    let score, lives, gameActive;
    const keys = {};
    const camera = { x: 0, y: 0 };

    const player = {
        x: 100, y: 100,
        width: TILE_SIZE * 0.8, height: TILE_SIZE * 0.9,
        dx: 0, dy: 0,
        onGround: false,
        canDoubleJump: false, // NEW: Double-jump state
        color: '#e67e22'
    };

    // --- Game Initialization ---
    function init() {
        score = 0;
        lives = 3;
        gameActive = true;
        
        player.x = 100; player.y = 100;
        player.dx = 0; player.dy = 0;
        
        // NEW: Create a mutable copy of the level layout
        levelGrid = initialLevelLayout.map(row => row.split(''));
        
        updateHUD();
        startOverlay.classList.add('hidden');
        gameLoop();
    }

    // --- Game Loop ---
    let lastTime = 0;
    function gameLoop(time = 0) {
        if (!gameActive) return;
        
        const deltaTime = time - lastTime;
        lastTime = time;

        update(deltaTime);
        draw();
        requestAnimationFrame(gameLoop);
    }

    // --- Update Function ---
    function update(deltaTime) {
        // Horizontal Movement
        if (keys.ArrowLeft || keys.a) player.dx -= ACCELERATION;
        else if (keys.ArrowRight || keys.d) player.dx += ACCELERATION;
        
        // Apply physics
        player.dy += GRAVITY;
        player.dx *= FRICTION;

        // Clamp velocities
        if (Math.abs(player.dx) < 0.1) player.dx = 0;
        if (player.dx > MAX_SPEED_X) player.dx = MAX_SPEED_X;
        if (player.dx < -MAX_SPEED_X) player.dx = -MAX_SPEED_X;
        if (player.dy > MAX_SPEED_Y) player.dy = MAX_SPEED_Y;

        // Collision detection
        handleCollisions();
        
        // Update position
        player.x += player.dx;
        player.y += player.dy;

        // Update camera to follow player
        camera.x = player.x - canvas.width / 3;
        if (camera.x < 0) camera.x = 0;
        const levelWidth = initialLevelLayout[0].length * TILE_SIZE;
        if (camera.x > levelWidth - canvas.width) camera.x = levelWidth - canvas.width;
    }
    
    // --- Collision Detection ---
    function handleCollisions() {
        // Reset ground state before checking
        player.onGround = false;

        // --- Horizontal collision detection ---
        const horizontalProposedX = player.x + player.dx;
        const h_startTileY = Math.floor(player.y / TILE_SIZE);
        const h_endTileY = Math.floor((player.y + player.height) / TILE_SIZE);
        
        // Check right collision
        if (player.dx > 0) {
            const h_tileX = Math.floor((horizontalProposedX + player.width) / TILE_SIZE);
            for (let y = h_startTileY; y <= h_endTileY; y++) {
                const tileChar = levelGrid[y]?.[h_tileX];
                if (tileMap[tileChar]?.solid) {
                    player.x = h_tileX * TILE_SIZE - player.width;
                    player.dx = 0;
                    break;
                }
            }
        }
        // Check left collision
        if (player.dx < 0) {
            const h_tileX = Math.floor(horizontalProposedX / TILE_SIZE);
            for (let y = h_startTileY; y <= h_endTileY; y++) {
                const tileChar = levelGrid[y]?.[h_tileX];
                if (tileMap[tileChar]?.solid) {
                    player.x = (h_tileX + 1) * TILE_SIZE;
                    player.dx = 0;
                    break;
                }
            }
        }

        // --- Vertical collision detection ---
        const verticalProposedY = player.y + player.dy;
        const v_startTileX = Math.floor(player.x / TILE_SIZE);
        const v_endTileX = Math.floor((player.x + player.width) / TILE_SIZE);

        // Check down collision
        if (player.dy > 0) {
            const v_tileY = Math.floor((verticalProposedY + player.height) / TILE_SIZE);
            for (let x = v_startTileX; x <= v_endTileX; x++) {
                const tileChar = levelGrid[v_tileY]?.[x];
                if (tileMap[tileChar]?.solid) {
                    player.y = v_tileY * TILE_SIZE - player.height;
                    player.dy = 0;
                    player.onGround = true;
                    player.canDoubleJump = true; // Reset double jump on landing
                    break;
                }
            }
        }
        // Check up collision
        if (player.dy < 0) {
            const v_tileY = Math.floor(verticalProposedY / TILE_SIZE);
            for (let x = v_startTileX; x <= v_endTileX; x++) {
                const tileChar = levelGrid[v_tileY]?.[x];
                if (tileMap[tileChar]?.solid) {
                    player.y = (v_tileY + 1) * TILE_SIZE;
                    player.dy = 0;
                    break;
                }
            }
        }

        // --- Collectibles and Hazards Collision ---
        const midX = Math.floor((player.x + player.width / 2) / TILE_SIZE);
        const midY = Math.floor((player.y + player.height / 2) / TILE_SIZE);
        const tileChar = levelGrid[midY]?.[midX];
        const tile = tileMap[tileChar];
        if(tile) {
            if(tile.collectible) {
                score += 10;
                updateHUD();
                levelGrid[midY][midX] = ' '; // Remove coin from the grid
            }
            if(tile.deadly) loseLife();
        }
    }

    // --- Drawing ---
    function draw() {
        ctx.fillStyle = '#5c94fc';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(-camera.x, -camera.y);

        // Draw level tiles
        for (let r = 0; r < levelGrid.length; r++) {
            for (let c = 0; c < levelGrid[r].length; c++) {
                const tileChar = levelGrid[r][c];
                const tile = tileMap[tileChar];
                if (tile) {
                    ctx.fillStyle = tile.color;
                    ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                }
            }
        }
        // Draw Player
        ctx.fillStyle = player.color;
        ctx.fillRect(player.x, player.y, player.width, player.height);
        ctx.restore();
    }
    
    // --- Jumping Logic ---
    function handleJump() {
        if (player.onGround) {
            player.dy = JUMP_STRENGTH;
            player.onGround = false;
        } else if (player.canDoubleJump) {
            player.dy = JUMP_STRENGTH * 0.8; // Make double jump slightly weaker
            player.canDoubleJump = false;
        }
    }

    // --- Game State & HUD ---
    function loseLife() {
        lives--; updateHUD();
        if (lives <= 0) gameOver("GAME OVER");
        else { player.x = 100; player.y = 100; player.dx = 0; player.dy = 0; }
    }
    function gameOver(message) {
        gameActive = false;
        startOverlay.classList.remove('hidden');
        startOverlay.querySelector('div').textContent = message;
        startOverlay.querySelector('p').innerHTML = `Final Score: ${score}<br><br>Click to Play Again`;
    }
    function updateHUD() {
        scoreEl.textContent = `COINS: ${score}`;
        livesEl.textContent = `LIVES: ${'❤️'.repeat(lives)}`;
    }

    // --- Event Listeners ---
    let justJumped = false; // Prevents holding down jump key
    window.addEventListener('keydown', e => {
        if (e.key === ' ' || e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') {
            if (!justJumped) handleJump();
            justJumped = true;
        }
        keys[e.key] = true;
    });
    window.addEventListener('keyup', e => {
        if (e.key === ' ' || e.key === 'ArrowUp' || e.key.toLowerCase() === 'w') {
            justJumped = false;
        }
        keys[e.key] = false;
    });
    
    leftBtn.addEventListener('touchstart', e => { e.preventDefault(); keys.ArrowLeft = true; });
    leftBtn.addEventListener('touchend', e => { e.preventDefault(); keys.ArrowLeft = false; });
    rightBtn.addEventListener('touchstart', e => { e.preventDefault(); keys.ArrowRight = true; });
    rightBtn.addEventListener('touchend', e => { e.preventDefault(); keys.ArrowRight = false; });
    jumpBtn.addEventListener('click', handleJump);

    startOverlay.addEventListener('click', init, { once: true });
});
</script>
</body>
</html>
