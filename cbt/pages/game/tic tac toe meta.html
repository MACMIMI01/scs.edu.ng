<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tic-Tac-Toe AI!</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #282c34;
      color: #ffffff;
      font-family: 'Arial', sans-serif;
    }

    #game-area {
      text-align: center;
      background-color: #3a404b;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      margin-bottom: 20px;
    }

    h1 {
      color: #61dafb;
      margin-bottom: 20px;
    }

    canvas {
      background-color: #1a1a1a;
      border: 2px solid #61dafb;
      display: block;
      margin: 0 auto 20px auto;
      cursor: pointer; /* Indicate clickable area */
    }

    #game-status {
      font-size: 1.2em;
      margin-bottom: 10px;
      color: #a0a8b4;
    }

    #current-player-display {
      font-size: 1.5em;
      font-weight: bold;
      color: #ffd700;
      margin-bottom: 20px;
    }

    #reset-btn {
      background-color: #f44336;
      border: none;
      color: white;
      padding: 10px 20px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      margin-top: 20px;
      cursor: pointer;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }

    #reset-btn:hover {
      background-color: #da190b;
    }

    #grid-size-select {
      padding: 10px;
      font-size: 16px;
      margin-bottom: 20px;
    }

    #start-btn {
      background-color: #4CAF50;
      border: none;
      color: white;
      padding: 10px 20px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 16px;
      cursor: pointer;
      border-radius: 8px;
      transition: background-color 0.3s ease;
    }

    #start-btn:hover {
      background-color: #3e8e41;
    }
  </style>
</head>
<body>
  <select id="grid-size-select">
    <option value="3">3x3</option>
    <option value="4">4x4</option>
    <option value="5">5x5</option>
    <option value="6">6x6</option>
  </select>
  <button id="start-btn">Start Game</button>

  <div id="game-area" style="display: none;">
    <h1>Tic-Tac-Toe AI!</h1>
    <p id="current-player-display">Player X's Turn</p>
    <canvas id="ticTacToeCanvas"></canvas>
    <p id="game-status">Click a square to play!</p>

    <button id="reset-btn">New Game</button>
  </div>

  <script>
    // Get elements
    const gridSizeSelect = document.getElementById('grid-size-select');
    const startBtn = document.getElementById('start-btn');
    const gameArea = document.getElementById('game-area');
    const canvas = document.getElementById('ticTacToeCanvas');
    const ctx = canvas.getContext('2d');
    const statusDisplay = document.getElementById('game-status');
    const currentPlayerDisplay = document.getElementById('current-player-display');
    const resetBtn = document.getElementById('reset-btn');

    let BOARD_SIZE;
    let CELL_SIZE;
    let board = [];
    let currentPlayer = 'X';
    let gameActive = true;
    let movesMade = 0;

    const HUMAN_PLAYER = 'X';
    const COMPUTER_PLAYER = 'O';

    function startGame() {
      BOARD_SIZE = parseInt(gridSizeSelect.value);
      canvas.width = BOARD_SIZE * 60;
      canvas.height = BOARD_SIZE * 60;
      CELL_SIZE = canvas.width / BOARD_SIZE;

      gameArea.style.display = 'block';
      gridSizeSelect.style.display = 'none';
      startBtn.style.display = 'none';

      initGame();
    }

    function initGame() {
      board = Array(BOARD_SIZE).fill(0).map(() => Array(BOARD_SIZE).fill(''));
      currentPlayer = HUMAN_PLAYER;
      gameActive = true;
      movesMade = 0;

      statusDisplay.textContent = "Click a square to play!";
      currentPlayerDisplay.textContent = `Player ${currentPlayer}'s Turn`;
      drawGame();
    }

    function drawGame() {
      clearCanvas();
      drawBoardLines();
      drawMarks();
    }

    function clearCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function drawBoardLines() {
      ctx.strokeStyle = '#61dafb';
      ctx.lineWidth = 4;

      for (let i = 1; i < BOARD_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL_SIZE, 0);
        ctx.lineTo(i * CELL_SIZE, canvas.height);
        ctx.stroke();
      }

      for (let i = 1; i < BOARD_SIZE; i++) {
        ctx.beginPath();
        ctx.moveTo(0, i * CELL_SIZE);
        ctx.lineTo(canvas.width, i * CELL_SIZE);
        ctx.stroke();
      }
    }

    function drawMarks() {
      ctx.font = `${CELL_SIZE * 0.7}px Arial`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let row = 0; row < BOARD_SIZE; row++) {
        for (let col = 0; col < BOARD_SIZE; col++) {
          const cellValue = board[row][col];
          const centerX = col * CELL_SIZE + CELL_SIZE / 2;
          const centerY = row * CELL_SIZE + CELL_SIZE / 2;

          if (cellValue === 'X') {
            ctx.fillStyle = '#f44336';
            ctx.fillText('X', centerX, centerY);
          } else if (cellValue === 'O') {
            ctx.fillStyle = '#4CAF50';
            ctx.fillText('O', centerX, centerY);
          }
        }
      }
    }

    function handlePlayerMove(row, col) {
      if (!gameActive || board[row][col] !== '') {
        return;
      }

      board[row][col] = currentPlayer;
      movesMade++;
      drawGame();

      if (checkWin()) {
        return;
      }

      currentPlayer = (currentPlayer === HUMAN_PLAYER) ? COMPUTER_PLAYER : HUMAN_PLAYER;
      currentPlayerDisplay.textContent = `Player ${currentPlayer}'s Turn`;

      if (gameActive && currentPlayer === COMPUTER_PLAYER) {
        statusDisplay.textContent = "Computer is thinking...";
        setTimeout(makeComputerMove, 500);
      }
    }

    function makeComputerMove() {
      if (!gameActive) return;

      let bestMove = findBestMove();

      if (bestMove) {
        handlePlayerMove(bestMove.row, bestMove.col);
      } else {
        console.error("AI couldn't find a move!");
      }
    }

    function findBestMove() {
      const emptyCells = [];
      for (let r = 0; r < BOARD_SIZE; r++) {
        for (let c = 0; c < BOARD_SIZE; c++) {
          if (board[r][c] === '') {
            emptyCells.push({ row: r, col: c });
          }
        }
      }

      for (let i = 0; i < emptyCells.length; i++) {
        const { row, col } = emptyCells[i];
        board[row][col] = COMPUTER_PLAYER;
        if (checkWinHelper(board, COMPUTER_PLAYER)) {
          board[row][col] = '';
          return { row, col };
        }
        board[row][col] = '';
      }

      for (let i = 0; i < emptyCells.length; i++) {
        const { row, col } = emptyCells[i];
        board[row][col] = HUMAN_PLAYER;
        if (checkWinHelper(board, HUMAN_PLAYER)) {
          board[row][col] = '';
          return { row, col };
        }
        board[row][col] = '';
      }

      if (board[1][1] === '' && BOARD_SIZE === 3) {
        return { row: 1, col: 1 };
      }

      if (emptyCells.length > 0) {
        return emptyCells[Math.floor(Math.random() * emptyCells.length)];
      }

      return null;
    }

    function checkWin() {
      const lines = [];

      for (let i = 0; i < BOARD_SIZE; i++) {
        const row = [];
        for (let j = 0; j < BOARD_SIZE; j++) {
          row.push([i, j]);
        }
        lines.push(row);
      }

      for (let i = 0; i < BOARD_SIZE; i++) {
        const col = [];
        for (let j = 0; j < BOARD_SIZE; j++) {
          col.push([j, i]);
        }
        lines.push(col);
      }

      const diagonal1 = [];
      const diagonal2 = [];
      for (let i = 0; i < BOARD_SIZE; i++) {
        diagonal1.push([i, i]);
        diagonal2.push([i, BOARD_SIZE - i - 1]);
      }
      lines.push(diagonal1);
      lines.push(diagonal2);

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const mark = board[line[0][0]][line[0][1]];
        if (mark && line.every(([row, col]) => board[row][col] === mark)) {
          gameActive = false;
          statusDisplay.textContent = `${mark} wins!`;
          return true;
        }
      }

      if (movesMade === BOARD_SIZE * BOARD_SIZE) {
        gameActive = false;
        statusDisplay.textContent = "It's a draw!";
        return true;
      }

      return false;
    }

    function checkWinHelper(currentBoard, playerMark) {
      const lines = [];

      for (let i = 0; i < BOARD_SIZE; i++) {
        const row = [];
        for (let j = 0; j < BOARD_SIZE; j++) {
          row.push([i, j]);
        }
        lines.push(row);
      }

      for (let i = 0; i < BOARD_SIZE; i++) {
        const col = [];
        for (let j = 0; j < BOARD_SIZE; j++) {
          col.push([j, i]);
        }
        lines.push(col);
      }

      const diagonal1 = [];
      const diagonal2 = [];
      for (let i = 0; i < BOARD_SIZE; i++) {
        diagonal1.push([i, i]);
        diagonal2.push([i, BOARD_SIZE - i - 1]);
      }
      lines.push(diagonal1);
      lines.push(diagonal2);

      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const mark = currentBoard[line[0][0]][line[0][1]];
        if (mark === playerMark && line.every(([row, col]) => currentBoard[row][col] === playerMark)) {
          return true;
        }
      }

      return false;
    }

    canvas.addEventListener('click', (event) => {
      if (!gameActive || currentPlayer !== HUMAN_PLAYER) {
        return;
      }

      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;

      const col = Math.floor(x / CELL_SIZE);
      const row = Math.floor(y / CELL_SIZE);

      handlePlayerMove(row, col);
    });

    resetBtn.addEventListener('click', () => {
      gridSizeSelect.style.display = 'block';
      startBtn.style.display = 'block';
      gameArea.style.display = 'none';
    });

    startBtn.addEventListener('click', startGame);
  </script>
</body>
</html>
