<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">  
  <meta name="theme-color" content="#0003ff"/>      
  <title>Welcome to SCS Test_Hall!</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
      .game-container {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  background-color: #f0f0f0;
}

.glassmorph-card {
  background-color: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(10px);
  border-radius: 10px;
  padding: 20px;
  box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

.difficulty-level, .word-count {
  margin-bottom: 20px;
}

#start-game {
  background-color: #4CAF50;
  color: #fff;
  border: none;
  padding: 10px 20px;
  font-size: 16px;
  cursor: pointer;
}

.game-area {
  display: none;
}

.word-display {
  font-size: 24px;
  margin-bottom: 20px;
}

#answer {
  width: 100px;
  height: 30px;
  font-size: 18px;
}

#submit {
  width: 100px;
  height: 30px;
  font-size: 18px;
  background-color: #4CAF50;
  color: #fff;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.result {
  font-size: 18px;
  margin-top: 20px;
}

.time-display {
  font-size: 18px;
  margin-top: 20px;
}

.result-status {
  font-weight: bold;
}

.correct {
  color: green;
}

.incorrect {
  color: red;
}

.incomplete {
  color: blue;
}
}
  </style>
</head>
<body>
  <div class="game-container">
    <div class="glassmorph-card">
      <h1>Spelling Game</h1>
      <p>Welcome to the spelling game! Select your difficulty level and number of words to spell.</p>
      <div class="difficulty-level">
        <label for="difficulty">Difficulty Level:</label>
        <select id="difficulty">
          <option value="easy">Easy</option>
          <option value="medium">Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>
      <div class="word-count">
        <label for="word-count">Number of Words:</label>
        <select id="word-count">
          <option value="5">5</option>
          <option value="10">10</option>
          <option value="15">15</option>
          <option value="20">20</option>
          <option value="25">25</option>
          <option value="30">30</option>
          <option value="35">35</option>
          <option value="40">40</option>
          <option value="45">45</option>
          <option value="50">50</option>
          <option value="55">55</option>
          <option value="60">60</option>
          <option value="65">65</option>
          <option value="70">70</option>
        </select>
      </div>
      <button id="start-game">Start Game</button>
      <div class="game-area">
        <div class="word-display"></div>
        <input type="text" id="answer" placeholder="Enter your answer">
        <button id="submit">Submit</button>
        <div class="result"></div>
        <div class="time-display"></div>
      </div>
    </div>
  </div>

  <script>
      const wordBank = [
  { word: "box", emoji: "📦" },
  { word: "hat", emoji: "🎩" },
  { word: "dog", emoji: "🐶" },
  { word: "cap", emoji: "🎓" },
  { word: "pen", emoji: "🖊️" },
  { word: "car", emoji: "🚗" },
  { word: "key", emoji: "🔑" },
  { word: "man", emoji: "👨" },
  { word: "bed", emoji: "🛏️" },
  { word: "boy", emoji: "👦" },
  { word: "mug", emoji: "☕️" },
  { word: "mat", emoji: "🏋️" },
  { word: "fan", emoji: "💨" },
  { word: "ink", emoji: "🖋️" },
  { word: "jam", emoji: "🍞" },
  { word: "eye", emoji: "👀" },
  { word: "net", emoji: "🎣" },
  { word: "ten", emoji: "🔟" },
  { word: "cow", emoji: "🐮" },
  { word: "fig", emoji: "🍊" },
  { word: "log", emoji: "🌿" },
  { word: "egg", emoji: "🥚" },
  { word: "gem", emoji: "💎" },
  { word: "pod", emoji: "🌱" },
  { word: "cat", emoji: "🐱" },
  { word: "orb", emoji: "⚽️" },
  { word: "yak", emoji: "🐮" },
  { word: "jar", emoji: "🍯" },
  { word: "jug", emoji: "🥛" },
  { word: "rib", emoji: "🍖️" },
  { word: "ant", emoji: "🐜" },
  { word: "bat", emoji: "🦇" },
  { word: "bee", emoji: "🐝" },
  { word: "eel", emoji: "🐍" },
  { word: "fox", emoji: "🦊" },
  { word: "owl", emoji: "🦉" },
  { word: "rat", emoji: "🐀" },
  { word: "pig", emoji: "🐖" },
  { word: "ram", emoji: "🐑" },
  { word: "hen", emoji: "🐓" },
  { word: "pan", emoji: "🍳" },
  { word: "pot", emoji: "🍲" },
  { word: "lid", emoji: "🔒" },
  { word: "rug", emoji: "🏠" },
  { word: "ice", emoji: "❄️" },
  { word: "tap", emoji: "💧" },
  { word: "zip", emoji: "👖" },
  { word: "wig", emoji: "💇" },
  { word: "bow", emoji: "🏹" },
  { word: "bin", emoji: "🚮" },
  { word: "nut", emoji: "🌰" },
  { word: "pea", emoji: "🌱" },
  { word: "pie", emoji: "🥧" },
  { word: "bun", emoji: "🍞" },
  { word: "jam", emoji: "🍞" },
  { word: "saw", emoji: "🛠️" },
  { word: "axe", emoji: "🪓" },
  { word: "hoe", emoji: "🌱" },
  { word: "cup", emoji: "☕️" },
  { word: "pin", emoji: "📌" },
  { word: "toy", emoji: "🎸" },
  { word: "bus", emoji: "🚌" },
  { word: "van", emoji: "🚚" },
  { word: "map", emoji: "🗺️" },
  { word: "art", emoji: "🎨" },
  { word: "gun", emoji: "🔫" },
  { word: "rat", emoji: "🐀" },
  { word: "cup", emoji: "☕️" },
  { word: "leg", emoji: "🦵" },
  { word: "box", emoji: "📦" }
];

const difficultyLevel = document.getElementById('difficulty');
const wordCount = document.getElementById('word-count');
const startGameButton = document.getElementById('start-game');
const gameArea = document.querySelector('.game-area');
const wordDisplay = document.querySelector('.word-display');
const answerInput = document.getElementById('answer');
const submitButton = document.getElementById('submit');
const resultDisplay = document.querySelector('.result');
const timeDisplay = document.querySelector('.time-display');

let currentWord;
let currentWordIndex = 0;
let score = 0;
let timeLeft;

startGameButton.addEventListener('click', startGame);

function startGame() {
  gameArea.style.display = 'block';
  currentWordIndex = 0;
  score = 0;
  timeLeft = parseInt(wordCount.value) * 10;
  generateWord();
  startTimer();
}

function generateWord() {
  const randomIndex = Math.floor(Math.random() * wordBank.length);
  currentWord = wordBank[randomIndex];
  let displayedWord = currentWord.word;
  const difficulty = difficultyLevel.value;
  const numBlanks = difficulty === 'easy' ? 1 : difficulty === 'medium' ? 2 : currentWord.word.length;
  const indices = getRandomIndices(currentWord.word.length, numBlanks);
  indices.forEach(index => {
    displayedWord = displayedWord.substring(0, index) + '_' + displayedWord.substring(index + 1);
  });
  wordDisplay.textContent = `${currentWord.emoji} ${displayedWord}`;
}

function getRandomIndices(length, numIndices) {
  const indices = [];
  while (indices.length < numIndices) {
    const index = Math.floor(Math.random() * length);
    if (!indices.includes(index)) {
      indices.push(index);
    }
  }
  return indices;
}

submitButton.addEventListener('click', checkAnswer);

function checkAnswer() {
  const userAnswer = answerInput.value.toLowerCase();
  if (userAnswer === currentWord.word) {
    resultDisplay.textContent = 'Correct!';
    resultDisplay.style.color = 'green';
    score++;
  } else {
    resultDisplay.textContent = `Incorrect! The correct answer was ${currentWord.word}.`;
    resultDisplay.style.color = 'red';
  }
  answerInput.value = '';
  currentWordIndex++;
  if (currentWordIndex < parseInt(wordCount.value)) {
    generateWord();
  } else {
    endGame();
  }
}

function startTimer() {
  const timerInterval = setInterval(() => {
    timeLeft--;
    timeDisplay.textContent = `Time left: ${timeLeft} seconds`;
    if (timeLeft === 0) {
      clearInterval(timerInterval);
      endGame();
    }
  }, 1000);
}

function endGame() {
  gameArea.style.display = 'none';
  const scorePercentage = (score / parseInt(wordCount.value)) * 100;
  alert(`Game over! Your score is ${score} out of ${wordCount.value} (${scorePercentage.toFixed(2)}%).`);
}
  </script>
</body>
</html>
