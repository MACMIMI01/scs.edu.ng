    <style>
        /* Add styles for the game container and input field */
.game-container {
    display: none;
    padding: 20px;
    max-width: 800px;
    margin: 0 auto;
    text-align: center;
}

.emoji-container {
    background-color: #f0f0f0;
    padding: 50px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    margin-bottom: 20px;
}

.emoji-display {
    font-size: 100px;
}

.input-container {
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

.input-container input[type="text"] {
    padding: 10px;
    font-size: 18px;
    border: none;
    border-radius: 5px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
}

.correct {
    color: green;
}

.incorrect {
    color: red;
}

.incomplete {
    color: blue;
}
    </style>

            <p>Find the missing letters and spell as many words as you can!</p>
            <select id="word-count-easy">
                <option value="5">5 words</option>
                <option value="10">10 words</option>
                <option value="15">15 words</option>
            </select>
            <button class="play-button" onclick="startGame('easy')">Play Now</button>
        </div>

        <div class="game-card" id="medium-level">

            <p>Test your intellectual knowledge and agility.</p>
            <select id="word-count-medium">

                <option value="10">10 words</option>
                <option value="15">15 words</option>
            </select>
            <button class="play-button" onclick="startGame('medium')">Play Now</button>
        </div>

        <div class="game-card" id="hard-level">
            <div class="icon">😱</div>
            <h3>Hard</h3>
            <p>React quickly by spelling lots of words by identifying the picture!</p>
            <select id="word-count-hard">
                <option value="5">5 words</option>
                <option value="10">10 words</option>
                <option value="15">15 words</option>
            </select>
            <button class="play-button" onclick="startGame('hard')">Play Now</button>
        </div>
    </main>

        </div>
        <div class="input-container">

function startGame(difficulty) {
    currentDifficulty = difficulty;
    wordCount = parseInt(document.getElementById(`word-count-${difficulty}`).value);
    document.querySelector('.games-grid').style.display = 'none';
    document.querySelector('.hero-section').style.display = 'none';
    document.getElementById('game-container').style.display = 'block';
    generateWord(difficulty);
}

function generateWord(difficulty) {
    const randomIndex = Math.floor(Math.random() * wordBank.length);
    currentWord = wordBank[randomIndex];
    let displayedWord = currentWord.word;
    const numBlanks = difficulty === 'easy' ? 1 : difficulty === 'medium' ? 2 : currentWord.word.length;
    const indices = getRandomIndices(currentWord.word.length, numBlanks);
    indices.forEach(index => {
        displayedWord = displayedWord.substring(0, index) + '_' + displayedWord.substring(index + 1);
    });
    document.getElementById('word-display').textContent = currentWord.emoji + '\n' + displayedWord;
}

function getRandomIndices(length, numIndices) {
    const indices = [];
    while (indices.length < numIndices) {
        const index = Math.floor(Math.random() * length);
        if (!indices.includes(index)) {
            indices.push(index);
        }
    }
    return indices;
}

document.getElementById('answer').addEventListener('input', checkAnswer);

function checkAnswer() {
    const userAnswer = document.getElementById('answer').value.toLowerCase();
    const resultElement = document.getElementById('result');
    resultElement.innerHTML = '';
    for (let i = 0; i < userAnswer.length; i++) {
        const span = document.createElement('span');
        if (i >= currentWord.word.length) {
            span.textContent = userAnswer[i];
            span.className = 'incorrect';
        } else if (userAnswer[i] === currentWord.word[i]) {
            span.textContent = userAnswer[i];
            span.className = 'correct';
        } else {
            span.textContent = userAnswer[i];
            span.className = 'incorrect';
        }
        resultElement.appendChild(span);
    }
    if (userAnswer === currentWord.word) {
        score++;
        document.getElementById('score-display').textContent = `Score: ${score}`;
        wordCount--;
        if (wordCount > 0) {
            generateWord(currentDifficulty);
            document.getElementById('answer').value = '';
            document.getElementById('result').innerHTML = '';
        } else {
            endGame();
        }
    }
}

function endGame() {
    alert(`Game over! Your final score is ${score}.`);
