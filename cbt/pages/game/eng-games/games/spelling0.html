<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">  
  <meta name="theme-color" content="         
  <title>Welcome to TestHall!</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.ico">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
     .game-container {
  text-align: center;
  margin-top: 20px;
}

.word-display {
  font-size: 24px;
  margin-bottom: 20px;
}

#answer {
  width: 100px;
  height: 30px;
  font-size: 18px;
}

#submit {
  width: 100px;
  height: 30px;
  font-size: 18px;
  background-color: #4CAF50;
  color: #fff;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}

.result {
  font-size: 18px;
  margin-top: 20px;
}
 
  </style>
</head>
<body>
  <div class="game-container">
    <h1>Spelling Game</h1>
    <div class="word-display"></div>
    <input type="text" id="answer" placeholder="Enter your answer">
    <button id="submit">Submit</button>
    <div class="result"></div>
  </div>

  <script>
      const wordDisplay = document.querySelector('.word-display');
const answerInput = document.getElementById('answer');
const submitButton = document.getElementById('submit');
const resultDisplay = document.querySelector('.result');

const wordBank = [
  "box",
  "hat",
  "dog",
  "cap",
  "pen",
  "car",
  "key",
  "man",
  "bed",
  "boy",
  "mug",
  "mat",
  "fan",
  "ink",
  "jam",
  "eye",
  "net",
  "ten",
  "cow",
  "fig",
  "log",
  "egg",
  "gem",
  "pod",
  "cat",
  "orb",
  "yak",
  "jar",
  "jug",
  "rib",
  "ant",
  "bat",
  "bee",
  "eel",
  "fox",
  "owl",
  "rat",
  "pig",
  "ram",
  "hen",
  "pan",
  "pot",
  "lid",
  "rug",
  "ice",
  "tap",
  "zip",
  "wig",
  "bow",
  "bin",
  "nut",
  "pea",
  "pie",
  "bun",
  "jam",
  "saw",
  "axe",
  "hoe",
  "cup",
  "pin",
  "toy",
  "bus",
  "van",
  "map",
  "art",
  "gun",
  "rat",
  "cup",
  "leg",
  "box"
]
; // load word bank from JSON file

let currentWord;
let difficulty;

function generateWord() {
  // select a random word from the word bank
  currentWord = wordBank[Math.floor(Math.random() * wordBank.length)];
  
  // determine difficulty level (easy, medium, hard)
  difficulty = Math.random() < 0.33 ? 'easy' : Math.random() < 0.66 ? 'medium' : 'hard';
  
  // display word with missing letters
  let displayedWord = '';
  if (difficulty === 'easy') {
    displayedWord = currentWord.replace(currentWord[Math.floor(Math.random() * 3)], '_');
  } else if (difficulty === 'medium') {
    const indices = [];
    while (indices.length < 2) {
      const index = Math.floor(Math.random() * 3);
      if (!indices.includes(index)) {
        indices.push(index);
      }
    }
    displayedWord = currentWord.replace(currentWord[indices[0]], '_').replace(currentWord[indices[1]], '_');
  } else {
    displayedWord = '___';
  }
  wordDisplay.textContent = displayedWord;
}

function checkAnswer() {
  const userAnswer = answerInput.value.toLowerCase();
  if (userAnswer === currentWord) {
    resultDisplay.textContent = 'Correct!';
  } else {
    resultDisplay.textContent = `Sorry, the correct answer was ${currentWord}.`;
  }
  generateWord();
  answerInput.value = '';
}

submitButton.addEventListener('click', checkAnswer);

generateWord();
  </script>
</body>
</html>
