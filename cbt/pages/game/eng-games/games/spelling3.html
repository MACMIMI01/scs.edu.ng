<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spelling Game</title>
    <style>
        /* Styles for the level selection screen */
        .hero-section {
            background: linear-gradient(to right, #6dd5ed, #2193b0);
            color: white;
            padding and 80px 20px;
            text-align: center;
            border-bottom-left-radius: 50px;
            border-bottom-right-radius: 50px;
            margin-bottom: 40px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .hero-section h1 {
            font-size: 3.5em;
            margin-bottom: 15px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto 50px auto;
        }

        .game-card {
            background-color: #ffffff;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .game-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 12px 24px rgba(0,0,0,0.2);
        }

        .game-card .icon {
            font-size: 8em;
            margin-bottom: 15px;
            color: #007bff;
            position: relative;
            z-index: 1;
        }

        .game-card h3 {
            font-size: 1.8em;
            color: #333;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .game-card p {
            font-size: 1.1em;
            color: #666;
            margin-bottom: 25px;
            position: relative;
            z-index: 1;
        }

        .game-card .play-button {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 12px 30px;
            border-radius: 30px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1.1em;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 8px rgba(0,123,255,0.2);
            position: relative;
            z-index: 1;
        }

        .game-card .play-button:hover {
            background-color: #218838;
            transform: translateY(-3px);
        }

        /* Styles for the spelling screen */
        .game-container {
            display: none;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .game-area {
            background-color: #f0f0f0;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        .word-display {
            font-size: 24px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="hero-section">
        <h1>Spelling Game</h1>
    </div>
    <main class="games-grid">
        <div class="game-card" id="easy-level">
            <div class="icon">😊</div>
            <h3>Easy</h3>
            <p>Find the missing letters and spell as many words as you can!</p>
            <button class="play-button" onclick="startGame('easy')">Play Now</button>
        </div>

        <div class="game-card" id="medium-level">
            <div class="icon">🤔</div>
            <h3>Medium</h3>
            <p>Test your intellectual knowledge and agility.</p>
            <button class="play-button" onclick="startGame('medium')">Play Now</button>
        </div>

        <div class="game-card" id="hard-level">
            <div class="icon">😱</div>
            <h3>Hard</h3>
            <p>React quickly by spelling lots of words by identifying the picture!</p>
            <button class="play-button" onclick="startGame('hard')">Play Now</button>
        </div>
    </main>

    <div class="game-container" id="game-container">
        <div class="game-area">
            <div class="word-display" id="word-display"></div>
            <input type="text" id="answer" placeholder="Enter your answer">
            <button id="submit">Submit</button>
            <div id="result"></div>
            <div id="time-display"></div>
        </div>
    </div>

        function generateWord(difficulty) {
            const randomIndex = Math.floor(Math.random() * wordBank.length);
            currentWord = wordBank[randomIndex];

                displayedWord = displayedWord.substring(0, index) + '_' + displayedWord.substring(index + 1);
            });

        }

        function getRandomIndices(length, numIndices) {
            const indices = [];
            while (indices.length < numIndices) {
                const index = Math.floor(Math.random() * length);
                if (!indices.includes(index)) {
                    indices.push(index);
                }
            }
            return indices;
        }

        function startTimer() {
            timeLeft = 60; // 1 minute timer
            const timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('time-display').textContent = `Time left: ${timeLeft} seconds`;
                if (timeLeft === 0) {
                    clearInterval(timerInterval);
                    endGame();
                }
            }, 1000);
        }

        function endGame() {
            alert(`Game over! Your score is ${score}.`);
        }

        document.getElementById('submit').addEventListener('click', checkAnswer);
