<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Snake Game - Infinite Loop Edition</title>
  <style>
    body {
      background-color: black;
      font-family: 'Courier New', Courier, monospace;
      text-align: center;
      color: lime;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    h2 {
      margin: 0;
      margin-bottom: 10px;
    }

    canvas {
      background-color: #111;
      border: 3px solid lime;
      border-radius: 5px;
    }

    /* Controller Styling */
    .controls-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      width: 100%;
      max-width: 400px;
      margin-top: 20px;
    }

    .dpad {
      display: grid;
      grid-template-areas:
        ". up ."
        "left . right"
        ". down .";
      gap: 10px;
    }

    .btn {
      width: 70px;
      height: 70px;
      font-size: 2em;
      background-color: #222;
      color: lime;
      border: 2px solid lime;
      border-radius: 15px;
      user-select: none; /* Prevents text selection on double-tap */
    }
    .btn:active {
      background-color: #333;
      transform: scale(0.95);
    }
    
    #up-btn    { grid-area: up; }
    #left-btn  { grid-area: left; }
    #right-btn { grid-area: right; }
    #down-btn  { grid-area: down; }
    
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    #restart-btn {
      background-color: #400;
      border-color: red;
      color: red;
      visibility: hidden; /* Hidden by default */
    }
  </style>
</head>
<body>
  <h2>🐍 Snake - Infinite Loop</h2>
  <canvas id="gameCanvas" width="400" height="400"></canvas>

  <div class="controls-container">
    <!-- D-Pad Controls -->
    <div class="dpad">
      <button id="up-btn" class="btn">↑</button>
      <button id="left-btn" class="btn">←</button>
      <button id="right-btn" class="btn">→</button>
      <button id="down-btn" class="btn">↓</button>
    </div>
    <!-- Action Buttons -->
    <div class="action-buttons">
      <button id="control-btn" class="btn">Pause</button>
      <button id="restart-btn" class="btn">Restart</button>
    </div>
  </div>
  
  <!-- NEW: Audio elements for sound effects -->
  <audio id="eat-sound" src="eat-sound.mp3"></audio>
  <audio id="win-sound" src="win-sound.mp3"></audio>


  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    // Button and Sound Elements
    const controlBtn = document.getElementById("control-btn");
    const restartBtn = document.getElementById("restart-btn");
    const eatSound = document.getElementById("eat-sound");
    const winSound = document.getElementById("win-sound");

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;
    const winPercentage = 0.20; // Game ends when snake fills 20% of the screen
    const winSize = Math.floor(tileCount * tileCount * winPercentage);

    // Game State Management
    let gameState = 'playing'; // Can be 'playing', 'paused', 'menu', 'gameOver'
    let gameInterval;

    let snake, food, dx, dy, score;

    function setupGame() {
      snake = [{ x: 10, y: 10 }];
      food = { x: 5, y: 5 };
      dx = 1; // Start moving right
      dy = 0;
      score = 0;
      gameState = 'playing';
      controlBtn.textContent = 'Pause';
      restartBtn.style.visibility = 'hidden';
      controlBtn.style.visibility = 'visible';
      placeFood();
    }

    function setDirection(dir) {
      if (gameState !== 'playing') return;

      if (dir === "up" && dy !== 1) { dx = 0; dy = -1; } 
      else if (dir === "down" && dy !== -1) { dx = 0; dy = 1; }
      else if (dir === "left" && dx !== 1) { dx = -1; dy = 0; }
      else if (dir === "right" && dx !== -1) { dx = 1; dy = 0; }
    }

    function drawTile(x, y, color, borderRadius = 0) {
      ctx.fillStyle = color;
      if(borderRadius > 0) {
        ctx.beginPath();
        ctx.moveTo(x * gridSize + borderRadius, y * gridSize);
        ctx.lineTo(x * gridSize + gridSize - borderRadius, y * gridSize);
        ctx.quadraticCurveTo(x * gridSize + gridSize, y * gridSize, x * gridSize + gridSize, y * gridSize + borderRadius);
        ctx.lineTo(x * gridSize + gridSize, y * gridSize + gridSize - borderRadius);
        ctx.quadraticCurveTo(x * gridSize + gridSize, y * gridSize + gridSize, x * gridSize + gridSize - borderRadius, y * gridSize + gridSize);
        ctx.lineTo(x * gridSize + borderRadius, y * gridSize + gridSize);
        ctx.quadraticCurveTo(x * gridSize, y * gridSize + gridSize, x * gridSize, y * gridSize + gridSize - borderRadius);
        ctx.lineTo(x * gridSize, y * gridSize + borderRadius);
        ctx.quadraticCurveTo(x * gridSize, y * gridSize, x * gridSize + borderRadius, y * gridSize);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillRect(x * gridSize, y * gridSize, gridSize - 2, gridSize - 2);
      }
    }

    function drawWinScreen() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "gold";
      ctx.font = "40px 'Courier New', monospace";
      ctx.textAlign = "center";
      ctx.fillText("YOU WIN!", canvas.width / 2, canvas.height / 2 - 20);
      ctx.fillStyle = "white";
      ctx.font = "20px 'Courier New', monospace";
      ctx.fillText(`Your snake filled ${winPercentage * 100}% of the screen!`, canvas.width / 2, canvas.height / 2 + 20);
    }
    
    function drawPaused() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(0,0,canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.font = "40px 'Courier New', monospace";
        ctx.textAlign = "center";
        ctx.fillText("PAUSED", canvas.width / 2, canvas.height / 2);
    }

    function drawMenu() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
        ctx.fillRect(0,0,canvas.width, canvas.height);
        ctx.fillStyle = "white";
        ctx.font = "40px 'Courier New', monospace";
        ctx.textAlign = "center";
        ctx.fillText("MENU", canvas.width / 2, canvas.height / 2 - 60);
        ctx.font = "20px 'Courier New', monospace";
        ctx.fillText("Click 'Resume' to continue", canvas.width / 2, canvas.height / 2);
        ctx.fillText("or 'Restart' for a new game.", canvas.width / 2, canvas.height / 2 + 30);
    }

    function gameLoop() {
      if (gameState === 'paused') { drawPaused(); return; }
      if (gameState === 'menu') { drawMenu(); return; }
      if (gameState === 'gameOver') { drawWinScreen(); return; }

      // --- Game Logic when 'playing' ---
      const head = { x: snake[0].x + dx, y: snake[0].y + dy };
      
      // NEW: Wall wrapping logic
      if (head.x < 0) head.x = tileCount - 1;
      if (head.x >= tileCount) head.x = 0;
      if (head.y < 0) head.y = tileCount - 1;
      if (head.y >= tileCount) head.y = 0;
      
      // NEW: Game over condition is now based on snake size
      if (snake.length >= winSize) {
        gameState = 'gameOver';
        winSound.play(); // Play win sound
        controlBtn.style.visibility = 'hidden';
        restartBtn.style.visibility = 'visible';
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score++;
        eatSound.currentTime = 0; // Allow sound to be replayed quickly
        eatSound.play(); // Play eat sound
        placeFood();
      } else {
        snake.pop();
      }

      // --- Drawing ---
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawTile(food.x, food.y, "red", 8);
      snake.forEach((seg, index) => drawTile(seg.x, seg.y, index === 0 ? "lime" : "#008000", 4));

      // score
      ctx.fillStyle = "white";
      ctx.font = "16px monospace";
      ctx.textAlign = "left";
      ctx.fillText("Score: " + score, 10, 20);
      ctx.fillText(`Win Size: ${winSize}`, 10, 40);
    }

    function placeFood() {
      let foodPlaced = false;
      while(!foodPlaced) {
        food.x = Math.floor(Math.random() * tileCount);
        food.y = Math.floor(Math.random() * tileCount);
        // Ensure food doesn't spawn on the snake
        if (!snake.some(seg => seg.x === food.x && seg.y === food.y)) {
            foodPlaced = true;
        }
      }
    }

    function togglePauseMenu() {
      if (gameState === 'gameOver') return;

      if (gameState === 'playing') {
        gameState = 'paused';
        controlBtn.textContent = 'Menu';
      } else if (gameState === 'paused') {
        gameState = 'menu';
        controlBtn.textContent = 'Resume';
        restartBtn.style.visibility = 'visible';
      } else if (gameState === 'menu') {
        gameState = 'playing';
        controlBtn.textContent = 'Pause';
        restartBtn.style.visibility = 'hidden';
      }
    }
    
    function restartGame() {
        clearInterval(gameInterval);
        setupGame();
        gameInterval = setInterval(gameLoop, 150);
    }

    // Event Listeners
    document.addEventListener("keydown", (e) => {
      if (e.key === "ArrowUp") setDirection("up");
      if (e.key === "ArrowDown") setDirection("down");
      if (e.key === "ArrowLeft") setDirection("left");
      if (e.key === "ArrowRight") setDirection("right");
      if (e.key === " ") { e.preventDefault(); togglePauseMenu(); }
    });

    document.getElementById('up-btn').addEventListener('click', () => setDirection('up'));
    document.getElementById('down-btn').addEventListener('click', () => setDirection('down'));
    document.getElementById('left-btn').addEventListener('click', () => setDirection('left'));
    document.getElementById('right-btn').addEventListener('click', () => setDirection('right'));
    
    controlBtn.addEventListener('click', togglePauseMenu);
    restartBtn.addEventListener('click', restartGame);

    // Initial game start
    restartGame();
  </script>
</body>
</html>
