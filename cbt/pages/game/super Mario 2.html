<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Pixel Pete's Adventure</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #5c94fc; /* Sky Blue */
            --font-color: #FFF;
        }
        body {
            background-color: #0d1b2a;
            color: var(--font-color);
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
            overflow: hidden;
        }
        #game-wrapper {
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16 / 9;
            position: relative;
            background-color: var(--bg-color);
            border: 3px solid white;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }
        canvas {
            display: block;
            width: 100%; height: 100%;
            image-rendering: pixelated;
        }
        #game-hud {
            position: absolute;
            top: 10px; left: 10px; right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
            text-shadow: 2px 2px #000;
        }
        .overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.6);
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            text-align: center; font-size: 2em;
            cursor: pointer; z-index: 100;
        }
        .overlay p { font-size: 0.5em; margin-top: 20px; line-height: 1.5; }
        .hidden { display: none; }
        
        #mobile-controls {
            display: none;
            width: 100%; max-width: 800px;
            margin-top: 15px;
            justify-content: space-between; align-items: center;
            padding: 0 20px;
        }
        .move-buttons, .action-buttons {
            display: flex;
            gap: 20px;
        }
        .control-btn {
            width: 60px; height: 60px; font-size: 2em;
            background-color: rgba(255,255,255,0.3); color: white;
            border: 2px solid white; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            -webkit-user-select: none; user-select: none;
        }
        .control-btn:active { background-color: rgba(255,255,255,0.5); }

        @media (hover: none) and (pointer: coarse) {
            #mobile-controls { display: flex; }
        }
    </style>
</head>
<body>
    <div id="game-wrapper">
        <canvas id="gameCanvas"></canvas>
        <div id="game-hud">
            <div id="score">COINS: 0</div>
            <div id="lives">LIVES: ❤️❤️❤️</div>
        </div>
        <div id="start-overlay" class="overlay">
            <div>PIXEL PETE</div>
            <p>Use [A][D] or Arrows to Move<br>[SPACE] to Jump<br><br>Click to Start</p>
        </div>
    </div>
    <div id="mobile-controls">
        <div class="move-buttons">
            <button id="left-btn" class="control-btn">◀</button>
            <button id="right-btn" class="control-btn">▶</button>
        </div>
        <div class="action-buttons">
            <button id="jump-btn" class="control-btn">▲</button>
        </div>
    </div>

<script>
document.addEventListener('DOMContentLoaded', () => {
    // --- DOM Elements ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const livesEl = document.getElementById('lives');
    const startOverlay = document.getElementById('start-overlay');
    const leftBtn = document.getElementById('left-btn'), rightBtn = document.getElementById('right-btn'), jumpBtn = document.getElementById('jump-btn');

    // --- Game Constants & Sizing ---
    const TILE_SIZE = 40;
    canvas.width = 800;
    canvas.height = 450;
    
    // --- Physics Constants ---
    const GRAVITY = 0.5;
    const JUMP_STRENGTH = -12;
    const MAX_SPEED_X = 5;
    const MAX_SPEED_Y = 15;
    const ACCELERATION = 0.5;
    const FRICTION = 0.85;

    // --- Level Data ---
    const levelLayout = [
        "                                ",
        "                                ",
        "                                ",
        "            C C C               ",
        "           GGGGGG               ",
        "                                ",
        "    C C                   C C   ",
        "   GGGGG      S S        GGGGG  ",
        "              GGG               ",
        "GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG",
        "GGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGGG",
    ];

    const tileMap = {
        'G': { color: '#6a4d3a', solid: true }, // Ground
        'C': { color: '#f1c40f', solid: false, collectible: true }, // Coin
        'S': { color: '#e74c3c', solid: false, deadly: true } // Spike
    };

    // --- Game State ---
    let score, lives, gameActive;
    const keys = {};
    const camera = { x: 0, y: 0 };

    const player = {
        x: 100, y: 100,
        width: TILE_SIZE * 0.8, height: TILE_SIZE * 0.9,
        dx: 0, dy: 0,
        onGround: false,
        color: '#e67e22'
    };

    // --- Game Initialization ---
    function init() {
        score = 0;
        lives = 3;
        gameActive = true;
        
        player.x = 100; player.y = 100;
        player.dx = 0; player.dy = 0;
        
        updateHUD();
        startOverlay.classList.add('hidden');
        gameLoop();
    }

    // --- Game Loop ---
    function gameLoop() {
        if (!gameActive) return;
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }

    // --- Update Function ---
    function update() {
        // Horizontal Movement
        if (keys.ArrowLeft || keys.a) player.dx -= ACCELERATION;
        if (keys.ArrowRight || keys.d) player.dx += ACCELERATION;

        // Jumping
        if ((keys[' '] || keys.ArrowUp) && player.onGround) {
            player.dy = JUMP_STRENGTH;
            player.onGround = false;
        }
        
        // Apply physics
        player.dy += GRAVITY;
        player.dx *= FRICTION;

        // Clamp velocities
        if (player.dx > MAX_SPEED_X) player.dx = MAX_SPEED_X;
        if (player.dx < -MAX_SPEED_X) player.dx = -MAX_SPEED_X;
        if (player.dy > MAX_SPEED_Y) player.dy = MAX_SPEED_Y;

        // Collision detection (before moving)
        handleCollisions();
        
        // Update position
        player.x += player.dx;
        player.y += player.dy;

        // Update camera to follow player
        camera.x = player.x - canvas.width / 3;
        if (camera.x < 0) camera.x = 0;
    }
    
    // --- Collision Detection ---
    function handleCollisions() {
        player.onGround = false;
        // Horizontal Collision
        let proposedX = player.x + player.dx;
        const startTileX = Math.floor(proposedX / TILE_SIZE);
        const endTileX = Math.floor((proposedX + player.width) / TILE_SIZE);
        const startTileY = Math.floor(player.y / TILE_SIZE);
        const endTileY = Math.floor((player.y + player.height) / TILE_SIZE);

        for (let y = startTileY; y <= endTileY; y++) {
            for (let x = startTileX; x <= endTileX; x++) {
                const tileChar = levelLayout[y]?.[x];
                const tile = tileMap[tileChar];
                if (tile && tile.solid) {
                    if (player.dx > 0) player.dx = 0; // Stop horizontal movement
                    if (player.dx < 0) player.dx = 0;
                }
            }
        }
        
        // Vertical Collision
        let proposedY = player.y + player.dy;
        const startTileXVert = Math.floor(player.x / TILE_SIZE);
        const endTileXVert = Math.floor((player.x + player.width) / TILE_SIZE);
        const startTileYVert = Math.floor(proposedY / TILE_SIZE);
        const endTileYVert = Math.floor((proposedY + player.height) / TILE_SIZE);

        for (let y = startTileYVert; y <= endTileYVert; y++) {
            for (let x = startTileXVert; x <= endTileXVert; x++) {
                const tileChar = levelLayout[y]?.[x];
                const tile = tileMap[tileChar];

                // Check for deadly tiles or collectibles
                const playerRect = {x: player.x, y: player.y, width: player.width, height: player.height};
                const tileRect = {x: x * TILE_SIZE, y: y * TILE_SIZE, width: TILE_SIZE, height: TILE_SIZE};
                
                if(tile && isColliding(playerRect, tileRect)) {
                    if(tile.deadly) { loseLife(); }
                    // This part would need mutation to remove the coin
                    // For now, just score up.
                    if(tile.collectible) { score += 10; updateHUD(); }
                }

                if (tile && tile.solid) {
                    if (player.dy > 0) { // Moving down
                        player.onGround = true;
                        player.dy = 0;
                    }
                    if (player.dy < 0) { // Moving up
                        player.dy = 0;
                    }
                }
            }
        }
    }

    // --- Drawing ---
    function draw() {
        ctx.fillStyle = '#5c94fc';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Apply camera transformation
        ctx.save();
        ctx.translate(-camera.x, -camera.y);

        // Draw level tiles
        for (let r = 0; r < levelLayout.length; r++) {
            for (let c = 0; c < levelLayout[r].length; c++) {
                const tileChar = levelLayout[r][c];
                const tile = tileMap[tileChar];
                if (tile) {
                    ctx.fillStyle = tile.color;
                    ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                }
            }
        }

        // Draw Player
        ctx.fillStyle = player.color;
        ctx.fillRect(player.x, player.y, player.width, player.height);
        
        ctx.restore();
    }

    // --- Game State & HUD ---
    function loseLife() {
        lives--;
        updateHUD();
        if (lives <= 0) {
            gameOver("GAME OVER");
        } else {
            // Respawn player
            player.x = 100; player.y = 100;
            player.dx = 0; player.dy = 0;
        }
    }

    function gameOver(message) {
        gameActive = false;
        startOverlay.classList.remove('hidden');
        startOverlay.querySelector('div').textContent = message;
        startOverlay.querySelector('p').innerHTML = `Final Score: ${score}<br><br>Click to Play Again`;
    }

    function updateHUD() {
        scoreEl.textContent = `COINS: ${score}`;
        livesEl.textContent = `LIVES: ${'❤️'.repeat(lives)}`;
    }
    
    function isColliding(rect1, rect2) {
        return rect1.x < rect2.x + rect2.width &&
               rect1.x + rect1.width > rect2.x &&
               rect1.y < rect2.y + rect2.height &&
               rect1.y + rect1.height > rect2.y;
    }

    // --- Event Listeners ---
    window.addEventListener('keydown', e => { keys[e.key] = true; });
    window.addEventListener('keyup', e => { keys[e.key] = false; });
    
    leftBtn.addEventListener('touchstart', e => { e.preventDefault(); keys.ArrowLeft = true; });
    leftBtn.addEventListener('touchend', e => { e.preventDefault(); keys.ArrowLeft = false; });
    rightBtn.addEventListener('touchstart', e => { e.preventDefault(); keys.ArrowRight = true; });
    rightBtn.addEventListener('touchend', e => { e.preventDefault(); keys.ArrowRight = false; });
    jumpBtn.addEventListener('touchstart', e => { e.preventDefault(); keys[' '] = true; });
    jumpBtn.addEventListener('touchend', e => { e.preventDefault(); keys[' '] = false; });

    startOverlay.addEventListener('click', init, { once: true });
});
</script>
</body>
</html>
