<!-- registered-users.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../scripts/css/font-awesome.min.css">
    <title>Registered Users</title>

  <style>
    /* Root colors */
    :root {
      --primary-blue: #020690;
      --accent-yellow: #FEC009;
      --background-light: #f9f9f9;
      --text-dark: #222;
      --border-light: #ddd;
      --hover-light: #eaeaea;
    }

    /* Reset and base */
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--background-light);
      color: var(--text-dark);
      margin: 0;
      padding: 0;
      line-height: 1.6;
    }

    .container {
       
      margin: 50px auto;
      padding: 30px 40px;
      background-color: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(2, 6, 144, 0.15);
      border: 2px solid var(--primary-blue);
    }

    h2 {
      color: var(--primary-blue);
      font-weight: 700;
      font-size: 2.2rem;
      margin-bottom: 20px;
      text-align: center;
      letter-spacing: 1.2px;
    }

    /* Search and sort controls */
    #search-input, #sort-select {
      font-size: 1rem;
      padding: 10px 15px;
      margin: 10px 10px 20px 0;
      border: 2px solid var(--primary-blue);
      border-radius: 6px;
      outline-offset: 2px;
      transition: border-color 0.3s ease;
      width: 220px;
      color: var(--primary-blue);
      font-weight: 600;
    }

    #search-input::placeholder {
      color: var(--primary-blue);
      opacity: 0.7;
    }

    #search-input:focus, #sort-select:focus {
      border-color: var(--accent-yellow);
      box-shadow: 0 0 8px var(--accent-yellow);
    }

    /* Table styling */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 1rem;
      box-shadow: 0 4px 12px rgba(2, 6, 144, 0.1);
      border-radius: 8px;
      overflow: hidden;
    }

    thead {
      background: var(--primary-blue);
      color: #fff;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    th, td {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border-light);
      text-align: left;
      vertical-align: middle;
    }

    tbody tr:nth-child(even) {
      background-color: var(--background-light);
    }

    tbody tr:hover {
      background-color: var(--accent-yellow);
      color: var(--primary-blue);
      cursor: pointer;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    /* Responsive table for small screens */
    @media (max-width: 768px) {
      table, thead, tbody, th, td, tr {
        display: block;
      }

      thead tr {
        position: absolute;
        top: -9999px;
        left: -9999px;
      }

      tbody tr {
        margin-bottom: 20px;
        border: 2px solid var(--primary-blue);
        border-radius: 10px;
        padding: 15px;
        background: #fff;
        box-shadow: 0 4px 12px rgba(2, 6, 144, 0.1);
      }

      tbody tr:hover {
        background-color: var(--accent-yellow);
        color: var(--primary-blue);
      }

      td {
        border: none;
        position: relative;
        padding-left: 50%;
        text-align: left;
        font-weight: 600;
        color: var(--primary-blue);
      }

      td:before {
        position: absolute;
        top: 14px;
        left: 18px;
        width: 45%;
        padding-right: 10px;
        white-space: nowrap;
        font-weight: 700;
        color: var(--accent-yellow);
        text-transform: uppercase;
      }

      /* Label each cell */
      .id:before { content: "ID"; }
      .name:before { content: "Name"; }
      .username:before { content: "Username"; }
      .role:before { content: "Role"; }
      .class:before { content: "Class"; }
      .gender:before { content: "Gender"; }
      .email:before { content: "Email"; }
      .passport:before { content: "Passport"; }
      .actions:before { content: "Actions"; }
    }

    /* User card style (if used) */
    .user-card {
      display: flex;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid var(--border-light);
    }

    .user-card img {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      margin-right: 16px;
      border: 2px solid var(--primary-blue);
      object-fit: cover;
    }

    .user-details {
      flex: 1;
      color: var(--primary-blue);
      font-weight: 600;
    }

    /* Buttons or action links styling */
    .btn-action {
      background-color: var(--primary-blue);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.3s ease;
      text-decoration: none;
      display: inline-block;
      font-size: 0.9rem;
    }

    .btn-action:hover {
      background-color: var(--accent-yellow);
      color: var(--primary-blue);
    }
  </style>
</head>
<body>
  <div class="container" role="main" aria-label="Registered Users">
    <h2>Registered Users</h2>
    <div style="display:flex; flex-wrap: wrap; justify-content: center; gap: 10px;">
      <input type="search" id="search-input" placeholder="Search users..." aria-label="Search users" />
      <select id="sort-select" aria-label="Sort users">
        <option value="name-asc">Name (A-Z)</option>
        <option value="name-desc">Name (Z-A)</option>
        <option value="role-asc">Role (A-Z)</option>
        <option value="role-desc">Role (Z-A)</option>
        <option value="class-asc">Class (A-Z)</option>
        <option value="class-desc">Class (Z-A)</option>
      </select>
    </div>
    <div id="users-tbody" style="margin-top: 20px;">
      <!-- Example table structure for users -->
      <table aria-describedby="Registered users table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Username</th>
            <th>Role</th>
            <th>Class</th>
            <th>Gender</th>
            <th>Email</th>
            <th>Passport</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <!-- Dynamic user rows go here -->
        </tbody>
      </table>
    </div>
  </div>
      <script>
        // Fetch users data from users.json file
const usersContainer = document.getElementById('users-tbody');
const searchInput = document.getElementById('search-input');
const sortSelect = document.getElementById('sort-select');

let users = [];

fetch('../data/users.json')
  .then(response => response.json())
  .then(data => {
    users = data;
    renderUsers(users);
  })
  .catch(error => console.error('Error fetching users:', error));

function renderUsers(users) {
  usersContainer.innerHTML = '';
  users.forEach(user => {
    const userCard = document.createElement('div');
    userCard.className = 'user-card';
    userCard.innerHTML = `
      <img src="${user.profilePicture}" alt="Profile Picture">
      <div class="user-details">
        <p>ID: ${user.id}</p>
        <p>Name: ${user.name}</p>
        <p>Email: ${user.email}</p>
        <p>Role: ${user.role}</p>
        <p>Class: ${user.class}</p>
      </div>
    `;
    usersContainer.appendChild(userCard);
  });
}

searchInput.addEventListener('input', () => {
  const searchValue = searchInput.value.toLowerCase();
  const filteredUsers = users.filter(user => {
    return user.name.toLowerCase().includes(searchValue) ||
           user.email.toLowerCase().includes(searchValue) ||
           user.role.toLowerCase().includes(searchValue) ||
           user.class.toLowerCase().includes(searchValue);
  });
  renderUsers(filteredUsers);
});

sortSelect.addEventListener('change', () => {
  const sortValue = sortSelect.value;
  const [sortField, sortOrder] = sortValue.split('-');
  const sortedUsers = users.slice().sort((a, b) => {
    if (sortField === 'name') {
      return sortOrder === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name);
    } else if (sortField === 'role') {
      return sortOrder === 'asc' ? a.role.localeCompare(b.role) : b.role.localeCompare(a.role);
    } else if (sortField === 'class') {
      return sortOrder === 'asc' ? a.class.localeCompare(b.class) : b.class.localeCompare(a.class);
    }
  });
  renderUsers(sortedUsers);
});
    </script>
</body>
</html>
