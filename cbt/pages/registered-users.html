<!-- Registered-Users.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registered Users</title>
    <style>
        /* Add some basic styling */
        body {
            font-family: Arial, sans-serif;
        }
        .container {
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background-color: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 20px;
  background-color: #f9f9f9;
}

th {
  background-color: #4CAF50;
  color: #fff;
  padding: 12px;
  text-align: left;
}

td {
  border: 1px solid #dee2e6;
  padding: 12px;
  text-align: left;
}

tr:nth-child(even) {
  background-color: #f2f2f2;
}

tr:hover {
  background-color: #ddd;
}

@media only screen and (max-width: 768px) {
  table, thead, tbody, th, td, tr {
    display: block;
  }

  th {
    display: none;
  }

  td {
    border: none;
    position: relative;
    padding-left: 50%;
  }

  td:before {
    position: absolute;
    top: 6px;
    left: 6px;
    width: 200px;
    padding-right: 10px;
    white-space: nowrap;
  }

  .id {
    border-top: 1px solid #dee2e6;
  }

  .id:before {
    content: "ID:";
  }

  .name:before {
    content: "Name:";
  }

  .username:before {
    content: "Username:";
  }

  .role:before {
    content: "Role:";
  }

  .class:before {
    content: "Class:";
  }

  .gender:before {
    content: "Gender:";
  }

  .email:before {
    content: "Email:";
  }

  .passport:before {
    content: "Passport:";
  }

  .actions:before {
    content: "Actions:";
  }
}

.user-card {
  display: flex;
  align-items: center;
  padding: 10px;
  border-bottom: 1px solid #ddd;
}

.user-card img {
  width: 50px;
  height: 50px;
  border-radius: 50%;
  margin-right: 10px;
}

.user-details {
  flex: 1;
}

    </style>
</head>
<body>
    <div class="container">
  <h2>Registered Users</h2>
  <input type="search" id="search-input" placeholder="Search users...">
  <select id="sort-select">
    <option value="name-asc">Name (A-Z)</option>
    <option value="name-desc">Name (Z-A)</option>
    <option value="role-asc">Role (A-Z)</option>
    <option value="role-desc">Role (Z-A)</option>
    <option value="class-asc">Class (A-Z)</option>
    <option value="class-desc">Class (Z-A)</option>
  </select>
  <div id="users-tbody"></div>
</div>
    <script>
        // Fetch users data from users.json file
const usersContainer = document.getElementById('users-tbody');
const searchInput = document.getElementById('search-input');
const sortSelect = document.getElementById('sort-select');

let users = [];

fetch('../data/users.json')
  .then(response => response.json())
  .then(data => {
    users = data;
    renderUsers(users);
  })
  .catch(error => console.error('Error fetching users:', error));

function renderUsers(users) {
  usersContainer.innerHTML = '';
  users.forEach(user => {
    const userCard = document.createElement('div');
    userCard.className = 'user-card';
    userCard.innerHTML = `
      <img src="${user.profilePicture}" alt="Profile Picture">
      <div class="user-details">
        <p>ID: ${user.id}</p>
        <p>Name: ${user.name}</p>
        <p>Email: ${user.email}</p>
        <p>Role: ${user.role}</p>
        <p>Class: ${user.class}</p>
      </div>
    `;
    usersContainer.appendChild(userCard);
  });
}

searchInput.addEventListener('input', () => {
  const searchValue = searchInput.value.toLowerCase();
  const filteredUsers = users.filter(user => {
    return user.name.toLowerCase().includes(searchValue) ||
           user.email.toLowerCase().includes(searchValue) ||
           user.role.toLowerCase().includes(searchValue) ||
           user.class.toLowerCase().includes(searchValue);
  });
  renderUsers(filteredUsers);
});

sortSelect.addEventListener('change', () => {
  const sortValue = sortSelect.value;
  const [sortField, sortOrder] = sortValue.split('-');
  const sortedUsers = users.slice().sort((a, b) => {
    if (sortField === 'name') {
      return sortOrder === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name);
    } else if (sortField === 'role') {
      return sortOrder === 'asc' ? a.role.localeCompare(b.role) : b.role.localeCompare(a.role);
    } else if (sortField === 'class') {
      return sortOrder === 'asc' ? a.class.localeCompare(b.class) : b.class.localeCompare(a.class);
    }
  });
  renderUsers(sortedUsers);
});
    </script>
</body>
</html>
