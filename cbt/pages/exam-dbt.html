<!DOCTYPE html>
<!-- exam-dbt.html -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Exam JSON Generator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      color: #020169;
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    h1 {
      color: #FEC009;
      text-align: center;
    }
    section {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 10px;
    }
    select, input[type="number"], input[type="text"] {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
    }
    .term-checkboxes input {
      margin-right: 5px;
    }
    .subject-buttons button {
      margin: 5px;
      padding: 8px;
      background-color: #020169;
      color: #ffffff;
      border: none;
      cursor: pointer;
    }
    .subject-buttons button:hover {
      background-color: #FEC009;
      color: #020169;
    }
    .subject-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 10px;
    }
    .subject {
      padding: 5px 10px;
      border: 1px solid #020169;
      border-radius: 5px;
      cursor: pointer;
    }
    .subject.selected {
      background-color: #FEC009;
      color: #020169;
      font-weight: bold;
    }
    button#generateBtn {
      background-color: #020169;
      color: #ffffff;
      padding: 10px;
      width: 100%;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }
    button#generateBtn:hover {
      background-color: #FEC009;
      color: #020169;
    }
    pre {
      background-color: #f4f4f4;
      padding: 10px;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <h1>Exam Database Generator</h1>

  <!-- Academic Session -->
  <section>
    <label for="startYear">Select Start Year:</label>
    <input type="number" id="startYear" min="2000" max="2100" />
    <p id="sessionDisplay"></p>
  </section>

  <!-- Term Selection -->
  <section class="term-checkboxes">
    <label>Select Terms:</label>
    <input type="checkbox" value="1ST" /> 1ST
    <input type="checkbox" value="2ND" /> 2ND
    <input type="checkbox" value="3RD" /> 3RD
  </section>

  <!-- Class Selection -->
  <section>
    <label>Select Classes:</label>
    <div id="classList" class="subject-list"></div>
  </section>

  <!-- Subject Selection -->
  <section>
    <input type="text" id="subjectSearch" placeholder="Search subjects..." />
    <div class="subject-buttons">
      <button onclick="showAllSubjects()">Show All</button>
      <button onclick="showJuniorSubjects()">Junior</button>
      <button onclick="showSeniorSubjects()">Senior</button>
    </div>
    <div id="subjectList" class="subject-list"></div>
  </section>

  <!-- Generate Button -->
  <button id="generateBtn" onclick="generateJSON()">Generate JSON</button>

  <!-- Output -->
  <section>
    <h3>Preview:</h3>
    <pre id="output"></pre>
    <button onclick="copyJSON()">Copy to Clipboard</button>
    <button onclick="downloadJSON()">Download JSON</button>
  </section>

  <script>
    const classLabels = {
      JS1: "BASIC 7",
      JS2: "BASIC 8",
      JS3: "BASIC 9",
      SS1: "SENIOR SECONDARY 1",
      SS2: "SENIOR SECONDARY 2",
      SS3: "SENIOR SECONDARY 3"
    };

    const subjectCodes = {
      "Agricultural Science": "ACS",
      "Basic Science": "BSCI",
      "Basic Technology": "BTEC",
      "Business Studies": "BUS",
      "Christian Religious Studies": "CRS",
      "Civic Education": "CIV",
      "Computer Studies": "CST",
      "Cultural and Creative Art": "CCA",
      "Dictation": "DICT",
      "Junior Diction": "JDIC",
      "English Studies": "ENG",
      "French": "FRN",
      "Historical Studies": "HIST",
      "Home Economics": "HEC",
      "Mathematics": "MATH",
      "Music": "MUS",
      "Physical and Health Education": "PHE",
      "Security Education": "SEC",
      "Social Studies": "SOC",
      "Animal Husbandry": "AHB",
      "Biology": "BIO",
      "Chemistry": "CHEM",
      "Commerce": "COM",
      "Economics": "ECO",
      "English Literature": "LIT",
      "Further Mathematics": "FMATH",
      "Geography": "GEO",
      "Government": "GOV",
      "Physics": "PHY"
    };

    const juniorSubjects = [
      "Agricultural Science", "Basic Science", "Basic Technology", "Business Studies",
      "Christian Religious Studies", "Civic Education", "Computer Studies", "Cultural and Creative Art",
      "Dictation", "Junior Diction", "English Studies", "French", "Historical Studies",
      "Home Economics", "Mathematics", "Music", "Physical and Health Education",
      "Security Education", "Social Studies"
    ];

    const seniorSubjects = [
      "Agricultural Science", "Animal Husbandry", "Biology", "Chemistry",
      "Christian Religious Studies", "Civic Education", "Commerce", "Diction",
      "Economics", "English Studies", "Further Mathematics", "Geography",
      "Government", "Historical Studies", "English Literature", "Physics"
    ];

    const classes = ["JS1", "JS2", "JS3", "SS1", "SS2", "SS3"];
    let currentSubjects = [];
    let currentClasses = [];

    function showAllSubjects() {
      currentSubjects = [...new Set([...juniorSubjects, ...seniorSubjects])];
      renderSubjects();
    }

    function showJuniorSubjects() {
      currentSubjects = [...juniorSubjects];
      renderSubjects();
    }

    function showSeniorSubjects() {
      currentSubjects = [...seniorSubjects];
      renderSubjects();
    }

    function renderSubjects() {
      const list = document.getElementById("subjectList");
      list.innerHTML = "";
      currentSubjects.forEach(subject => {
        const div = document.createElement("div");
        div.className = "subject";
        div.textContent = subject;
        div.onclick = () => div.classList.toggle("selected");
        list.appendChild(div);
      });
    }

    function renderClasses() {
      const list = document.getElementById("classList");
      list.innerHTML = "";
      classes.forEach(cls => {
        const div = document.createElement("div");
        div.className = "subject";
        div.textContent = cls;
        div.onclick = () => div.classList.toggle("selected");
        list.appendChild(div);
      });
    }

    renderClasses();
    showAllSubjects();

    document.getElementById("subjectSearch").addEventListener("input", function () {
      const query = this.value.toLowerCase();
      document.querySelectorAll("#subjectList .subject").forEach(el => {
        el.style.display = el.textContent.toLowerCase().includes(query) ? "inline-block" : "none";
      });
    });

    document.getElementById("startYear").addEventListener("input", function () {
      const year = parseInt(this.value);
      if (year) {
        document.getElementById("sessionDisplay").textContent = `Academic Session: ${year}-${year + 1}`;
      }
    });

function generateJSON() {
  const selectedClasses = [...document.querySelectorAll('#classList .subject.selected')].map(el => el.textContent);
  const startYear = parseInt(document.getElementById("startYear").value);
  const session = `${startYear}-${startYear + 1}`;
  const selectedTerms = [...document.querySelectorAll('input[type="checkbox"]:checked')].map(cb => cb.value);
  const selectedSubjects = [...document.querySelectorAll('#subjectList .subject.selected')].map(el => el.textContent);
  const result = {};

  selectedClasses.forEach(cls => {
    result[cls] = [];
    let classSubjects = selectedSubjects;
    if (cls.startsWith("JS")) {
      classSubjects = classSubjects.filter(subject => juniorSubjects.includes(subject));
    } else if (cls.startsWith("SS")) {
      classSubjects = classSubjects.filter(subject => seniorSubjects.includes(subject));
    }
    classSubjects.forEach(subject => {
      selectedTerms.forEach(term => {
        const code = subjectCodes[subject];
        const label = classLabels[cls];
        result[cls].push({
          fileName: `${session}-${cls}-${code}-${term}`,
          displayName: `${label} ${term} TERM ${subject.toUpperCase()} EXAM ${session}`
        });
      });
    });
  });

  document.getElementById("output").textContent = JSON.stringify(result, null, 2);
}

    function copyJSON() {
      const output = document.getElementById("output").textContent;
      navigator.clipboard.writeText(output).then(() => alert("Copied to clipboard!"));
    }

    function downloadJSON() {
      const dataStr = document.getElementById("output").textContent;
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "exam-database.json";
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
