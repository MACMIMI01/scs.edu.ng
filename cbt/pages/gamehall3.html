<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Hall - MacTutor</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0d1b2a;
            --card-bg: #1b263b;
            --font-color: #e0e1dd;
            --border-color: #778da9;
            --accent-color: #f1c40f;
        }
        body {
            background-color: var(--bg-color);
            color: var(--font-color);
            font-family: 'Press Start 2P', cursive;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            color: var(--accent-color);
            font-size: 2.5em;
            text-shadow: 3px 3px 0px var(--border-color);
        }
        nav a {
            color: var(--font-color);
            margin: 0 15px;
            text-decoration: none;
            font-size: 1em;
        }
        #game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1000px;
        }
        .game-card {
            background-color: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .game-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 10px 20px rgba(119, 141, 169, 0.4);
        }
        .game-icon {
            font-size: 5em;
            margin-bottom: 20px;
            color: var(--accent-color);
        }
        .game-card h2 {
            font-size: 1.5em;
            margin-bottom: 15px;
        }
        .high-score {
            font-size: 1em;
            margin-bottom: 25px;
        }
        .high-score span {
            color: var(--accent-color);
            font-size: 1.2em;
        }
        .play-btn {
            display: inline-block;
            background-color: var(--border-color);
            color: var(--bg-color);
            padding: 12px 30px;
            text-decoration: none;
            font-family: 'Press Start 2P', cursive;
            font-size: 1em;
            border-radius: 5px;
            transition: background-color 0.2s;
        }
        .play-btn:hover {
            background-color: var(--accent-color);
        }
        @media (max-width: 600px) {
            h1 { font-size: 1.8em; }
            nav { font-size: 0.8em; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Game Hall</h1>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="profile.html">Profile</a>
        </nav>
    </header>

    <main id="game-grid">
        <!-- Game cards will be dynamically inserted here -->
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const gameGrid = document.getElementById('game-grid');

            // Define the games for our hall
            const games = [
                {
                    id: 'invaders',
                    title: 'Pixel Invaders',
                    icon: 'fa-space-shuttle',
                    url: 'pixel-invaders.html', // Make sure this path is correct
                    scoreKey: 'invaders_high_score'
                },
                {
                    id: 'stacker',
                    title: 'Brick Stacker',
                    icon: 'fa-cubes',
                    url: 'brick-stacker.html', // Make sure this path is correct
                    scoreKey: 'stacker_high_score'
                },
                {
                    id: 'paddle',
                    title: 'Pixel Paddle',
                    icon: 'fa-table-tennis-paddle-ball',
                    url: 'pIxel-paddle.html', // Make sure this path is correct
                    scoreKey: 'paddle_high_score'
                }
            ];

            // Function to create and display game cards
            function displayGames() {
                gameGrid.innerHTML = ''; // Clear existing content

                games.forEach(game => {
                    // 1. Get the high score from localStorage
                    const highScore = localStorage.getItem(game.scoreKey) || 0;

                    // 2. Create the card element
                    const card = document.createElement('div');
                    card.className = 'game-card';
                    card.innerHTML = `
                        <div class="game-icon">
                            <i class="fas ${game.icon}"></i>
                        </div>
                        <h2>${game.title}</h2>
                        <p class="high-score">High Score: <span>${highScore}</span></p>
                        <a href="${game.url}" class="play-btn">Play</a>
                    `;
                    
                    // 3. Add the card to the grid
                    gameGrid.appendChild(card);
                });
            }

            // Initial display
            displayGames();
        });
    </script>
</body>
</html>
