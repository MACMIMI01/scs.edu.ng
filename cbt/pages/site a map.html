<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard JSON Editor</title>
  <link rel="stylesheet" href="../scripts/css/font-awesome.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .panel {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.2);
    }
    h1 {
      color: white;
      text-align: center;
      margin-bottom: 30px;
      font-size: 32px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
    }
    h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 24px;
      border-bottom: 2px solid #667eea;
      padding-bottom: 10px;
    }
    .form-group {
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-bottom: 8px;
      color: #555;
      font-weight: 600;
    }
    input, select, textarea {
      width: 100%;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
      transition: border-color 0.3s;
      font-family: inherit;
    }
    textarea {
      resize: vertical;
      min-height: 80px;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #667eea;
    }
    .icon-preview {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 6px;
      margin-top: 10px;
    }
    .icon-preview i {
      font-size: 32px;
      color: #667eea;
    }
    .btn {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 14px 28px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      width: 100%;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 10px;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
    }
    .btn-secondary {
      background: #6c757d;
    }
    .btn-success {
      background: #28a745;
    }
    .dashboard-items {
      max-height: 500px;
      overflow-y: auto;
    }
    .dashboard-item {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 10px;
      border-left: 4px solid #667eea;
    }
    .dashboard-item-header {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 8px;
    }
    .dashboard-item-header i {
      font-size: 24px;
      color: #667eea;
    }
    .dashboard-item-title {
      font-weight: 600;
      color: #333;
      flex: 1;
    }
    .dashboard-item-desc {
      font-size: 13px;
      color: #666;
      margin-bottom: 5px;
    }
    .dashboard-item-link {
      font-size: 12px;
      color: #999;
    }
    .item-actions {
      display: flex;
      gap: 5px;
      margin-top: 10px;
    }
    .btn-small {
      padding: 6px 12px;
      font-size: 12px;
      width: auto;
      margin: 0;
    }
    .btn-edit {
      background: #28a745;
    }
    .btn-delete {
      background: #dc3545;
    }
    .icon-dropdown {
      max-height: 200px;
      overflow-y: auto;
      border: 2px solid #ddd;
      border-radius: 6px;
      margin-top: 5px;
      background: white;
      position: absolute;
      width: calc(100% - 24px);
      z-index: 1000;
    }
    .icon-option {
      padding: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #f0f0f0;
    }
    .icon-option:hover {
      background: #f8f9fa;
    }
    .icon-option i {
      font-size: 20px;
      width: 30px;
      text-align: center;
      color: #667eea;
    }
    .code-output {
      background: #2d2d2d;
      color: #f8f8f2;
      padding: 20px;
      border-radius: 8px;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      overflow-x: auto;
      position: relative;
      max-height: 600px;
      overflow-y: auto;
    }
    .copy-btn {
      position: sticky;
      top: 10px;
      float: right;
      background: #667eea;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      z-index: 10;
    }
    .role-selector {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .role-btn {
      padding: 10px 20px;
      background: #e9ecef;
      border: 2px solid transparent;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s;
    }
    .role-btn.active {
      background: #667eea;
      color: white;
      border-color: #667eea;
    }
    .file-loader {
      background: #fff3cd;
      padding: 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      border: 2px solid #ffc107;
    }
    .file-loader input[type="file"] {
      margin-bottom: 10px;
    }
    .file-info {
      background: #d1ecf1;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 20px;
      border-left: 4px solid #17a2b8;
      font-size: 14px;
    }
    .alert {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 15px;
      font-size: 14px;
    }
    .alert-success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .alert-error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    @media (max-width: 968px) {
      .container {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <h1><i class="fas fa-chart-bar"></i> Dashboard JSON Editor</h1>
  <div class="container">
    <!-- Left Panel: Form -->
    <div class="panel">
      <div class="file-loader">
        <h3 style="margin-bottom: 10px;"><i class="fas fa-folder-open"></i> Load Dashboard Data</h3>
        <input type="file" id="fileInput" accept=".json" style="margin-bottom: 10px;">
        <button class="btn" onclick="loadFromFile()">Load JSON File</button>
        <p style="font-size: 12px; color: #666; margin-top: 10px;">Or it will load from: ../data/dashboard.json</p>
      </div>

      <div id="alertBox"></div>

      <div class="file-info" id="fileInfo" style="display: none;">
        <strong><i class="fas fa-file-alt"></i> Current File:</strong> <span id="fileName">None</span>
      </div>

      <h2>Select Dashboard</h2>
      <div class="role-selector">
        <button class="role-btn active" onclick="selectRole('student')">Student</button>
        <button class="role-btn" onclick="selectRole('teacher')">Teacher</button>
        <button class="role-btn" onclick="selectRole('admin')">Admin</button>
        <button class="role-btn" onclick="selectRole('webmaster')">Webmaster</button>
        <button class="role-btn" onclick="selectRole('parent')">Parent</button>
      </div>

      <h2 id="formTitle">Add New Link</h2>
      <form id="linkForm">
        <div class="form-group">
          <label for="linkTitle">Title</label>
          <input type="text" id="linkTitle" placeholder="e.g., View Profile" required>
        </div>
        
        <div class="form-group">
          <label for="linkDesc">Description</label>
          <textarea id="linkDesc" placeholder="e.g., Manage your personal information and settings." required></textarea>
        </div>
        
        <div class="form-group">
          <label for="linkUrl">Link (optional)</label>
          <input type="text" id="linkUrl" placeholder="e.g., profile.html">
        </div>
        
        <div class="form-group">
          <label for="iconSearch">Choose Icon</label>
          <input type="text" id="iconSearch" placeholder="Search icons... (e.g., user, book, cog)">
          <div id="iconDropdown" class="icon-dropdown" style="display: none;"></div>
        </div>
        
        <div class="icon-preview" id="iconPreview" style="display: none;">
          <i class="fas fa-link"></i>
          <span>No icon selected</span>
        </div>
        
        <button type="submit" class="btn" id="submitBtn"><i class="fas fa-plus"></i> Add Link</button>
        <button type="button" class="btn btn-secondary" id="cancelBtn" style="display: none;" onclick="cancelEdit()">Cancel</button>
      </form>
    </div>
    
    <!-- Right Panel: Current Links & JSON -->
    <div class="panel">
      <h2>Current Links - <span id="currentRole">Student</span></h2>
      <div class="dashboard-items" id="dashboardItems">
        <p style="text-align: center; color: #999; padding: 40px 0;">Load a JSON file to begin</p>
      </div>
      
      <h2 style="margin-top: 30px;">JSON Output</h2>
      <button class="btn btn-success" onclick="downloadJSON()" style="margin-bottom: 10px;"><i class="fas fa-download"></i> Download JSON File</button>
      <div class="code-output">
        <button class="copy-btn" onclick="copyJSON()"><i class="fas fa-copy"></i> Copy JSON</button>
        <pre id="jsonOutput">{}</pre>
      </div>
    </div>
  </div>

  <script>
    let dashboardData = {};
    let currentRole = 'student';
    let icons = [];
    let selectedIcon = 'fas fa-link';
    let editingIndex = -1;
    let currentFileName = 'dashboard.json';

    // Try to load from default path on page load
    window.addEventListener('load', () => {
      fetch('../data/dashboard.json')
        .then(response => {
          if (!response.ok) throw new Error('File not found');
          return response.json();
        })
        .then(data => {
          dashboardData = data;
          showAlert('<i class="fas fa-check-circle"></i> Loaded from ../data/dashboard.json', 'success');
          document.getElementById('fileInfo').style.display = 'block';
          document.getElementById('fileName').textContent = '../data/dashboard.json';
          updateDashboard();
          updateJSON();
        })
        .catch(() => {
          showAlert('<i class="fas fa-exclamation-triangle"></i> No default file found. Please load a JSON file or start fresh.', 'error');
        });
    });

    // Load Font Awesome icons
    fetch('../scripts/css/font-awesome.min.css')
      .then(response => response.text())
      .then(css => {
        const iconMatches = css.match(/\.fa-([a-z0-9-]+):before/g) || [];
        const iconSet = new Set();
        
        iconMatches.forEach(match => {
          const name = match.match(/fa-([a-z0-9-]+)/)[1];
          if (!name.match(/^(lg|2x|3x|4x|5x|fw|ul|li|border|pull|spin|pulse|rotate|flip|stack|inverse)$/)) {
            iconSet.add(`fas fa-${name}`);
          }
        });
        
        icons = Array.from(iconSet).sort();
        populateIconDropdown(icons);
      });

    function showAlert(message, type) {
      const alertBox = document.getElementById('alertBox');
      alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
      setTimeout(() => alertBox.innerHTML = '', 5000);
    }

    function loadFromFile() {
      const fileInput = document.getElementById('fileInput');
      const file = fileInput.files[0];
      
      if (!file) {
        showAlert('<i class="fas fa-times-circle"></i> Please select a file first', 'error');
        return;
      }
      
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          dashboardData = JSON.parse(e.target.result);
          currentFileName = file.name;
          document.getElementById('fileInfo').style.display = 'block';
          document.getElementById('fileName').textContent = file.name;
          showAlert(`<i class="fas fa-check-circle"></i> Successfully loaded ${file.name}`, 'success');
          updateDashboard();
          updateJSON();
        } catch (error) {
          showAlert('<i class="fas fa-times-circle"></i> Invalid JSON file', 'error');
        }
      };
      reader.readAsText(file);
    }

    function downloadJSON() {
      const jsonStr = JSON.stringify(dashboardData, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = currentFileName || 'dashboard.json';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showAlert(`<i class="fas fa-check-circle"></i> Downloaded ${currentFileName}`, 'success');
    }

    function populateIconDropdown(iconList) {
      const dropdown = document.getElementById('iconDropdown');
      dropdown.innerHTML = '';
      
      iconList.slice(0, 100).forEach(iconClass => {
        const option = document.createElement('div');
        option.className = 'icon-option';
        const iconName = iconClass.split(' fa-')[1];
        option.innerHTML = `<i class="${iconClass}"></i><span>${iconName}</span>`;
        option.onclick = () => selectIcon(iconClass);
        dropdown.appendChild(option);
      });
    }

    function selectIcon(iconClass) {
      selectedIcon = iconClass;
      const preview = document.getElementById('iconPreview');
      preview.style.display = 'flex';
      const iconName = iconClass.split(' fa-')[1];
      preview.innerHTML = `<i class="${iconClass}"></i><span>${iconName}</span>`;
      document.getElementById('iconDropdown').style.display = 'none';
      document.getElementById('iconSearch').value = iconName;
    }

    document.getElementById('iconSearch').addEventListener('input', (e) => {
      const search = e.target.value.toLowerCase();
      const dropdown = document.getElementById('iconDropdown');
      
      if (search.length > 0) {
        const filtered = icons.filter(icon => icon.includes(search));
        populateIconDropdown(filtered);
        dropdown.style.display = 'block';
      } else {
        dropdown.style.display = 'none';
      }
    });

    document.getElementById('iconSearch').addEventListener('focus', () => {
      if (icons.length > 0) document.getElementById('iconDropdown').style.display = 'block';
    });

    function selectRole(role) {
      currentRole = role;
      document.querySelectorAll('.role-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('currentRole').textContent = role.charAt(0).toUpperCase() + role.slice(1);
      updateDashboard();
    }

    function updateDashboard() {
      const container = document.getElementById('dashboardItems');
      const items = dashboardData[currentRole] || [];
      
      if (items.length === 0) {
        container.innerHTML = '<p style="text-align: center; color: #999; padding: 40px 0;">No links yet</p>';
        return;
      }
      
      container.innerHTML = items.map((item, index) => `
        <div class="dashboard-item">
          <div class="dashboard-item-header">
            <i class="${item.icon}"></i>
            <div class="dashboard-item-title">${item.title}</div>
          </div>
          <div class="dashboard-item-desc">${item.description}</div>
          ${item.link ? `<div class="dashboard-item-link">Link: ${item.link}</div>` : ''}
          <div class="item-actions">
            <button class="btn btn-small btn-edit" onclick="editItem(${index})">Edit</button>
            <button class="btn btn-small btn-delete" onclick="deleteItem(${index})">Delete</button>
          </div>
        </div>
      `).join('');
    }

    function editItem(index) {
      editingIndex = index;
      const item = dashboardData[currentRole][index];
      
      document.getElementById('linkTitle').value = item.title;
      document.getElementById('linkDesc').value = item.description;
      document.getElementById('linkUrl').value = item.link || '';
      
      selectedIcon = item.icon;
      const iconName = item.icon.split(' fa-')[1];
      document.getElementById('iconSearch').value = iconName;
      document.getElementById('iconPreview').style.display = 'flex';
      document.getElementById('iconPreview').innerHTML = `<i class="${item.icon}"></i><span>${iconName}</span>`;
      
      document.getElementById('formTitle').textContent = 'Edit Link';
      document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Save Changes';
      document.getElementById('cancelBtn').style.display = 'block';
      
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function deleteItem(index) {
      if (confirm('Are you sure you want to delete this link?')) {
        dashboardData[currentRole].splice(index, 1);
        updateDashboard();
        updateJSON();
        showAlert('<i class="fas fa-check-circle"></i> Link deleted', 'success');
      }
    }

    function cancelEdit() {
      editingIndex = -1;
      document.getElementById('linkForm').reset();
      document.getElementById('iconPreview').style.display = 'none';
      document.getElementById('formTitle').textContent = 'Add New Link';
      document.getElementById('submitBtn').innerHTML = '<i class="fas fa-plus"></i> Add Link';
      document.getElementById('cancelBtn').style.display = 'none';
    }

    document.getElementById('linkForm').addEventListener('submit', (e) => {
      e.preventDefault();
      
      const newItem = {
        title: document.getElementById('linkTitle').value,
        description: document.getElementById('linkDesc').value,
        icon: selectedIcon
      };
      
      const link = document.getElementById('linkUrl').value;
      if (link) newItem.link = link;
      
      if (editingIndex >= 0) {
        dashboardData[currentRole][editingIndex] = newItem;
        showAlert('<i class="fas fa-check-circle"></i> Link updated', 'success');
        cancelEdit();
      } else {
        if (!dashboardData[currentRole]) dashboardData[currentRole] = [];
        dashboardData[currentRole].push(newItem);
        showAlert('<i class="fas fa-check-circle"></i> Link added', 'success');
        document.getElementById('linkForm').reset();
        document.getElementById('iconPreview').style.display = 'none';
      }
      
      updateDashboard();
      updateJSON();
    });

    function updateJSON() {
      document.getElementById('jsonOutput').textContent = JSON.stringify(dashboardData, null, 2);
    }

    function copyJSON() {
      const json = document.getElementById('jsonOutput').textContent;
      navigator.clipboard.writeText(json).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.innerHTML = '<i class="fas fa-check"></i> Copied!';
        setTimeout(() => btn.innerHTML = '<i class="fas fa-copy"></i> Copy JSON', 2000);
      });
    }
  </script>
</body>
</html>
