<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>401 - Unauthorized Access</title>
    <style>
        :root {
            --road: #444;
            --car-body: #d32f2f;
            --car-window: #81d4fa;
            --streetlight-on: #fec009; /* UPDATED: Specific yellow color */
            --streetlight-off: #555;   /* Dark color for when the bulb is off */
            --smoke: #bdc3c7;
            --bg: #2c3e50;
            --animation-duration: 8s; /* Slightly shorter for better pacing */
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            margin: 0;
            background-color: var(--bg);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* --- THE SCENE --- */
        .scene {
            width: 100%;
            height: 100%;
            position: relative;
        }
        
        .road {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30vh;
            background-color: var(--road);
            border-top: 10px solid #666;
        }

        .lane-line {
            position: absolute;
            left: 0;
            top: 50%;
            width: 100%;
            height: 8px;
            background: repeating-linear-gradient(to right,
                #ccc,
                #ccc 40px,
                transparent 40px,
                transparent 80px
            );
        }

        /* --- THE ACTORS --- */
        .streetlight {
            position: absolute;
            left: 65%;
            bottom: 30vh;
            width: 20px;
            height: 40vh;
            background: linear-gradient(#555, #888);
            border-radius: 5px 5px 0 0;
            transform-origin: bottom center;
            animation: streetlight-wobble var(--animation-duration) forwards ease-in-out;
        }
        .streetlight::after { /* The lamp housing */
            content: '';
            position: absolute;
            top: -30px;
            left: -30px;
            width: 80px;
            height: 40px;
            background-color: #555;
            border-radius: 5px;
        }
        /* --- MODIFIED: The bulb itself --- */
        .streetlight::before {
            content: '';
            position: absolute;
            top: -25px;
            left: 20px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            /* Initial "ON" state */
            background-color: var(--streetlight-on);
            box-shadow: 0 0 20px var(--streetlight-on);
            transition: background-color 0.1s, box-shadow 0.1s; /* Smooths the flicker slightly */
        }
        
        /* --- NEW: Trigger the bulb flicker only after the crash --- */
        .scene.crashed .streetlight::before {
            animation: bulb-flicker 6s infinite linear;
        }

        .car-container {
            position: absolute;
            left: -200px;
            bottom: 22vh;
            width: 200px;
            height: 100px;
            animation: drive-and-crash var(--animation-duration) forwards linear;
            z-index: 10;
        }
        .car { position: relative; width: 100%; height: 100%; }
        .car-body {
            position: absolute;
            bottom: 20px;
            width: 200px;
            height: 60px;
            background-color: var(--car-body);
            border-radius: 20px 20px 5px 5px;
        }
        .car-body::before { /* Roof */
            content: ''; position: absolute; top: -30px; left: 40px;
            width: 120px; height: 40px; background-color: var(--car-body); border-radius: 10px 10px 0 0;
        }
        .car-body::after { /* Window */
             content: ''; position: absolute; top: -25px; left: 45px;
             width: 110px; height: 30px; background-color: var(--car-window); border-radius: 5px;
        }
        .wheel {
            position: absolute; bottom: 0; width: 40px; height: 40px;
            background-color: #333; border-radius: 50%; border: 5px solid #555;
            animation: rotate-wheels 0.5s infinite linear;
        }
        .wheel.front { right: 20px; }
        .wheel.back { left: 20px; }
        .scene.crashed .wheel {
            animation-play-state: paused; /* Stop the wheels on crash */
        }

        /* Smoke effect */
        .smoke {
            position: absolute; top: 10px; left: 160px; width: 20px; height: 20px;
            background-color: var(--smoke); border-radius: 50%; opacity: 0;
            animation: smoke-puff 3s forwards ease-out;
        }
        /* --- MODIFIED: Delays are now based on the scene's .crashed state --- */
        .scene.crashed .smoke.puff-1 { animation-delay: 0s; }
        .scene.crashed .smoke.puff-2 { animation-delay: 0.5s; }
        .scene.crashed .smoke.puff-3 { animation-delay: 1s; }
        .scene.crashed .smoke.puff-4 { animation-delay: 1.5s; }

        /* Text & Button */
        .text-box {
            position: absolute; top: 20%; left: 50%; transform: translateX(-50%);
            text-align: center; color: white; opacity: 0;
            animation: show-text 2s forwards ease-out;
            animation-delay: calc(var(--animation-duration) * 0.8); /* Show text later */
        }
        .text-box h1 {
            font-size: 15rem; margin: 0; color: #e74c3c;
            text-shadow: 5px 5px 0px #c0392b;
        }
        .text-box p { font-size: 2rem; margin: 0; }
        .home-btn {
            display: inline-block; margin-top: 30px; padding: 15px 30px;
            background-color: var(--streetlight-on); color: #333; text-decoration: none;
            font-weight: bold; border-radius: 10px; transition: background-color 0.3s;
        }
        .home-btn:hover { background-color: #f39c12; }

        /* --- KEYFRAME ANIMATIONS --- */
        @keyframes drive-and-crash {
            0% { transform: translateX(0); }
            60% { transform: translateX(calc(65vw - 100px)); }
            61% { transform: translateX(calc(65vw - 105px)) rotate(-2deg); }
            100% { transform: translateX(calc(65vw - 105px)) rotate(-2deg); }
        }
        @keyframes rotate-wheels { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes streetlight-wobble {
            0%, 60% { transform: rotate(0deg); }
            61% { transform: rotate(15deg); }
            65% { transform: rotate(-10deg); }
            70% { transform: rotate(5deg); }
            75% { transform: rotate(-2deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes smoke-puff {
             0% { opacity: 0; transform: translateY(0) scale(0.5); }
             10% { opacity: 0.7; }
             100% { opacity: 0; transform: translateY(-80px) scale(2.5); }
        }
        @keyframes show-text { from { opacity: 0; transform: translate(-50%, 20px); } to { opacity: 1; transform: translate(-50%, 0); } }

        /* --- NEW: The complex bulb flicker animation (6-second cycle) --- */
        @keyframes bulb-flicker {
            /* --- Two Slow Blinks --- */
            0%, 8.2% { background-color: var(--streetlight-on); box-shadow: 0 0 20px var(--streetlight-on); }
            4.1%, 12.4% { background-color: var(--streetlight-off); box-shadow: none; }
            
            /* --- 1 Second Off --- */
            16.6%, 33.2% { background-color: var(--streetlight-off); box-shadow: none; }
            
            /* --- Five Rapid Blinks over 2 seconds --- */
            33.3%, 36.5% { background-color: var(--streetlight-on); box-shadow: 0 0 20px var(--streetlight-on); }
            39.8%, 43% { background-color: var(--streetlight-on); box-shadow: 0 0 20px var(--streetlight-on); }
            46.5%, 49.8% { background-color: var(--streetlight-on); box-shadow: 0 0 20px var(--streetlight-on); }
            53.1%, 56.4% { background-color: var(--streetlight-on); box-shadow: 0 0 20px var(--streetlight-on); }
            59.7%, 62% { background-color: var(--streetlight-on); box-shadow: 0 0 20px var(--streetlight-on); }
            
            36.6%, 39.7% { background-color: var(--streetlight-off); box-shadow: none; }
            43.1%, 46.4% { background-color: var(--streetlight-off); box-shadow: none; }
            49.9%, 53% { background-color: var(--streetlight-off); box-shadow: none; }
            56.5%, 59.6% { background-color: var(--streetlight-off); box-shadow: none; }
            62.1%, 66.5% { background-color: var(--streetlight-off); box-shadow: none; }

            /* --- Solid ON for 2 seconds --- */
            66.6%, 100% { background-color: var(--streetlight-on); box-shadow: 0 0 20px var(--streetlight-on); }
        }

    </style>
</head>
<body>

    <div class="scene">
        <div class="road">
            <div class="lane-line"></div>
        </div>
        
        <div class="streetlight"></div>

        <div class="car-container">
            <div class="car">
                <div class="car-body"></div>
                <div class="wheel front"></div>
                <div class="wheel back"></div>
                <div class="smoke puff-1"></div>
                <div class="smoke puff-2"></div>
                <div class="smoke puff-3"></div>
                <div class="smoke puff-4"></div>
            </div>
        </div>

        <div class="text-box">
            <h1>401</h1>
            <p>Unauthorized Access... You've hit a dead end.</p>
            <a onclick="location.href='401-id.html'"class="home-btn">Back to Safety</a>
        </div>
    </div>

    <!-- NEW: JavaScript to trigger the post-crash effects -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const carContainer = document.querySelector('.car-container');
            const scene = document.querySelector('.scene');

            // Listen for the car's main animation to finish
            carContainer.addEventListener('animationend', () => {
                // Add the 'crashed' class to the main scene container
                // This will trigger the wheel stoppage, smoke, and bulb flicker via CSS
                scene.classList.add('crashed');
            });
        });
    </script>

</body>
</html>
