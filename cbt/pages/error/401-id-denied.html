<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>401 - Access Denied</title>
    <style>
        :root {
            --bg-color: #1a202c;
            --scan-blue: #63b3ed;
            --denied-red: #e53e3e;
            --text-light: #edf2f7;
            --animation-duration: 8s;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- BACKGROUND BLOBS for effect --- */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            animation: float 20s infinite alternate;
        }
        .blob.one {
            width: 300px; height: 300px;
            background-color: rgba(99, 179, 237, 0.3);
            top: -50px; left: -100px;
            animation-duration: 25s;
        }
        .blob.two {
            width: 250px; height: 250px;
            background-color: rgba(229, 62, 62, 0.3);
            bottom: -50px; right: -80px;
            animation-duration: 18s;
            animation-delay: -5s;
        }

        /* --- THE GLASSCARD --- */
        .glass-card {
            width: 380px;
            height: 550px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px); /* For Safari */
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding: 20px;
        }

        /* --- THE ID CARD --- */
        .id-card {
            width: 80px;
            height: 120px;
            background: var(--text-light);
            border-radius: 10px;
            position: absolute;
            top: 50%;
            left: 50%;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            animation: card-animation var(--animation-duration) forwards ease-in-out;
            z-index: 10;
        }
        .id-card::before { /* Blue header */
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 25px;
            background-color: #4299e1;
            border-radius: 10px 10px 0 0;
        }
        .id-card::after { /* Photo and text lines */
            content: '';
            position: absolute;
            top: 35px; left: 10px;
            width: 30px; height: 30px;
            background-color: #a0aec0;
            border-radius: 3px;
            box-shadow: 35px 5px 0 0 #a0aec0, 
                        35px 15px 0 0 #a0aec0;
        }

        /* --- THE SCANNER --- */
        .scanner {
            width: 250px;
            height: 150px;
            background-color: #2d3748;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .scanner-screen {
            width: 180px;
            height: 60px;
            background-color: #1a202c;
            border-radius: 5px;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.2em;
            font-weight: bold;
            letter-spacing: 2px;
            text-shadow: 0 0 5px currentColor;
            animation: screen-flash var(--animation-duration) forwards ease-in-out;
        }
        .scanner-screen::after { /* The text content */
            content: 'AWAITING ID';
            animation: scanner-status var(--animation-duration) forwards;
        }
        .scanner-slot {
            width: 130px;
            height: 10px;
            background-color: #1a202c;
            margin-top: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px var(--scan-blue);
        }

        /* --- FINAL ERROR MESSAGE --- */
        .error-message {
            position: absolute;
            top: 50px;
            text-align: center;
            color: var(--text-light);
            opacity: 0;
            animation: final-text-fade-in var(--animation-duration) forwards ease-out;
        }
        .error-message h1 {
            font-size: 8em;
            margin: 0;
            color: var(--denied-red);
            text-shadow: 0 0 15px var(--denied-red);
        }
        .error-message p {
            font-size: 1.2em;
            margin-top: -10px;
        }
        .home-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background: rgba(255, 255, 255, 0.2);
            color: var(--text-light);
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: background-color 0.3s;
        }
        .home-btn:hover {
            background-color: rgba(255, 255, 255, 0.3);
        }

        /* --- KEYFRAME ANIMATIONS --- */
        
        @keyframes float {
            to { transform: translateY(30px) translateX(-30px); }
        }

        @keyframes card-animation {
            0% {
                transform: translate(-50%, -50%) scale(3);
                opacity: 1;
            }
            38% {
                transform: translate(-50%, -50%) scale(3);
                opacity: 1;
            }
            50% {
                /* Shrinks and moves to the slot */
                transform: translate(-50%, 260px) scale(1);
                opacity: 1;
            }
            60% {
                /* Fully inserted and hidden */
                transform: translate(-50%, 280px) scale(1);
                opacity: 0;
            }
            100% {
                transform: translate(-50%, 280px) scale(1);
                opacity: 0;
            }
        }
        
        @keyframes scanner-status {
            0%, 60% {
                content: 'AWAITING ID';
                color: rgba(255,255,255,0.5);
            }
            61%, 85% {
                /* Scans for 2 seconds (16% of 8s is ~1.3s, close enough) */
                content: 'SCANNING...';
                color: var(--scan-blue);
            }
            86%, 100% {
                content: 'ACCESS DENIED';
                color: var(--denied-red);
            }
        }

        @keyframes screen-flash {
            0%, 60% { background-color: #1a202c; }
            61%, 85% { background-color: #1a202c; }
            86% { background-color: var(--denied-red); }
            87%, 100% { background-color: #1a202c; }
        }

        @keyframes final-text-fade-in {
            0%, 88% {
                opacity: 0;
                transform: translateY(20px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="blob one"></div>
    <div class="blob two"></div>

    <div class="glass-card">
        
        <div class="error-message">
            <h1>401</h1>
            <p>ACCESS DENIED</p>
            <a onclick="location.href='../gamehall.html'" class="home-btn">Try Again</a>
        </div>

        <div class="id-card"></div>

        <div class="scanner">
            <div class="scanner-screen"></div>
            <div class="scanner-slot"></div>
        </div>
        
    </div>

</body>
</html>
