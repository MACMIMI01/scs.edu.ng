<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - TestHall</title>
  <!-- CORRECTED FAVICON PATH -->
  <link rel="icon" type="image/png" href="../assets/images/favicon.ico"> 
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      background-size: cover;
      background-position: center;
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: background-image 1s ease-in-out;
      color: #333;
    }
    header {
        width: 100%;
        background-color: rgba(0, 0, 0, 0.7);
        padding: 10px 20px;
        position: fixed;
        top: 0;
        left: 0;
        z-index: 1000;
        box-sizing: border-box;
    }
    header nav ul {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: flex-end;
        align-items: center;
    }
    header nav ul li {
        margin-left: 20px;
    }
    header nav ul li a {
        color: #fff;
        text-decoration: none;
        font-weight: bold;
        transition: color 0.3s ease;
    }
    header nav ul li a:hover {
        color: #F8E231;
    }
    header .logo {
        height: 40px;
        border-radius: 50%;
        margin-right: auto;
    }
    #logout-button {
        background-color: #dc3545;
        color: #fff;
        padding: 8px 15px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 0.9em;
    }
    #logout-button:hover {
        background-color: #c82333;
    }
    .login-form, .welcome-section {
      width: 90%;
      max-width: 400px;
      margin: 20px auto;
      padding: 30px;
      background-color: rgba(255, 255, 255, 0.9);
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      box-sizing: border-box;
    }
    .login-form h2 {
        color: #1877f2;
        margin-bottom: 20px;
    }
    .login-form label {
        display: block;
        text-align: left;
        margin-bottom: 8px;
        font-weight: bold;
        color: #555;
    }
    .login-form input[type="text"],
    .login-form input[type="password"] {
        width: 100%;
        padding: 10px;
        margin-bottom: 15px;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 1em;
        box-sizing: border-box;
    }
    .login-form input[type="submit"],
    .welcome-section button {
      background-color: #1877f2;
      color: #fff;
      padding: 12px 25px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1.1em;
      transition: background-color 0.3s ease;
      width: 100%;
    }
    .login-form input[type="submit"]:hover,
    .welcome-section button:hover {
      background-color: #145cb3;
    }
    .show-password-container {
        display: flex;
        align-items: center;
        margin-bottom: 15px;
    }
    .show-password-container input[type="checkbox"] {
        margin-right: 8px;
    }
    .welcome-section h1 {
        color: #28a745;
        margin-bottom: 20px;
    }
  </style>
</head>
<body>
  <header id="header" style="display: none;">
    <nav>
      <ul>
        <!-- CORRECTED LOGO PATH -->
        <li><a href="dashboard.html"><img src="../assets/images/logo.png" alt="TestHall Logo" class="logo"></a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="test-library.html">Test Library</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li><button id="logout-button">Logout</button></li>
      </ul>
    </nav>
  </header>

  <div class="login-form" id="login-form-section" style="display: none;">
    <form id="login-form">
      <h2>Login to TestHall</h2>
      <label for="username">Username:</label>
      <input type="text" id="username" name="username" required><br>
      <label for="password">Password:</label>
      <input type="password" id="password" name="password" required>
      <div class="show-password-container">
        <input type="checkbox" id="show-password">
        <label for="show-password" style="display: inline; font-weight: normal;">Show Password</label>
      </div>
      <input type="submit" value="Login">
    </form>
  </div>

  <div class="welcome-section" id="welcome-section" style="display: none;">
    <h1>Welcome, <span id="welcome-username"></span>!</h1>
    <p>You have successfully logged in.</p>
    <button onclick="window.location.href='dashboard.html'">Go to Dashboard</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {

        const loginFormSection = document.getElementById('login-form-section');
        const welcomeSection = document.getElementById('welcome-section');
        const header = document.getElementById('header');
        const logoutButton = document.getElementById('logout-button');
        const showPasswordCheckbox = document.getElementById('show-password');
        const loginForm = document.getElementById('login-form');
        const welcomeUsernameSpan = document.getElementById('welcome-username');

        const loggedInUserId = localStorage.getItem('loggedInUserId');
        const loggedInUsername = localStorage.getItem('loggedInUsername');

        if (loggedInUserId && loggedInUsername) {
            loginFormSection.style.display = 'none';
            welcomeUsernameSpan.textContent = loggedInUsername;
            welcomeSection.style.display = 'block';
            header.style.display = 'block';
        } else {
            loginFormSection.style.display = 'block';
            welcomeSection.style.display = 'none';
            header.style.display = 'none';
        }

        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault();
            const usernameInput = document.getElementById('username').value.trim();
            const passwordInput = document.getElementById('password').value.trim();

            if (!usernameInput || !passwordInput) {
                alert('Please fill in both username and password.');
                return;
            }

            try {
                // CORRECTED FETCH PATH
                const response = await fetch('../data/users.json'); 
                
                if (!response.ok) {
                    throw new Error(`Could not load user data. Status: ${response.status}`);
                }

                const users = await response.json();
                const user = users.find(u => u.username === usernameInput && u.password === passwordInput);

                if (user) {
                    localStorage.setItem('loggedInUserId', user.id);
                    localStorage.setItem('loggedInUserRole', user.role);
                    localStorage.setItem('loggedInUsername', user.name || user.username);

                    welcomeUsernameSpan.textContent = user.name || user.username;
                    loginFormSection.style.display = 'none';
                    welcomeSection.style.display = 'block';
                    header.style.display = 'block';

                } else {
                    alert('Invalid username or password.');
                }
            } catch (error) {
                console.error('Login process error:', error);
                alert('An error occurred during login. Please check the console for details.');
            }
        });

        logoutButton.addEventListener('click', () => {
            localStorage.clear(); // Use clear() for a more robust logout
            alert('You have been logged out.');
            window.location.reload();
        });

        showPasswordCheckbox.addEventListener('change', function() {
            const passwordField = document.getElementById('password');
            passwordField.type = this.checked ? 'text' : 'password';
        });

        // --- BACKGROUND IMAGE ROTATION WITH CORRECTED PATHS ---
        const backgroundImages = [
            '../assets/images/background/bg01.jpg', '../assets/images/background/bg02.jpg',
            '../assets/images/background/bg03.jpg', '../assets/images/background/bg04.jpg',
            '../assets/images/background/bg05.jpg', '../assets/images/background/bg06.jpg',
            '../assets/images/background/bg07.jpg', '../assets/images/background/bg08.jpg',
            '../assets/images/background/bg09.jpg', '../assets/images/background/bg10.jpg',
            '../assets/images/background/bg11.jpg', '../assets/images/background/bg12.jpg',
            '../assets/images/background/bg13.jpg', '../assets/images/background/bg14.jpg',
            '../assets/images/background/bg15.jpg', '../assets/images/background/bg16.jpg'
        ];

        backgroundImages.forEach(src => { new Image().src = src; });

        let currentIndex = Math.floor(Math.random() * backgroundImages.length);
        document.body.style.backgroundImage = `url('${backgroundImages[currentIndex]}')`;

        setInterval(() => {
            currentIndex = (currentIndex + 1) % backgroundImages.length;
            document.body.style.backgroundImage = `url('${backgroundImages[currentIndex]}')`;
        }, 5000);
    });
  </script>
</body>
</html>
