    <style>
        :root {
            --primary: #2563eb;
            --secondary: #64748b;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            margin: 0;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 { color: #1e293b; margin-bottom: 5px; }
        p { color: var(--secondary); margin-top: 0; }

        /* Container for grids */
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* NAVIGATION / BACK BUTTON */
        #nav-controls {
            display: none; /* Hidden by default */
            margin-bottom: 20px;
        }

        .btn-back {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-back:hover { opacity: 0.9; }

        /* GRIDS */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        /* CARDS */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        /* Class Card Specifics */
        .class-icon {
            font-size: 40px;
            margin-bottom: 15px;
            color: var(--primary);
        }
        .class-title {
            font-weight: bold;
            font-size: 1.2rem;
            color: #334155;
        }
        .class-code {
            background: #e2e8f0;
            padding: 4px 10px;
            border-radius: 15px;
            font-size: 0.8rem;
            margin-top: 10px;
            color: #475569;
        }

        /* Student Card Specifics */
        .student-card {
            cursor: default; /* Students aren't clickable yet */
        }
        .student-card:hover { transform: none; }
        
        .avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            background-color: #ddd;
            margin-bottom: 15px;
            border: 3px solid var(--primary);
        }

        .student-name {
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 5px;
            text-transform: capitalize;
        }
        
        .student-role {
            font-size: 0.85rem;
            color: var(--secondary);
            font-style: italic;
        }

        .details-badge {
            margin-top: 10px;
            font-size: 0.75rem;
            background-color: #dbeafe;
            color: #1e40af;
            padding: 4px 8px;
            border-radius: 4px;
        }

        /* Utilities */
        .hidden { display: none; }

    </style>

        // Helper to check if user is a student (ignoring Teachers and Webmasters)
        function isStudent(user) {
            const r = user.role.toLowerCase();
            return !r.includes('teacher') && !r.includes('webmaster') && !r.includes('parent');
        }

        // 2. EXTRACT UNIQUE CLASSES
        // We only want classes that actually have students in them
        const classMap = new Map();

        dbData.forEach(user => {
            if (isStudent(user) && user.classid) {
                if (!classMap.has(user.classid)) {
                    classMap.set(user.classid, user.class); // key: SS1, value: Senior Class One
                }
            }
        });

        // 3. RENDER CLASS LIST
        const classGrid = document.getElementById('class-grid');
        const studentGrid = document.getElementById('student-grid');
        const navControls = document.getElementById('nav-controls');
        const title = document.getElementById('page-title');
        const subtitle = document.getElementById('page-subtitle');

        function renderClasses() {
            classGrid.innerHTML = '';
            
            // Sort classes alphabetically
            const sortedClasses = Array.from(classMap.entries()).sort();

            sortedClasses.forEach(([id, name]) => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => showStudents(id, name);

                const count = dbData.filter(u => u.classid === id && isStudent(u)).length;

                card.innerHTML = `
                    <div class="class-icon">🏫</div>
                    <div class="class-title">${name}</div>
                    <div class="class-code">${id} &bull; ${count} Students</div>
                `;
                classGrid.appendChild(card);
            });
        }

        // 4. SHOW STUDENTS
        function showStudents(classId, className) {
            // Filter students for this class
            const students = dbData.filter(u => u.classid === classId && isStudent(u));
            
            // Hide class grid, show student grid
            classGrid.classList.add('hidden');
            studentGrid.classList.remove('hidden');
            navControls.style.display = 'block';
            
            // Update Headers
            title.innerText = className;
            subtitle.innerText = `Showing ${students.length} students in ${classId}`;

            // Render Student Cards
            studentGrid.innerHTML = '';
            students.forEach(student => {
                const sCard = document.createElement('div');
                sCard.className = 'card student-card';
                
                // Fallback image if the path provided doesn't exist
                const imgSrc = student.profilePicture || 'https://via.placeholder.com/150';

                // Check if they have extra details (like Math Champion)
                const detailsBadge = student.details 
                    ? `<div class="details-badge">${student.details}</div>` 
                    : '';

                sCard.innerHTML = `
                    <img src="${imgSrc}" class="avatar" alt="${student.name}" onerror="this.src='https://via.placeholder.com/150?text=Student'">
                    <div class="student-name">${student.name.toLowerCase()}</div>
                    <div class="student-role">${student.role}</div>
                    ${detailsBadge}
                `;
                studentGrid.appendChild(sCard);
            });
        }

        // 5. BACK BUTTON
        function showClassList() {
            studentGrid.classList.add('hidden');
            classGrid.classList.remove('hidden');
            navControls.style.display = 'none';
            title.innerText = "Class Directory";
            subtitle.innerText = "Select a class to view students";
        }

        // Initialize view
        renderClasses();

    </script>
