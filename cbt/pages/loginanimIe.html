<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nursery Login | SCS CBT</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/meyer-reset/2.0/reset.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.2/css/all.min.css" />
    <style>
    @import url("https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;500;600;700&display=swap");
    * { box-sizing: border-box; text-transform: capitalize; font-family: "Poppins", sans-serif; }
    body { width: 100vw; height: 100vh; overflow: hidden; }
    .container { position: relative; top: 50%; left: 50%; display: inline-block; width: 100vw; height: 100vh; border-radius: 3px; transform: translate(-50%, -50%); overflow: hidden; background-image: linear-gradient(to top right, #f9a743, #f9db5f); }
    .container .ear { position: absolute; top: -110px; width: 200px; height: 200px; border-radius: 50%; background-color: #243946; }
    .container .ear.ear--left { left: -135px; }
    .container .ear.ear--right { right: -135px; }
    .container .face { display: flex; flex-direction: column; align-items: center; width: 200px; height: 150px; margin: 80px auto 10px; --rotate-head: 0deg; transform: rotate(var(--rotate-head)); transition: transform 0.2s; transform-origin: center 20px; }
    .container .eye { display: inline-block; width: 25px; height: 25px; border-radius: 50%; background-color: #243946; }
    .container .eye.eye--left { margin-right: 40px; }
    .container .eye.eye--right { margin-left: 40px; }
    .container .eye .glow { position: relative; top: 3px; right: -12px; width: 12px; height: 6px; border-radius: 50%; background-color: #fff; transform: rotate(38deg); }
    .container .nose { position: relative; top: 30px; transform: scale(1.1); }
    .container .nose .glow { position: absolute; top: 3px; left: 32%; width: 15px; height: 8px; border-radius: 50%; background-color: #476375; }
    .container .mouth { position: relative; margin-top: 45px; }
    .container svg.smile { position: absolute; left: -28px; top: -19px; transform: scaleX(1.1); stroke: #243946; }
    .container .mouth-hole { position: absolute; top: 0; left: -50%; width: 60px; height: 15px; border-radius: 50%/100% 100% 0% 0; transform: rotate(180deg); background-color: #243946; z-index: -1; }
    .container .tongue { position: relative; top: 5px; width: 30px; height: 20px; background-color: #ffd7dd; transform-origin: top; transform: rotateX(60deg); }
    .container .tongue.breath { animation: breath 0.3s infinite linear; }
    .container .tongue-top { position: absolute; bottom: -15px; width: 30px; height: 30px; border-radius: 15px; background-color: #ffd7dd; }
    .container .line { position: absolute; top: 0; width: 30px; height: 5px; background-color: #fcb7bf; }
    .container .median { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 4px; height: 25px; border-radius: 5px; background-color: #fcb7bf; }
    .container .hands { position: relative; }
    .container .hands .hand { position: absolute; top: -3px; display: flex; transition: transform 0.5s ease-in-out; z-index: 1; }
    .container .hands .hand--left { left: -85px; }
    .container .hands .hand--left.hide { transform: translate(2px, -155px) rotate(-160deg); }
    .container .hands .hand--left.peek { transform: translate(0px, -120px) rotate(-160deg); }
    .container .hands .hand--right { left: 30px; }
    .container .hands .hand--right.hide { transform: translate(-6px, -155px) rotate(160deg); }
    .container .hands .hand--right.peek { transform: translate(-4px, -120px) rotate(160deg); }
    .container .hands .finger { position: relative; z-index: 0; }
    .container .hands .finger .bone { width: 20px; height: 20px; border: 2px solid #243946; border-bottom: none; border-top: none; background-color: #fac555; }
    .container .hands .finger .nail { position: absolute; left: 0; top: 10px; width: 20px; height: 18px; border-radius: 50%; border: 2px solid #243946; background-color: #fac555; z-index: -1; }
    .container .hands .finger:nth-child(1), .container .hands .finger:nth-child(3) { left: 4px; z-index: 1; }
    .container .hands .finger:nth-child(1) .bone, .container .hands .finger:nth-child(3) .bone { height: 10px; }
    .container .hands .finger:nth-child(3) { left: -4px; }
    .container .hands .finger:nth-child(2) { top: -5px; z-index: 2; }
    .container .hands .finger:nth-child(1) .nail, .container .hands .finger:nth-child(3) .nail { top: 0px; }
    .container .tengah { display: flex; justify-content: center; align-items: center; text-align: center; }
    .container .login { position: relative; display: flex; flex-direction: column; width: 80%; max-width: 300px; /* Added max-width */ }
    .container .login label { position: relative; display: block; width: 100%; background-color: #fff; border: 1px solid #ced4da; border-radius: 10px; margin: 1px; padding: 0; }
    .container .login label .fas { position: absolute; top: 50%; transform: translateY(-50%); left: 15px; font-size: 1.2rem; }
    .container .login input { width: 100%; height: 45px; /* Increased height */ border: none; border-radius: 10px; font-size: 1rem; padding-left: 45px; /* Space for icon */ padding-right: 15px; }
    .container .login input::-moz-placeholder { color: #ccc; }
    .container .login input::placeholder { color: #ccc; }
    .container .login .password-button { position: absolute; top: 50%; transform: translateY(-50%); right: 10px; display: flex; justify-content: center; align-items: center; width: 70px; /* Adjusted width */ height: 27px; border-radius: 10px; border: none; background-color: #243946; color: #fff; cursor: pointer; }
    .container .login .password-button:active { transform: translateY(-50%) scale(0.95); }
    .container .login .login-button { width: 100%; height: 45px; /* Increased height */ margin: 20px 0px 0px; border: none; border-radius: 10px; font-size: 1rem; background-color: #243946; color: #fff; transition: transform 0.1s, background-color 0.2s; cursor: pointer; }
    .container .login .login-button:active { transform: scale(0.95); }
    .container .login .login-button:hover { background-color: #495e6b; }
    .container .footer { text-align: center; margin-top: 15px; font-size: 1rem; }
    .container .footer .footer-a { color: #243946; text-decoration: none; transition: all 0.2s ease-in-out 0.1s; }
    .container .footer .footer-a:hover { color: #fff; }
    @keyframes breath { 0%, 100% { transform: rotateX(0deg); } 50% { transform: rotateX(60deg); } }
    @media screen and (max-width: 600px) {
      .container .face { margin-top: 40px; transform: scale(0.8); }
      .container .login { transform: scale(0.9); }
      .container .footer { font-size: 0.9rem; }
    }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="ear ear--left"></div>
      <div class="ear ear--right"></div>
      <div class="face">
        <div class="eyes">
          <div class="eye eye--left"><div class="glow"></div></div>
          <div class="eye eye--right"><div class="glow"></div></div>
        </div>
        <div class="nose">
          <svg width="38.161" height="22.03"><path d="M2.017 10.987Q-.563 7.513.157 4.754C.877 1.994 2.976.135 6.164.093 16.4-.04 22.293-.022 32.048.093c3.501.042 5.48 2.081 6.02 4.661q.54 2.579-2.051 6.233-8.612 10.979-16.664 11.043-8.053.063-17.336-11.043z" fill="#243946"></path></svg>
          <div class="glow"></div>
        </div>
        <div class="mouth">
          <svg class="smile" viewBox="-2 -2 84 23" width="84" height="23"><path d="M0 0c3.76 9.279 9.69 18.98 26.712 19.238 17.022.258 10.72.258 28 0S75.959 9.182 79.987.161" fill="none" stroke-width="3" stroke-linecap="square" stroke-miterlimit="3"></path></svg>
          <div class="mouth-hole"></div>
          <div class="tongue breath"><div class="tongue-top"></div><div class="line"></div><div class="median"></div></div>
        </div>
      </div>
      <div class="tengah">
        <div class="hands">
          <div class="hand hand--left"><div class="finger"><div class="bone"></div><div class="nail"></div></div><div class="finger"><div class="bone"></div><div class="nail"></div></div><div class="finger"><div class="bone"></div><div class="nail"></div></div></div>
          <div class="hand hand--right"><div class="finger"><div class="bone"></div><div class="nail"></div></div><div class="finger"><div class="bone"></div><div class="nail"></div></div><div class="finger"><div class="bone"></div><div class="nail"></div></div></div>
        </div>
      </div>
      
      <div class="tengah">
        <form id="login-form">
            <div class="login">
                <label>
                    <div class="fas fa-user"></div>
                    <input id="username" class="username" type="text" autocomplete="on" placeholder="Username" required />
                </label>
                <label>
                    <div class="fas fa-lock"></div>
                    <input id="password" class="password" type="password" autocomplete="off" placeholder="Password" required />
                    <button type="button" class="password-button">show</button>
                </label>
                <button type="submit" class="login-button">Sign In</button>
            </div>
        </form>
    </div>

      <div class="footer">
        <p>
          Don't have an account yet?
          <a class="footer-a" href="#">Sign Up</a> <!-- Changed href to # to prevent page reload -->
        </p>
      </div>
    </div>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lodash.js/4.17.5/lodash.min.js"></script>
    <script>
    document.addEventListener("DOMContentLoaded", () => {
        // --- Get all necessary elements from the page ---
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const showPasswordButton = document.querySelector(".password-button");
        const face = document.querySelector(".face");
        const loginForm = document.getElementById('login-form');

        // =======================================================
        //  SECTION 1: ORIGINAL ANIMATION LOGIC (UNCHANGED)
        //  This code handles all the cute dog animations.
        // =======================================================
        passwordInput.addEventListener("focus", () => {
            document.querySelectorAll(".hand").forEach(hand => hand.classList.add("hide"));
            document.querySelector(".tongue").classList.remove("breath");
        });

        passwordInput.addEventListener("blur", () => {
            document.querySelectorAll(".hand").forEach(hand => {
                hand.classList.remove("hide");
                hand.classList.remove("peek");
            });
            document.querySelector(".tongue").classList.add("breath");
        });

        usernameInput.addEventListener("focus", () => {
            let length = Math.min(usernameInput.value.length - 16, 19);
            document.querySelectorAll(".hand").forEach(hand => {
                hand.classList.remove("hide");
                hand.classList.remove("peek");
            });
            face.style.setProperty("--rotate-head", `${-length}deg`);
        });

        usernameInput.addEventListener("blur", () => {
            face.style.setProperty("--rotate-head", "0deg");
        });

        usernameInput.addEventListener("input", _.throttle((event) => {
            let length = Math.min(event.target.value.length - 16, 19);
            face.style.setProperty("--rotate-head", `${-length}deg`);
        }, 100));

        showPasswordButton.addEventListener("click", (event) => {
            event.preventDefault(); // Use preventDefault to stop form submission
            if (passwordInput.type === "password") {
                passwordInput.type = "text";
                showPasswordButton.textContent = "hide"; // Change button text
                document.querySelectorAll(".hand").forEach(hand => {
                    hand.classList.remove("hide");
                    hand.classList.add("peek");
                });
            } else {
                passwordInput.type = "password";
                showPasswordButton.textContent = "show"; // Change button text back
                document.querySelectorAll(".hand").forEach(hand => {
                    hand.classList.remove("peek");
                    hand.classList.add("hide");
                });
            }
        });

        // =======================================================
        //  SECTION 2: INTEGRATED LOGIN LOGIC (THE 100% FIX)
        //  This is our proven, universal login code, adapted for this page.
        // =======================================================
        loginForm.addEventListener('submit', async (event) => {
            event.preventDefault(); // Always prevent the default form action

            const username = usernameInput.value.trim();
            const password = passwordInput.value.trim();

            // Simple validation to ensure fields are not empty
            if (!username || !password) {
                alert("Please enter both username and password.");
                return;
            }

            try {
                // Fetch the user data. The path './data/users.json' assumes
                // this HTML file is in the root directory.
                const response = await fetch('../data/users.json'); 
                if (!response.ok) {
                    throw new Error(`Could not load user data. Status: ${response.status}`);
                }

                const users = await response.json();
                
                // Find the user that matches the credentials.
                const user = users.find(u => u.username === username && u.password === password);

                if (user) {
                    // --- SUCCESS ---
                    console.log('Login successful for user:', user.username);
                    
                    // Save all necessary data to localStorage for other pages.
                    localStorage.setItem('loggedInUserId', user.id);
                    localStorage.setItem('loggedInUserRole', user.role);
                    localStorage.setItem('loggedInUsername', user.username);

                    // Redirect to the main dashboard. The path '../pages/dashboard.html' assumes
                    // the dashboard is inside a 'pages' folder.
                    window.location.href = '../pages/dashboard.html';
                } else {
                    // --- FAILURE ---
                    console.warn('Login failed: Invalid credentials.');
                    
                    // Alert the user that the login failed.
                    alert("Invalid username or password. Please try again.");
                }

            } catch (error) {
                console.error('Login process failed:', error);
                alert("An error occurred during login. Please check the console and contact support.");
            }
        });
    });
    </script>
  </body>
</html>
