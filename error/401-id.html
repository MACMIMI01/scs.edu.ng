<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>401 - Access Denied</title>
    <style>
        :root {
            --bg-color: #1a202c;
            --wall-color: #2d3748;
            --elevator-door: #718096;
            --elevator-frame: #4a5568;
            --scan-blue: #63b3ed;
            --denied-red: #e53e3e;
            --avatar-color: #a0aec0;
            --id-card-color: #edf2f7;
            --animation-duration: 10s;
        }

        *, *::before, *::after {
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            margin: 0;
            background-color: var(--bg-color);
            font-family: 'Montserrat', sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scene {
            position: relative;
            width: 80vw;
            height: 90vh;
            background: linear-gradient(var(--wall-color) 70%, #1a1a1a 100%);
        }

        /* --- ELEVATOR --- */
        .elevator {
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 250px;
            height: 400px;
            background-color: var(--elevator-frame);
            border: 10px solid #2d3748;
            border-bottom: none;
            border-radius: 10px 10px 0 0;
            box-shadow: inset 0 10px 15px rgba(0,0,0,0.3);
            animation: elevator-shake var(--animation-duration) forwards ease-in-out;
        }
        .door {
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
            background: linear-gradient(90deg, #a0aec0, var(--elevator-door));
        }
        .door.left {
            left: 0;
            border-right: 2px solid #4a5568;
        }
        .door.right {
            right: 0;
            background: linear-gradient(90deg, var(--elevator-door), #a0aec0);
        }

        /* --- CARD READER --- */
        .card-reader {
            position: absolute;
            bottom: 180px;
            left: calc(50% + 140px);
            width: 50px;
            height: 80px;
            background-color: #2d3748;
            border-radius: 5px;
            border: 2px solid #1a202c;
        }
        .reader-screen {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 30px;
            height: 20px;
            background-color: #1a1a1a;
            border-radius: 3px;
        }
        /* The text inside the screen, animated */
        .reader-screen::after {
            content: 'SCANNING...';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            color: var(--scan-blue);
            font-size: 5px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            opacity: 0;
            animation: reader-status var(--animation-duration) forwards;
        }

        /* --- AVATAR --- */
        .avatar-container {
            position: absolute;
            bottom: 0;
            left: calc(50% - 220px);
            width: 100px;
            height: 200px;
            z-index: 10;
            animation: avatar-approach var(--animation-duration) forwards ease-out;
        }
        .avatar {
            position: absolute;
            bottom: 0;
            width: 80px;
            height: 150px;
            background-color: var(--avatar-color);
            border-radius: 40px 40px 0 0;
        }
        .avatar::before { /* Head */
            content: '';
            position: absolute;
            top: -30px;
            left: 15px;
            width: 50px;
            height: 50px;
            background-color: #cbd5e0;
            border-radius: 50%;
        }
        .arm {
            position: absolute;
            top: 40px;
            left: 70px;
            width: 20px;
            height: 80px;
            background-color: var(--avatar-color);
            border-radius: 10px;
            transform-origin: top center;
            animation: swipe-card var(--animation-duration) forwards ease-in-out;
        }
        .id-card {
            position: absolute;
            bottom: -5px;
            left: -5px;
            width: 30px;
            height: 20px;
            background-color: var(--id-card-color);
            border-radius: 3px;
            border: 1px solid #718096;
        }
        .id-card::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 8px;
            background-color: var(--scan-blue);
        }

        /* --- FINAL TEXT --- */
        .text-box {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: white;
            z-index: 20;
            opacity: 0; /* Hidden by default */
            animation: show-main-text var(--animation-duration) forwards;
        }
        .text-box h1 {
            font-size: 10rem;
            margin: 0;
            color: var(--denied-red);
            text-shadow: 3px 3px 0 #000;
        }
        .text-box p {
            font-size: 1.5rem;
            margin-top: -10px;
        }
        .home-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background-color: var(--scan-blue);
            color: #1a202c;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .home-btn:hover {
            background-color: #90cdf4;
        }

        /* --- KEYFRAME ANIMATIONS --- */
        
        @keyframes avatar-approach {
            0% { transform: translateX(-150px); opacity: 0; }
            20% { transform: translateX(0); opacity: 1; }
            100% { transform: translateX(0); opacity: 1; }
        }

        @keyframes swipe-card {
            0%, 25% { transform: rotate(0deg); }
            40% { transform: rotate(-95deg) translate(-20px, 10px); }
            60% { transform: rotate(-95deg) translate(-20px, 10px); }
            75%, 100% { transform: rotate(0deg); }
        }
        
        @keyframes reader-status {
            0%, 40% { opacity: 0; }
            41% { opacity: 1; content: 'SCANNING...'; color: var(--scan-blue); }
            60% { opacity: 1; content: 'SCANNING...'; color: var(--scan-blue); }
            61% { opacity: 1; content: 'ACCESS DENIED'; color: var(--denied-red); }
            62%, 64%, 66% { background-color: var(--denied-red); } /* Flash effect */
            100% { opacity: 1; content: 'ACCESS DENIED'; color: var(--denied-red); }
        }

        @keyframes elevator-shake {
            0%, 61% { transform: translateX(-50%) rotate(0); }
            62% { transform: translateX(calc(-50% - 3px)) rotate(-0.5deg); }
            63% { transform: translateX(calc(-50% + 3px)) rotate(0.5deg); }
            64% { transform: translateX(calc(-50% - 3px)) rotate(-0.5deg); }
            65%, 100% { transform: translateX(-50%) rotate(0); }
        }

        @keyframes show-main-text {
            0%, 75% { opacity: 0; transform: translate(-50%, 20px); }
            90%, 100% { opacity: 1; transform: translate(-50%, 0); }
        }

    </style>
</head>
<body>

    <div class="scene">
        <div class="elevator">
            <div class="door left"></div>
            <div class="door right"></div>
        </div>

        <div class="card-reader">
            <div class="reader-screen"></div>
        </div>

        <div class="avatar-container">
            <div class="avatar">
                <div class="arm">
                    <div class="id-card"></div>
                </div>
            </div>
        </div>

        <div class="text-box">
            <h1>401</h1>
            <p>ACCESS DENIED</p>
            <a onclick="location.href='../index.html'" class="home-btn">Request Assistance</a>
        </div>
    </div>

</body>
</html>
